<style>
/* ==========================================================================
   PREMIUM EXAMFLOW UI
   ========================================================================== */
:root {
  --bg: #f0f4f8; --card: rgba(255, 255, 255, 0.85); --text: #0f172a; --muted: #64748b;
  --primary: #4f46e5; --primary2: #4338ca; --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
  --border: rgba(226, 232, 240, 0.8);
  --brand-grad: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
  --shadow-sm: 0 2px 4px rgba(15, 23, 42, 0.04); --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.06);
  --shadow-lg: 0 20px 40px rgba(15, 23, 42, 0.08); --shadow-glow: 0 8px 20px rgba(79, 70, 229, 0.25);
  --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px; --radius-xl: 24px;
  --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

* { box-sizing: border-box; }
body {
  margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background: radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.05), transparent 25%),
              radial-gradient(circle at 85% 30%, rgba(124, 58, 237, 0.05), transparent 25%), var(--bg);
  background-attachment: fixed; color: var(--text); -webkit-font-smoothing: antialiased;
}

button, input, textarea, select { font: inherit; }
button { cursor: pointer; border: 0; outline: none; }
.hidden { display: none !important; }
.app { min-height: 100vh; display: flex; flex-direction: column; }

@keyframes slideUpFade { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

/* Navigation */
.topbar { height: 76px; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.5); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: sticky; top: 0; z-index: 40; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02); }
.brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 20px; letter-spacing: -0.5px; color: #0f172a; }
.logo { width: 42px; height: 42px; border-radius: 12px; background: var(--brand-grad); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 20px; box-shadow: var(--shadow-glow); }
.top-actions { display: flex; gap: 12px; align-items: center; }
.pill { padding: 8px 14px; background: rgba(79, 70, 229, 0.1); color: var(--primary); border-radius: 99px; font-size: 13px; font-weight: 700; border: 1px solid rgba(79, 70, 229, 0.15); }

/* Buttons */
.btn { padding: 12px 20px; border-radius: var(--radius-md); font-weight: 700; font-size: 14px; transition: var(--transition); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover:not(:disabled) { transform: translateY(-2px); }
.btn:disabled { opacity: 0.5; pointer-events: none; }
.btn-primary { background: var(--brand-grad); color: #fff; box-shadow: var(--shadow-glow); }
.btn-light { background: #fff; color: #334155; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.btn-light:hover:not(:disabled) { background: #f8fafc; }
.btn-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
.btn-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
.btn-warning { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
.btn-sm { padding: 8px 14px; font-size: 13px; border-radius: var(--radius-sm); }

/* Layout & Cards */
.page { max-width: 1400px; width: 100%; margin: 0 auto; padding: 40px 24px; flex: 1; animation: slideUpFade 0.6s ease-out; }
.hero { padding: 20px 0 30px; text-align: center; }
.hero h1 { font-size: clamp(32px, 4vw, 44px); font-weight: 800; letter-spacing: -1.5px; margin: 0 0 12px; background: linear-gradient(to right, #0f172a, #334155); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: var(--muted); font-size: 17px; max-width: 600px; margin: 0 auto; line-height: 1.6; }
.auth-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; max-width: 1200px; margin: 0 auto; }
.card { background: var(--card); backdrop-filter: blur(20px); border: 1px solid #ffffff; border-radius: var(--radius-xl); box-shadow: var(--shadow-md); padding: 32px; transition: var(--transition); }
.card:hover { box-shadow: var(--shadow-lg); border-color: rgba(255,255,255,0.9); }
.card h2 { margin-top: 0; font-weight: 800; font-size: 20px; letter-spacing: -0.5px; margin-bottom: 8px; }
.card h3 { margin-top: 0; font-weight: 700; }
.exam-choice-card { position: relative; overflow: hidden; padding: 28px; }
.exam-choice-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--brand-grad); }

/* Forms & Dashboard */
.field { margin: 16px 0; }
.field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #475569; }
input, textarea, select { width: 100%; border: 1px solid #cbd5e1; border-radius: var(--radius-md); padding: 12px 16px; background: #f8fafc; color: var(--text); transition: var(--transition); font-size: 14px; }
input:focus, textarea:focus { background: #ffffff; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15); outline: none; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.dashboard-head { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 30px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
.stat { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; }
.stat::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--primary); }
.stat .n { font-size: 32px; font-weight: 800; margin-top: 8px; color: var(--text); letter-spacing: -1px; }

/* Tabs, Tables, Badges */
.tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; background: #e2e8f0; padding: 6px; border-radius: var(--radius-md); width: max-content; }
.tab { padding: 10px 20px; border-radius: 10px; background: transparent; font-weight: 700; color: #64748b; transition: var(--transition); }
.tab.active { background: #fff; color: var(--primary); box-shadow: var(--shadow-sm); }
.table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-md); background: #fff; }
.table { width: 100%; border-collapse: collapse; }
.table th, .table td { padding: 16px 20px; border-bottom: 1px solid var(--border); text-align: left; font-size: 14px; }
.table th { background: #f8fafc; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
.table tr:hover td { background: #f1f5f9; }
.badge { display: inline-flex; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; }
.green { background: #dcfce7; color: #166534; } .red { background: #fee2e2; color: #991b1b; }
.amber { background: #fef3c7; color: #92400e; } .blue { background: #e0e7ff; color: #3730a3; }
.purple { background: #f3e8ff; color: #7e22ce; }

/* Modals & Alerts */
.modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); display: grid; place-items: center; padding: 20px; z-index: 100; animation: fadeIn 0.3s; }
.modal-box { background: #fff; border-radius: var(--radius-xl); width: min(800px, 100%); max-height: 90vh; overflow: auto; padding: 32px; box-shadow: var(--shadow-lg); animation: scaleUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.close { background: #f1f5f9; border-radius: 50%; width: 36px; height: 36px; display: grid; place-items: center; color: #64748b; font-weight: bold; transition: var(--transition); }
.close:hover { background: #e2e8f0; color: #0f172a; transform: rotate(90deg); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } .full { grid-column: 1 / -1; }
.toast { position: fixed; right: 24px; bottom: 24px; background: #0f172a; color: #fff; padding: 16px 24px; border-radius: var(--radius-md); z-index: 200; box-shadow: var(--shadow-lg); font-weight: 600; font-size: 14px; animation: slideUpFade 0.3s; border-left: 4px solid var(--primary); }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 15px; font-weight: 500; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes scaleUp { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

/* FULLSCREEN LIVE COMMAND CENTER */
.cmd-center { position: fixed; inset: 0; background: #0f172a; z-index: 9999; display: flex; flex-direction: column; overflow: hidden; color: #f8fafc; }
.cmd-header { background: #1e293b; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
.cmd-header h2 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 12px; }
.cmd-actions { display: flex; gap: 12px; align-items: center; background: #0f172a; padding: 8px 16px; border-radius: 8px; border: 1px solid #334155; }
.cmd-body { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
.monitor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.monitor-card { background: #1e293b; border: 1px solid #334155; border-radius: var(--radius-lg); overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
.mon-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #1e293b; border-bottom: 1px solid #334155; }
.mon-head b { font-size: 14px; color: #f8fafc; }
.mon-screen { background: #000; aspect-ratio: 16/9; display: grid; place-items: center; color: #64748b; position: relative; }
.mon-screen img { width: 100%; height: 100%; object-fit: contain; position: absolute; top: 0; left: 0; }
.mon-foot { padding: 12px 20px; background: #1e293b; border-top: 1px solid #334155; display: flex; justify-content: flex-end; }
.cmd-badge { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; background: #334155; color: #e2e8f0; }
.cmd-badge.active { background: #10b981; color: #064e3b; }

/* TCS Style Identification Management (Pre-check) */
.tcs-wrapper { min-height: 100vh; background: #e5e7eb; display: flex; flex-direction: column; }
.tcs-header { background: #232f3e; color: #fff; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
.tcs-header h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
.tcs-main { flex: 1; padding: 24px 32px; display: grid; grid-template-columns: 300px 1fr; gap: 24px; max-width: 1400px; margin: 0 auto; width: 100%; }
.tcs-panel { background: #fff; border: 1px solid #d1d5db; border-radius: 4px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
.tcs-panel-head { background: #f3f4f6; border-bottom: 1px solid #d1d5db; padding: 12px 16px; font-weight: 700; color: #374151; font-size: 14px; }
.tcs-candidate-info { padding: 20px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
.tcs-photo { width: 120px; height: 130px; background: #e5e7eb; border: 2px solid #9ca3af; display: grid; place-items: center; color: #6b7280; font-size: 12px; text-align: center; }
.tcs-details-table { width: 100%; font-size: 13px; border-collapse: collapse; }
.tcs-details-table td { padding: 8px 0; border-bottom: 1px dashed #e5e7eb; color: #1f2937; }
.tcs-details-table td:first-child { font-weight: 600; color: #4b5563; width: 40%; }
.tcs-instructions { padding: 24px; font-size: 14px; color: #374151; line-height: 1.6; overflow-y: auto; flex: 1; }
.tcs-instructions h3 { margin-top: 0; color: #dc2626; font-size: 16px; }
.tcs-footer { background: #f9fafb; border-top: 1px solid #d1d5db; padding: 16px 24px; display: flex; flex-direction: column; gap: 16px; }
.tcs-checkbox-wrap { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; font-weight: 600; color: #111827; }
.tcs-actions { display: flex; justify-content: flex-end; gap: 12px; }

/* Lobby UI */
.lobby-ui { min-height: 100vh; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
.lobby-box { background: #1e293b; padding: 40px; border-radius: var(--radius-xl); box-shadow: 0 20px 50px rgba(0,0,0,0.5); max-width: 600px; width: 100%; border: 1px solid #334155; }
.spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* CBT Exam Shell */
.cbt-body { background: #f8fafc; min-height: 100vh; color: #1e293b; display: flex; flex-direction: column; }
.cbt-header { height: 70px; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
.cbt-brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 18px; }
.cbt-emblem { height: 42px; width: 42px; border-radius: 10px; background: var(--brand-grad); color: #fff; display: grid; place-items: center; font-weight: 900; }
.cbt-user { display: flex; align-items: center; gap: 16px; font-size: 13px; }
.cbt-userbox { text-align: right; line-height: 1.4; color: #cbd5e1; }
.cbt-userbox b { display: block; font-size: 15px; color: #fff; }
.cbt-avatar { height: 42px; width: 42px; border-radius: 50%; background: #334155; color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 16px; border: 2px solid #475569; }
.cbt-strip { height: 48px; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; font-size: 13px; color: #64748b; font-weight: 600; }
.cbt-main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; max-width: 1500px; margin: 0 auto; padding: 24px; flex: 1; width: 100%; }
.cbt-question-panel, .cbt-right-panel { background: #fff; border: 1px solid #e2e8f0; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
.cbt-question-panel { display: flex; flex-direction: column; }
.cbt-question-head { padding: 20px 32px; border-bottom: 1px solid #e2e8f0; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; }
.cbt-q-number { font-weight: 800; color: #0f172a; font-size: 18px; }
.cbt-question-content { padding: 32px; flex: 1; overflow-y: auto; }
.cbt-question-text { font-size: 18px; line-height: 1.7; font-weight: 600; color: #1e293b; margin-bottom: 32px; }
.cbt-options { display: grid; gap: 14px; max-width: 800px; }
.cbt-option { display: flex; align-items: center; gap: 16px; border: 2px solid #e2e8f0; border-radius: var(--radius-md); padding: 16px 20px; background: #fff; cursor: pointer; transition: var(--transition); }
.cbt-option.selected { border-color: var(--primary); background: #e0e7ff; }
.cbt-radio { height: 22px; width: 22px; min-width: 22px; border: 2px solid #cbd5e1; border-radius: 50%; display: grid; place-items: center; transition: var(--transition); background: #fff; }
.cbt-option.selected .cbt-radio { border-color: var(--primary); }
.cbt-option.selected .cbt-radio:after { content: ""; height: 10px; width: 10px; border-radius: 50%; background: var(--primary); }
.cbt-option-letter { font-weight: 800; color: #64748b; font-size: 15px; width: 24px; }
.cbt-option.selected .cbt-option-letter { color: var(--primary); }
.cbt-footer { border-top: 1px solid #e2e8f0; padding: 20px 32px; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.cbt-action { border-radius: var(--radius-sm); padding: 12px 24px; font-weight: 700; font-size: 14px; transition: var(--transition); }
.cbt-save { background: #fff; color: #475569; border: 1px solid #cbd5e1; }
.cbt-next { background: var(--primary); color: #fff; border: 1px solid var(--primary); box-shadow: 0 4px 12px rgba(79,70,229,0.2); }
.cbt-submit { background: var(--success); color: #fff; border: 1px solid var(--success); }
.cbt-right-panel { display: flex; flex-direction: column; max-height: calc(100vh - 170px); position: sticky; top: 140px; }
.cbt-profile { padding: 20px; border-bottom: 1px solid #e2e8f0; display: flex; gap: 14px; align-items: center; background: #fff; }
.cbt-timerbox { padding: 24px; border-bottom: 1px solid #e2e8f0; background: #f8fafc; text-align: center; }
.cbt-timer { font-size: 36px; font-weight: 800; font-variant-numeric: tabular-nums; color: #0f172a; line-height: 1; }
.cbt-timer.critical { color: var(--danger); animation: pulseGlow 2s infinite; border-radius: 8px; }
.cbt-grid { padding: 20px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; overflow-y: auto; }
.cbt-qbtn { height: 42px; border: 2px solid #e2e8f0; background: #fff; border-radius: var(--radius-sm); font-weight: 700; font-size: 14px; color: #475569; }
.cbt-qbtn.current { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 10px rgba(79,70,229,0.3); }
.cbt-qbtn.answered { background: var(--success); color: #fff; border-color: var(--success); }
.cbt-security { margin: auto 20px 20px; border: 1px solid #e2e8f0; background: #f8fafc; padding: 16px; border-radius: var(--radius-md); font-size: 12px; line-height: 1.6; color: #64748b; }

.proctor-warning { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 500; background: #ef4444; color: #fff; padding: 16px 24px; border-radius: var(--radius-md); box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4); font-size: 14px; font-weight: 700; text-align: center; animation: slideUpFade 0.3s; }
.proctor-warning.admin-msg { background: #f59e0b; color: #fff; }
.proctor-modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); z-index: 600; display: grid; place-items: center; padding: 20px; }
.proctor-modal-box { background: #fff; width: min(500px, 100%); padding: 40px; border-radius: var(--radius-xl); text-align: center; box-shadow: var(--shadow-lg); }
.result-hero { text-align: center; padding: 40px 20px; background: linear-gradient(to bottom, #fff, #f8fafc); border-bottom: 0; border-radius: var(--radius-xl) var(--radius-xl) 0 0; }
.result-score { font-size: 72px; font-weight: 900; background: var(--brand-grad); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1; margin: 10px 0; }
.result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 0 20px 20px; }
.section-result { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; background: #fff; }

@media(max-width: 900px) { .auth-grid { grid-template-columns: 1fr; } .cbt-main, .tcs-main { grid-template-columns: 1fr; } .cbt-right-panel { position: static; max-height: none; } }

<script type="module">

const firebaseConfig = {
  apiKey: "AIzaSyBKqBYNRY_80b_UOLg1ls9pIKdX-Y8b3CM",
  authDomain: "placement-96094.firebaseapp.com",
  databaseURL: "https://placement-96094-default-rtdb.firebaseio.com",
  projectId: "placement-96094",
  storageBucket: "placement-96094.firebasestorage.app",
  messagingSenderId: "1061247846675",
  appId: "1:1061247846675:web:c6885811fcf1884582b2e6"
};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const ADMIN_PIN="ADMIN2026";
let state={role:null,studentId:null,student:null,exam:null,session:null,timer:null, screenStream:null};
window._cache = {};

const $=id=>document.getElementById(id);
function toast(msg){$("toast").textContent=msg;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),2600)}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function show(html){$("app").innerHTML=html}
function genId(){return "EX"+Math.random().toString(36).slice(2,7).toUpperCase()+Date.now().toString().slice(-4)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function cleanupExamEnvironment(){
  if(state.screenStream)state.screenStream.getTracks().forEach(t=>t.stop());
  if(window.screenCaptureInterval) clearInterval(window.screenCaptureInterval);
  if(window.lobbyListener) { window.lobbyListener(); window.lobbyListener = null; }
  clearInterval(state.timer);
}

// ==========================================
// 1. LANDING PAGE & REGISTRATION
// ==========================================
window.landing = async () => {

window.submitRegistration = async () => {
    let name = $("regName").value.trim();
    let email = $("regEmail").value.trim();
    
    if(!name || !email) return toast("Name and Email are required.");
    
    let btn = document.querySelector(".auth-grid .card:nth-child(1) button");
    let originalText = btn.innerText;
    btn.innerText = "Submitting...";
    btn.disabled = true;

    try {
        // Generate 10-digit Roll Number silently
        let generatedRoll = Math.floor(1000000000 + Math.random() * 9000000000).toString();
        
        // Save to Firebase as 'unassigned' (no exam scheduled yet)
        await set(ref(db, "verifications/" + generatedRoll), {
            roll: generatedRoll, safeRoll: generatedRoll, name, phone: $("regPhone").value.trim(), email, dept: $("regDept").value.trim(),
            status: 'unassigned', timestamp: Date.now()
        });
        
        alert("Registration Submitted Successfully!\n\nYour details have been received. You will receive an automated email containing your Roll Number and Exam Date once the Administrator schedules your test.");
        
        // Clear form
        $("regName").value = ""; $("regPhone").value = ""; $("regEmail").value = ""; $("regDept").value = "";
    } catch (e) {
        console.error(e);
        toast("Failed to submit registration.");
    } finally {
        btn.innerText = originalText;
        btn.disabled = false;
    }
};

window.studentLogin = async () => {
    let originalRoll = $("loginRoll").value.trim().toUpperCase();
    let safeRoll = originalRoll.replace(/[\/\.#$\[\]]/g, "-");
    let secret = $("loginSecret").value.trim();
    if(!safeRoll || !secret) return toast("Enter Roll Number and Secret ID.");
    
    let s = await get(ref(db, "students/" + safeRoll));
    if(!s.exists()) return toast("Invalid Roll Number. Have you been verified?");
    let studentData = s.val();
    
    if(studentData.secretId !== secret) return toast("Invalid Secret ID.");
    
    // Check if the 10-minute validity window has passed
    if(studentData.secretExpiry && Date.now() > studentData.secretExpiry) {
        return toast("Secret ID has expired (Valid for 10 mins only). Please see the Invigilator.");
    }
    
    if(studentData.active === false) return toast("This account is disabled or the exam is already completed.");
    
    state.role = "student"; state.studentId = safeRoll; state.student = studentData;
    studentHome();
};

window.scheduleAndEmail = async (safeRoll) => {
    let examId = $(`exam-${safeRoll}`).value;
    let dateVal = $(`date-${safeRoll}`).value;
    
    if(!examId || !dateVal) return toast("Please select an exam and date/time.");
    
    let v = window._cache.verifications[safeRoll];
    let exam = window._cache.exams[examId];
    let examName = exam.name;
    let formattedDate = new Date(dateVal).toLocaleString();
    
    let btn = event.target;
    let originalText = btn.innerText;
    btn.innerText = "Sending Mail Automatically...";
    btn.disabled = true;

    try {
        // 1. Update Firebase status
        await update(ref(db, "verifications/" + safeRoll), { 
            status: 'pending', 
            examId: examId, 
            examDate: dateVal 
        });
        
        // 2. Auto-Calculate the Exam Pattern from the uploaded JSON
        let patternMap = {};
        let totalQ = 0, totalM = 0, totalSecs = 0;
        
        (exam.questions || []).forEach(q => {
            let sec = q.section || "General";
            if(!patternMap[sec]) patternMap[sec] = { q: 0, m: 0, t: 0 };
            patternMap[sec].q += 1;
            patternMap[sec].m += q.marks;
            patternMap[sec].t += q.allocatedTime;
            totalQ += 1;
            totalM += q.marks;
            totalSecs += q.allocatedTime;
        });

        // 3. Format the Pattern as a clean Text Table
        let pad = (str, len) => str.toString().padEnd(len, ' ');
        let tableText = `---------------------------------------------------------\n`;
        tableText += `${pad("SECTION", 20)} | ${pad("QNS", 5)} | ${pad("MARKS", 7)} | ${pad("TIME(m)", 7)}\n`;
        tableText += `---------------------------------------------------------\n`;
        
        Object.entries(patternMap).forEach(([sec, data]) => {
            let sName = sec.length > 18 ? sec.substring(0, 15) + '...' : sec;
            tableText += `${pad(sName, 20)} | ${pad(data.q, 5)} | ${pad(data.m, 7)} | ${pad((data.t/60).toFixed(1), 7)}\n`;
        });
        tableText += `---------------------------------------------------------\n`;
        tableText += `${pad("TOTAL", 20)} | ${pad(totalQ, 5)} | ${pad(totalM, 7)} | ${pad((totalSecs/60).toFixed(1), 7)}\n`;
        tableText += `---------------------------------------------------------`;

        // 4. Prepare the detailed "Big Mail" with the injected table
        let subject = `OFFICIAL NOTIFICATION: Exam Schedule & Roll Number Assignment`;
        let bodyText = `Dear ${v.name},

This is an official communication from the Examination Authority regarding your recent registration.

We are pleased to inform you that your application has been successfully processed and your examination has been scheduled. Please find your official Examination Credentials and Schedule below:

---------------------------------------------------------
CANDIDATE EXAMINATION DETAILS
---------------------------------------------------------
Candidate Name      : ${v.name}
Department          : ${v.dept}
Examination Name    : ${examName}
Reporting Date/Time : ${formattedDate}

SYSTEM GENERATED ROLL NUMBER: 
>>  ${v.roll}  <<
---------------------------------------------------------

EXAMINATION PATTERN SUMMARY:
${tableText}

IMPORTANT INSTRUCTIONS FOR EXAM DAY:
1. Please carry this mail print out during entry.
2. Present the above Roll Number to the Invigilator at the verification desk.
3. Upon successful physical verification, the Invigilator will generate and hand over your 'Secret Login ID'.
4. You will require BOTH your Roll Number and the Secret Login ID to access the examination portal.
5. The examination is strictly proctored. You will be required to share your entire screen during the test.

Best Regards,
Examination Administration Team`;

        // =========================================================
        // 5. YOUR GOOGLE SCRIPT URL
        // =========================================================
        let scriptUrl = "https://script.google.com/macros/s/AKfycbxWG0xqsw6lVAg7XGBssuTr6o1l-L5X_ZM_9D4xBX7ksH7_KFchwNdGLrJaObNYi7Q/exec"; 

        // 6. Send the email automatically in the background
        await fetch(scriptUrl, {
            method: "POST",
            mode: "no-cors", // Bypasses CORS blocks
            headers: {
                "Content-Type": "text/plain",
            },
            body: JSON.stringify({ 
                to: v.email, 
                subject: subject, 
                body: bodyText 
            })
        });

        toast("Candidate scheduled & Email sent successfully!");
        adminScheduling(); // Refresh UI
        
    } catch (e) {
        console.error(e);
        toast("Failed to schedule candidate.");
        btn.innerText = originalText;
        btn.disabled = false;
    }
};};

            let badgeClass = s.status === 'live' ? 'purple' : (s.status === 'ready' ? 'success' : 'amber');

            html += `
            <div class="monitor-card">
                <div class="mon-head"><div><b>${esc(displayRoll)}</b> <span style="display:block; font-size:11px; color:#94a3b8">${esc(sName)}</span></div><span class="badge ${badgeClass}">${statusTxt}</span></div>
                <div class="mon-screen"><img id="mon-img-${sid}" src="" alt="Awaiting screen data..."/></div>
                <div class="mon-foot"><button class="btn btn-sm btn-warning" onclick="sendWarning('${cmdState.eid}', '${sid}')">⚠ Send Warning</button></div>
            </div>`;
        });
    }
    if($("cmdGrid")) $("cmdGrid").innerHTML = html;

    batch.forEach(sid => {
        let unsub = onValue(ref(db, "screens/" + sid), snap => {
            if(snap.exists() && $("mon-img-" + sid)) $("mon-img-" + sid).src = snap.val().img;
        });
        cmdState.listeners.push(unsub);
    });
};

window.cmdNext = () => { cmdState.page++; renderCmdGrid(); };
window.cmdPrev = () => { cmdState.page = Math.max(0, cmdState.page - 1); renderCmdGrid(); };
window.toggleCmdLoop = () => {
    if(cmdState.loopInterval) { clearInterval(cmdState.loopInterval); cmdState.loopInterval = null; $("cmdLoopBtn").innerText = "Start Auto-Loop"; $("cmdLoopBtn").className = "btn btn-sm btn-light"; }
    else { cmdState.loopInterval = setInterval(() => { cmdState.page++; renderCmdGrid(); }, 8000); $("cmdLoopBtn").innerText = "Stop Auto-Loop"; $("cmdLoopBtn").className = "btn btn-sm btn-success"; }
};
window.sendWarning = (eid, sid) => {
    let msg = prompt("Enter a warning message to send to candidate " + sid + ":");
    if(msg) { set(ref(db, `examSessions/${eid}/${sid}/warning`), { msg, t: Date.now() }); toast("Warning sent securely."); }
};

// 4. STUDENT WORKFLOW (LOBBY -> SCREEN -> EXAM)
// ==========================================
async function studentHome(){
    let snap = await get(ref(db,"exams")); let exams = snap.exists() ? snap.val() : {};
    let available = Object.entries(exams).filter(([id,e])=>e.status==="published");
    let cards = available.map(([id,e])=>`<div class="card exam-choice-card"><div style="display:flex;justify-content:space-between;gap:15px;align-items:flex-start"><div><span class="badge blue">AVAILABLE</span><h2 style="margin:12px 0 6px">${esc(e.name)}</h2></div><span class="badge blue">${esc(id)}</span></div><button class="btn btn-primary" style="width:100%; margin-top:20px" onclick="joinExamLobby('${id}')">Join Examination Lobby →</button></div>`).join("");
    
    show(`<div class="app"><div class="topbar"><div class="brand"><div class="logo">E</div><div>ExamFlow<div class="small muted">Student Portal</div></div></div><div class="top-actions"><span class="pill">${esc(state.student.name)} · Roll: ${esc(state.student.roll)}</span><button class="btn btn-light btn-sm" onclick="landing()">Logout</button></div></div>
    <div class="page"><div class="hero" style="text-align:left;padding-bottom:25px"><div class="badge blue">CANDIDATE DASHBOARD</div><h1 style="margin-top:14px">Examination Center</h1><p style="margin-left:0">Select your examination below to enter the secure waiting lobby.</p></div>
    <div style="display:grid;gap:18px; max-width:800px">${cards||`<div class="card empty">No examination is currently published.</div>`}</div></div></div>`);
}

window.joinExamLobby = async (eid) => {
    let snap = await get(ref(db,"exams/"+eid)); if(!snap.exists()) return toast("Exam not found");
    let exam = snap.val();
    let existing = await get(ref(db,"examSessions/"+eid+"/"+state.studentId));
    if(existing.exists() && existing.val().status==="completed") return toast("You have already completed this examination.");
    
    let qs = exam.questions.map(q=>{let opts=q.options.map((text,i)=>({text,original:i}));opts=shuffle(opts);return {...q,displayed:opts}});
    state.exam = exam; state.examId = eid; state.pendingQuestions = qs;
    
    await set(ref(db, "examSessions/"+eid+"/"+state.studentId), { studentId: state.studentId, studentName: state.student.name, status: "waiting" });

    show(`<div class="lobby-ui" id="lobbyContainer"><div class="lobby-box"><div class="spinner"></div><h2>Connecting to Secure Server...</h2><p>Please wait.</p></div></div>`);
    
    window.lobbyListener = onValue(ref(db, "examControls/" + eid), ctrlSnap => {
        let phase = ctrlSnap.exists() ? ctrlSnap.val().phase : 'lobby';
        
        if (phase === 'lobby') {
            $("lobbyContainer").innerHTML = `<div class="lobby-box"><div class="spinner"></div><h2>Waiting in Lobby</h2><p>The invigilator has not initiated the session yet. Please remain on this screen.</p></div>`;
        } 
        else if (phase === 'screenshare' && $("lobbyContainer")) {
            showExamInstructions(false); // Render TCS UI, start button disabled
        } 
        else if (phase === 'started') {
            if ($("lobbyContainer")) {
                showExamInstructions(true); // Admin started while student just got here
            } else if (state.screenStream) {
                confirmStartExam(); // Start instantly since screen is shared
            } else if ($("tcsStartBtn")) {
                toast("The exam has started! You MUST share your screen to begin.");
                $("tcsStartBtn").innerText = "Exam Started! Share Screen to Begin.";
                $("tcsStartBtn").classList.replace("btn-primary", "btn-danger");
                state.examWasAlreadyStarted = true;
            }
        }
    });
};

function showExamInstructions(isExamStarted = false){
    show(`
    <div class="tcs-wrapper">
        <div class="tcs-header"><h2>System Assessment Management (SAM)</h2><div>${esc(state.exam.name)}</div></div>
        <div class="tcs-main">
            <div class="tcs-panel">
                <div class="tcs-panel-head">Candidate Profile</div>
                <div class="tcs-candidate-info">
                    <div class="tcs-photo">PHOTO<br>UNAVAILABLE</div>
                    <table class="tcs-details-table">
                        <tr><td>Name</td><td>${esc(state.student.name)}</td></tr>
                        <tr><td>Roll No</td><td>${esc(state.student.roll)}</td></tr>
                        <tr><td>Dept</td><td>${esc(state.student.department||"-")}</td></tr>
                        <tr><td>System Status</td><td><span class="badge green">Secured</span></td></tr>
                    </table>
                </div>
            </div>
            <div class="tcs-panel">

                        <li><b>Strict Proctoring:</b> This examination strictly monitors your screen and mouse activity. <b>You must share your Entire Screen</b> to proceed.</li>

window.toggleTcsStart = () => { let checked = $("tcsCheck").checked; $("tcsShareBtn").disabled = !checked; };

// Starts Screen Capture BEFORE EXAM STARTS to feed live monitor
window.enableScreenShare = async () => {
    try {
        let stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: "monitor" } });
        state.screenStream = stream;
        
        let track = stream.getVideoTracks()[0];
        if(track.getSettings().displaySurface !== 'monitor') toast("WARNING: You did not share your 'Entire Screen'. Admin may flag your session.");

        state.hiddenVideo = document.createElement("video");
        state.hiddenVideo.autoplay = true; state.hiddenVideo.muted = true; state.hiddenVideo.playsInline = true;
        state.hiddenVideo.srcObject = stream;
        
        // Ensure video is playing so canvas isn't black
        state.hiddenVideo.onloadedmetadata = () => {
            state.hiddenVideo.play().catch(e => console.error(e));
        };
        
        // INSTANT CAPTURE START - Feeds admin monitor before exam starts
        let canvas = document.createElement("canvas");
        canvas.width = 640; canvas.height = 360;
        let ctx = canvas.getContext("2d");
        window.screenCaptureInterval = setInterval(() => {
            if(state.hiddenVideo && state.hiddenVideo.readyState >= 2) {
                ctx.drawImage(state.hiddenVideo, 0, 0, canvas.width, canvas.height);
                set(ref(db, "screens/" + state.studentId), { img: canvas.toDataURL("image/jpeg", 0.25), t: Date.now() });
            }
        }, 3000); 

        await update(ref(db, "examSessions/"+state.examId+"/"+state.studentId), { status: "ready" });

        $("tcsShareBtn").classList.replace("btn-light", "btn-success");
        $("tcsShareBtn").innerText = "✔ Screen Shared";
        $("tcsStartBtn").style.display = "inline-flex";
        
        if(state.examWasAlreadyStarted) {
            confirmStartExam(); // INSTANT START
        } else {
            $("tcsStartBtn").disabled = true;
            $("tcsStartBtn").innerText = "Waiting for Invigilator to start exam...";
        }
    } catch(e) { toast("You must share your screen to proceed."); }
};

window.confirmStartExam = async () => {
    if(!state.screenStream) return toast("Please complete screen sharing first.");
    if(window.lobbyListener) { window.lobbyListener(); window.lobbyListener = null; } 
    await beginSecureExam();
};

window.beginSecureExam=async()=>{
  try{await document.documentElement.requestFullscreen();}catch(e){}
  
  let questions=state.pendingQuestions;
  state.session={studentId:state.studentId,studentName:state.student.name,status:"live",currentIndex:0,totalQuestions:questions.length,
  startedAt:Date.now(),timeLeft:questions[0].allocatedTime,responses:{},questions};
  await update(ref(db,"examSessions/"+state.examId+"/"+state.studentId),state.session);
  
  onValue(ref(db, `examSessions/${state.examId}/${state.studentId}/warning`), snap => {
      if(!snap.exists()) return; let w = snap.val();
      if(w.t > state.session.startedAt && w.t !== state.lastWarningT) { state.lastWarningT = w.t; showProctorWarning("ADMINISTRATOR MESSAGE: " + w.msg, true); }
  });

  renderExam();
};


// ==========================================
// 5. RENDER EXAM, SECURITY, RESULTS
// ==========================================
function renderExam(){
clearInterval(state.timer);
let s=state.session,q=s.questions[s.currentIndex],chosen=s.responses[s.currentIndex]?.selectedOriginal;
let answeredCount=Object.keys(s.responses||{}).length;
show(`<div class="cbt-body">
<header class="cbt-header"><div class="cbt-brand"><div class="cbt-emblem">SAM</div><div>${esc(state.exam.name)}</div></div><div class="cbt-user"><div class="cbt-userbox"><b>${esc(state.student.name)}</b>${esc(state.student.roll)}</div><div class="cbt-avatar">${esc((state.student.name||"S").slice(0,1).toUpperCase())}</div></div></header>
<div class="cbt-strip"><span><b>Mode:</b> Secure Computer Based Test</span><span><button class="btn btn-sm btn-light" onclick="requestExamFullscreen()">⛶ Full Screen</button></span></div>
<div class="cbt-main">
<main class="cbt-question-panel">
  <div class="cbt-question-head"><div class="cbt-q-number">Question No. ${s.currentIndex+1}</div><div class="cbt-marks">Section: <b>${esc(q.section)}</b> &nbsp; | &nbsp; Marks: <b>${q.marks}</b></div></div>
  <div class="cbt-question-content"><div class="cbt-question-text">${esc(q.text)}</div><div class="cbt-options">
      ${q.displayed.map((o,i)=>`<div class="cbt-option ${chosen===o.original?"selected":""}" id="cbtopt${i}" onclick="chooseOption(${o.original})"><div class="cbt-radio"></div><div class="cbt-option-letter">${String.fromCharCode(65+i)}</div><div>${esc(o.text)}</div></div>`).join("")}
  </div></div>
  <div class="cbt-footer"><div class="small muted">Answered: ${answeredCount} / ${s.totalQuestions}</div><div style="display:flex;gap:8px"><button class="btn btn-light" onclick="clearCurrentAnswer()">Clear Response</button><button class="btn ${s.currentIndex===s.totalQuestions-1?"btn-success":"btn-primary"}" onclick="nextQuestion()">${s.currentIndex===s.totalQuestions-1?"Submit Test":"Save & Next"}</button></div></div>
</main>
<aside class="cbt-right-panel">
  <div class="cbt-profile"><div class="cbt-avatar" style="background:#e2e8f0;color:#0f172a">${esc((state.student.name||"S").slice(0,1).toUpperCase())}</div><div><b>${esc(state.student.name)}</b><small>Roll: ${esc(state.student.roll)}</small></div></div>
  <div class="cbt-timerbox"><div class="small muted" style="margin-bottom:8px;font-weight:700">TIME REMAINING</div><div class="cbt-timer" id="timer">${fmt(s.timeLeft)}</div></div>
  <div style="padding:15px; font-weight:700; border-bottom:1px solid #e2e8f0">Question Palette</div>
  <div class="cbt-grid">${s.questions.map((x,i)=>{let cls=i===s.currentIndex?"current":(s.responses[i]?"answered":"");return `<button class="cbt-qbtn ${cls}" disabled>${i+1}</button>`;}).join("")}</div>
  <div class="cbt-security"><strong>Security Monitor</strong><span style="color:#10b981;font-weight:800">● Active</span><br>Local Warnings: <span id="violationCount">${state.proctor?.violations||0}</span></div>
</aside>
</div></div>`);
startTimer();
}

window.clearCurrentAnswer=()=>{ delete state.session.responses[state.session.currentIndex]; document.querySelectorAll(".cbt-option").forEach(x=>x.classList.remove("selected")); toast("Response cleared"); };
window.requestExamFullscreen=async()=>{ try{await document.documentElement.requestFullscreen();}catch(e){} };

function showProctorWarning(message, isAdmin = false){
  state.proctor=state.proctor||{violations:0}; if(!isAdmin) state.proctor.violations++;
  let old=document.querySelector(".proctor-warning");if(old)old.remove();
  let d=document.createElement("div"); d.className="proctor-warning"; if(isAdmin) d.classList.add("admin-msg");
  d.innerHTML=`⚠ ${esc(message)} ${!isAdmin ? `<span class="count">Warning ${state.proctor.violations}/3</span>` : ''}`;
  document.body.appendChild(d); if($('violationCount'))$('violationCount').innerText = state.proctor.violations;
  setTimeout(()=>d.remove(), 4500); if(!isAdmin && state.proctor.violations>=3) showSecurityLock();
}

function showSecurityLock(){
  let old=document.querySelector(".proctor-modal");if(old)return;
  let d=document.createElement("div");d.className="proctor-modal";
  d.innerHTML=`<div class="proctor-modal-box"><h2>Security Warning</h2><p>The examination window lost focus multiple times. Return to the examination screen and confirm you are ready to continue.</p><button class="btn btn-primary" onclick="resumeAfterSecurity()">I am ready to continue</button></div>`;
  document.body.appendChild(d);
}
window.resumeAfterSecurity=()=>{document.querySelector(".proctor-modal")?.remove();state.proctor.violations=0;requestExamFullscreen()};

function installProctoring(){
  state.proctor=state.proctor||{violations:0}; if(state.proctor.listenersInstalled)return; state.proctor.listenersInstalled=true;
  document.addEventListener("visibilitychange",()=>{ if(document.hidden && state.role==="student" && state.session?.status==="live")showProctorWarning("You left the examination window."); });
  window.addEventListener("blur",()=>{ if(state.role==="student" && state.session?.status==="live")showProctorWarning("Examination window lost focus."); });
  document.addEventListener("contextmenu",e=>{if(state.role==="student"&&state.session?.status==="live")e.preventDefault()});
  ['copy','cut','paste'].forEach(ev => document.addEventListener(ev, e=>{if(state.role==="student"&&state.session?.status==="live")e.preventDefault()}));
  document.addEventListener("keydown",e=>{
    if(state.role!=="student"||state.session?.status!=="live")return;
    if((e.ctrlKey||e.metaKey)&&["c","x","v","u","s","p"].includes(e.key.toLowerCase())){e.preventDefault();showProctorWarning("This keyboard action is disabled.");}
    if(e.key==="F12"||e.key==="PrintScreen"){e.preventDefault();showProctorWarning("This action is disabled.");}
  });
  window.addEventListener("beforeunload",e=>{ if(state.role==="student"&&state.session?.status==="live"){e.preventDefault();e.returnValue="Your examination is in progress.";} });
}
installProctoring();

function fmt(sec){sec=Math.max(0,Math.ceil(sec));return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function startTimer(){
let end=Date.now()+state.session.timeLeft*1000;
state.timer=setInterval(()=>{state.session.timeLeft=Math.max(0,Math.ceil((end-Date.now())/1000));let t=$("timer");if(t)t.textContent=fmt(state.session.timeLeft);if(t&&state.session.timeLeft<=10)t.classList.add("critical");if(state.session.timeLeft<=0){clearInterval(state.timer);timeUp()}},250);
}
window.chooseOption=original=>{ let q=state.session.questions[state.session.currentIndex]; state.session.responses[state.session.currentIndex]={selectedOriginal:original,questionId:q.id,section:q.section,marks:q.marks,timeUsed:q.allocatedTime-state.session.timeLeft}; document.querySelectorAll(".cbt-option").forEach(x=>x.classList.remove("selected")); let idx=q.displayed.findIndex(x=>x.original===original);if($("cbtopt"+idx))$("cbtopt"+idx).classList.add("selected"); };
async function saveSession(){await update(ref(db,"examSessions/"+state.examId+"/"+state.studentId),state.session)}
window.nextQuestion=async()=>{clearInterval(state.timer);await saveSession();if(state.session.currentIndex===state.session.totalQuestions-1){finishExam();return}state.session.currentIndex++;state.session.timeLeft=state.session.questions[state.session.currentIndex].allocatedTime;await saveSession();renderExam()};
async function timeUp(){await saveSession();show(`<div class="modal"><div class="modal-box" style="text-align:center"><h1>TIME UP</h1><p>Question locked.</p></div></div>`); setTimeout(async()=>{if(state.session.currentIndex===state.session.totalQuestions-1){finishExam();return}state.session.currentIndex++;state.session.timeLeft=state.session.questions[state.session.currentIndex].allocatedTime;await saveSession();renderExam()},2000)}

async function finishExam(){
    clearInterval(window.screenCaptureInterval); 
    if(state.screenStream) state.screenStream.getTracks().forEach(t=>t.stop());
    
    let s=state.session, obtained=0, correct=0, wrong=0, unanswered=0, sections={};
    
    s.questions.forEach((q,i)=>{ 
        let r=s.responses[i], ok=r&&Number(r.selectedOriginal)===Number(q.correctIndex); 
        let marks=ok?q.marks:0;
        if(r){if(ok)correct++;else wrong++}else unanswered++; 
        obtained+=marks;
        if(!sections[q.section])sections[q.section]={marks:0,total:0,correct:0,wrong:0,unanswered:0}; 
        sections[q.section].marks+=marks; sections[q.section].total+=q.marks;
        if(r){ok?sections[q.section].correct++:sections[q.section].wrong++}else sections[q.section].unanswered++; 
    });
    
    let sectionResults={}; let overallPass=true;
    Object.entries(sections).forEach(([name,x])=>{let pct=x.total?x.marks/x.total*100:0;let pass=pct>=65;if(!pass)overallPass=false;sectionResults[name]={...x,percentage:pct,pass}});
    
    let result={studentId:state.studentId, studentName:state.student.name, examId:state.examId, examName:state.exam.name, obtained, totalMarks:state.exam.totalMarks, percentage:state.exam.totalMarks?obtained/state.exam.totalMarks*100:0, overallPass, correct, wrong, unanswered, sectionResults, responses:s.responses, completedAt:Date.now()};
    
    // Save Result
    await set(ref(db,"examResults/"+state.examId+"/"+state.studentId), result); 
    await update(ref(db,"examSessions/"+state.examId+"/"+state.studentId), {status:"completed", completedAt:Date.now()});
    await set(ref(db, "screens/" + state.studentId), null); 
    
    // SECURITY: Delete Secret ID and deactivate student so they can never log back in
    await update(ref(db, "students/" + state.studentId), { secretId: null, secretExpiry: null, active: false });
    
    state.result=result; 
    show(`<div class="app"><div class="topbar"><div class="brand"><div class="logo">E</div>ExamFlow</div></div><div class="page"><div class="card result-hero"><div class="muted">Examination Completed</div><div class="result-score">${result.obtained} / ${result.totalMarks}</div><h2>${result.overallPass?"PASS":"FAIL"}</h2></div><div style="text-align:center;margin-top:20px"><button class="btn btn-light" onclick="landing()">Exit</button></div></div></div>`);
}

// Admin Utilities
window.adminResults=()=>{ setTab('tab-results'); window.currentAdminTab = 'results'; let results=window._cache.results||{}; let exams=window._cache.exams||{},rows=[]; Object.entries(results).forEach(([eid,rs])=>Object.entries(rs||{}).forEach(([sid,r])=>rows.push(`<tr><td>${esc(sid.replace(/-/g,"/"))}</td><td>${esc(r.examName||exams[eid]?.name||eid)}</td><td>${r.obtained}/${r.totalMarks}</td><td>${Number(r.percentage||0).toFixed(1)}%</td><td><span class="badge ${r.overallPass?"green":"red"}">${r.overallPass?"PASS":"FAIL"}</span></td></tr>`))); $("adminContent").innerHTML=`<div class="card"><h2>Results</h2><div class="table-wrap">${rows.length?`<table class="table"><thead><tr><th>Student</th><th>Exam</th><th>Score</th><th>Percentage</th><th>Result</th></tr></thead><tbody>${rows.join("")}</tbody></table>`:`<div class="empty">No completed results.</div>`}</div></div>`; };
window.openExamModal=()=>{ $("app").insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h2>Create Examination</h2><button class="close" onclick="$('modal').remove()">✕</button></div><div class="form-grid"><div class="field full"><label>Exam Name</label><input id="en" placeholder="Example: Mock Test"></div><div class="field"><label>Exam ID</label><input id="ei" value="${genId()}"></div><div class="field"><label>Instructions</label><input id="ein" value="Read carefully. No going back."></div><div class="field full"><label>Questions JSON</label><textarea id="qjson" placeholder='[ {"q":"Ohm law is?","a":["V=IR","P=VI","I=V/R","All"],"correct":0,"marks":2,"time":30,"section":"Basics"} ]'></textarea></div></div><br><button class="btn btn-primary" onclick="createExam()">Create Exam</button></div></div>`) };
window.createExam=async()=>{ try{ let id=$("ei").value.trim().toUpperCase(),name=$("en").value.trim(),questions=JSON.parse($("qjson").value); let clean=questions.map((q,i)=>{return { id:i+1,text:q.q,options:q.a,correctIndex:Number(q.correct),marks:Number(q.marks||1),allocatedTime:Number(q.time||30),section:q.section||"General"}}); let total=clean.reduce((a,q)=>a+q.marks,0); await set(ref(db,"exams/"+id),{id,name,instructions:$("ein").value,questions:clean,totalMarks:total,status:"draft",createdAt:Date.now()}); $("modal").remove();toast("Exam created");adminExams(); }catch(e){toast(e.message||"Could not create exam")} };
window.toggleExam=async id=>{let e=window._cache.exams[id];await update(ref(db,"exams/"+id),{status:e.status==="published"?"draft":"published"}); toast("Exam status updated"); adminExams(); };
window.deleteExam=async id=>{if(!confirm("Delete this examination?"))return;await set(ref(db,"exams/"+id),null); toast("Exam deleted"); adminExams(); };
