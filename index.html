<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ExamFlow | Online Examination System</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   PREMIUM EXAMFLOW UI
   ========================================================================== */
:root {
  --bg: #f0f4f8; --card: rgba(255, 255, 255, 0.85); --text: #0f172a; --muted: #64748b;
  --primary: #4f46e5; --primary2: #4338ca; --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
  --border: rgba(226, 232, 240, 0.8);
  --brand-grad: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
  --shadow-sm: 0 2px 4px rgba(15, 23, 42, 0.04); --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.06);
  --shadow-lg: 0 20px 40px rgba(15, 23, 42, 0.08); --shadow-glow: 0 8px 20px rgba(79, 70, 229, 0.25);
  --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px; --radius-xl: 24px;
  --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

* { box-sizing: border-box; }
body {
  margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background: radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.05), transparent 25%),
              radial-gradient(circle at 85% 30%, rgba(124, 58, 237, 0.05), transparent 25%), var(--bg);
  background-attachment: fixed; color: var(--text); -webkit-font-smoothing: antialiased;
}

button, input, textarea, select { font: inherit; }
button { cursor: pointer; border: 0; outline: none; }
.hidden { display: none !important; }
.app { min-height: 100vh; display: flex; flex-direction: column; }

@keyframes slideUpFade { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

/* Navigation */
.topbar { height: 76px; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.5); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: sticky; top: 0; z-index: 40; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02); }
.brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 20px; letter-spacing: -0.5px; color: #0f172a; }
.logo { width: 42px; height: 42px; border-radius: 12px; background: var(--brand-grad); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 20px; box-shadow: var(--shadow-glow); }
.top-actions { display: flex; gap: 12px; align-items: center; }
.pill { padding: 8px 14px; background: rgba(79, 70, 229, 0.1); color: var(--primary); border-radius: 99px; font-size: 13px; font-weight: 700; border: 1px solid rgba(79, 70, 229, 0.15); }

/* Buttons */
.btn { padding: 12px 20px; border-radius: var(--radius-md); font-weight: 700; font-size: 14px; transition: var(--transition); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { transform: translateY(-2px); }
.btn:disabled { opacity: 0.5; pointer-events: none; }
.btn-primary { background: var(--brand-grad); color: #fff; box-shadow: var(--shadow-glow); }
.btn-primary:hover { box-shadow: 0 12px 24px rgba(79, 70, 229, 0.35); }
.btn-light { background: #fff; color: #334155; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.btn-light:hover { background: #f8fafc; border-color: #cbd5e1; box-shadow: var(--shadow-md); }
.btn-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
.btn-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
.btn-warning { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
.btn-sm { padding: 8px 14px; font-size: 13px; border-radius: var(--radius-sm); }

/* Layout & Cards */
.page { max-width: 1280px; width: 100%; margin: 0 auto; padding: 40px 24px; flex: 1; animation: slideUpFade 0.6s ease-out; }
.hero { padding: 30px 0 40px; text-align: center; }
.hero h1 { font-size: clamp(36px, 5vw, 48px); font-weight: 800; letter-spacing: -1.5px; margin: 0 0 12px; background: linear-gradient(to right, #0f172a, #334155); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: var(--muted); font-size: 18px; max-width: 600px; margin: 0 auto; line-height: 1.6; }
.auth-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; max-width: 900px; margin: 0 auto; }
.card { background: var(--card); backdrop-filter: blur(20px); border: 1px solid #ffffff; border-radius: var(--radius-xl); box-shadow: var(--shadow-md); padding: 32px; transition: var(--transition); }
.card:hover { box-shadow: var(--shadow-lg); border-color: rgba(255,255,255,0.9); }
.card h2 { margin-top: 0; font-weight: 800; font-size: 22px; letter-spacing: -0.5px; }
.card h3 { margin-top: 0; font-weight: 700; }
.exam-choice-card { position: relative; overflow: hidden; padding: 28px; }
.exam-choice-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--brand-grad); }
.exam-choice-card:hover { transform: translateY(-5px); }

/* Forms & Dashboard */
.field { margin: 18px 0; }
.field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #475569; }
input, textarea, select { width: 100%; border: 1px solid #cbd5e1; border-radius: var(--radius-md); padding: 14px 16px; background: #f8fafc; color: var(--text); transition: var(--transition); font-size: 14px; }
input:focus, textarea:focus { background: #ffffff; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15); outline: none; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.dashboard-head { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 30px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
.stat { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; }
.stat::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.stat:nth-child(1)::before { background: #3b82f6; } .stat:nth-child(2)::before { background: #8b5cf6; }
.stat:nth-child(3)::before { background: #10b981; } .stat:nth-child(4)::before { background: #f59e0b; }
.stat .n { font-size: 32px; font-weight: 800; margin-top: 8px; color: var(--text); letter-spacing: -1px; }

/* Admin Grid Monitor */
.monitor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 15px; }
.monitor-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; }
.mon-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #f8fafc; border-bottom: 1px solid var(--border); }
.mon-head b { font-size: 14px; color: #1e293b; }
.mon-screen { background: #0f172a; aspect-ratio: 16/9; display: grid; place-items: center; color: #64748b; position: relative; }
.mon-screen img { width: 100%; height: 100%; object-fit: contain; position: absolute; top: 0; left: 0; }
.mon-foot { padding: 12px 20px; background: #fff; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; }

/* Tabs, Tables, Badges */
.tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; background: #e2e8f0; padding: 6px; border-radius: var(--radius-md); width: max-content; }
.tab { padding: 10px 20px; border-radius: 10px; background: transparent; font-weight: 700; color: #64748b; transition: var(--transition); }
.tab.active { background: #fff; color: var(--primary); box-shadow: var(--shadow-sm); }
.table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-md); background: #fff; }
.table { width: 100%; border-collapse: collapse; }
.table th, .table td { padding: 16px 20px; border-bottom: 1px solid var(--border); text-align: left; font-size: 14px; }
.table th { background: #f8fafc; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
.table tr:hover td { background: #f1f5f9; }
.badge { display: inline-flex; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; }
.green { background: #dcfce7; color: #166534; } .red { background: #fee2e2; color: #991b1b; }
.amber { background: #fef3c7; color: #92400e; } .blue { background: #e0e7ff; color: #3730a3; }

/* Modals & Alerts */
.modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); display: grid; place-items: center; padding: 20px; z-index: 100; animation: fadeIn 0.3s; }
.modal-box { background: #fff; border-radius: var(--radius-xl); width: min(800px, 100%); max-height: 90vh; overflow: auto; padding: 32px; box-shadow: var(--shadow-lg); animation: scaleUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.close { background: #f1f5f9; border-radius: 50%; width: 36px; height: 36px; display: grid; place-items: center; color: #64748b; font-weight: bold; transition: var(--transition); }
.close:hover { background: #e2e8f0; color: #0f172a; transform: rotate(90deg); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } .full { grid-column: 1 / -1; }
.toast { position: fixed; right: 24px; bottom: 24px; background: #0f172a; color: #fff; padding: 16px 24px; border-radius: var(--radius-md); z-index: 200; box-shadow: var(--shadow-lg); font-weight: 600; font-size: 14px; animation: slideUpFade 0.3s ease-out; border-left: 4px solid var(--primary); }
.file-note { padding: 16px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: var(--radius-md); margin-top: 12px; color: #475569; font-size: 13px; line-height: 1.6; }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 15px; font-weight: 500; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes scaleUp { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

/* TCS Style Identification Management (Pre-check) */
.tcs-wrapper { min-height: 100vh; background: #e5e7eb; display: flex; flex-direction: column; }
.tcs-header { background: #232f3e; color: #fff; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
.tcs-header h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
.tcs-main { flex: 1; padding: 24px 32px; display: grid; grid-template-columns: 300px 1fr; gap: 24px; max-width: 1400px; margin: 0 auto; width: 100%; }
.tcs-panel { background: #fff; border: 1px solid #d1d5db; border-radius: 4px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
.tcs-panel-head { background: #f3f4f6; border-bottom: 1px solid #d1d5db; padding: 12px 16px; font-weight: 700; color: #374151; font-size: 14px; }
.tcs-candidate-info { padding: 20px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
.tcs-photo { width: 120px; height: 130px; background: #e5e7eb; border: 2px solid #9ca3af; display: grid; place-items: center; color: #6b7280; font-size: 12px; text-align: center; }
.tcs-photo img { width: 100%; height: 100%; object-fit: cover; }
.tcs-details-table { width: 100%; font-size: 13px; border-collapse: collapse; }
.tcs-details-table td { padding: 8px 0; border-bottom: 1px dashed #e5e7eb; color: #1f2937; }
.tcs-details-table td:first-child { font-weight: 600; color: #4b5563; width: 40%; }
.tcs-instructions { padding: 24px; font-size: 14px; color: #374151; line-height: 1.6; overflow-y: auto; flex: 1; }
.tcs-instructions h3 { margin-top: 0; color: #dc2626; font-size: 16px; }
.tcs-instructions ul { padding-left: 20px; margin-bottom: 24px; }
.tcs-instructions li { margin-bottom: 10px; }
.tcs-footer { background: #f9fafb; border-top: 1px solid #d1d5db; padding: 16px 24px; display: flex; flex-direction: column; gap: 16px; }
.tcs-checkbox-wrap { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; font-weight: 600; color: #111827; }
.tcs-checkbox-wrap input { width: 18px; height: 18px; margin-top: 2px; }
.tcs-actions { display: flex; justify-content: flex-end; gap: 12px; }

/* CBT Exam Shell */
:root { --cbt-navy: #0f172a; --cbt-blue: #4f46e5; --cbt-blue-light: #e0e7ff; --cbt-green: #10b981; --cbt-orange: #f59e0b; --cbt-red: #ef4444; --cbt-bg: #f8fafc; --cbt-line: #e2e8f0; }
.cbt-body { background: var(--cbt-bg); min-height: 100vh; color: #1e293b; display: flex; flex-direction: column; }
.cbt-header { height: 70px; background: var(--cbt-navy); color: #f8fafc; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
.cbt-brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 18px; letter-spacing: -0.5px; }
.cbt-emblem { height: 42px; width: 42px; border-radius: 10px; background: var(--brand-grad); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 16px; box-shadow: var(--shadow-glow); }
.cbt-user { display: flex; align-items: center; gap: 16px; font-size: 13px; }
.cbt-userbox { text-align: right; line-height: 1.4; color: #cbd5e1; }
.cbt-userbox b { display: block; font-size: 15px; color: #fff; }
.cbt-avatar { height: 42px; width: 42px; border-radius: 50%; background: #334155; color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 16px; border: 2px solid #475569; }
.cbt-strip { height: 48px; background: #fff; border-bottom: 1px solid var(--cbt-line); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; font-size: 13px; color: #64748b; font-weight: 600; }
.cbt-main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; max-width: 1500px; margin: 0 auto; padding: 24px; flex: 1; width: 100%; }
.cbt-question-panel, .cbt-right-panel { background: #fff; border: 1px solid var(--cbt-line); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
.cbt-question-panel { display: flex; flex-direction: column; }
.cbt-question-head { padding: 20px 32px; border-bottom: 1px solid var(--cbt-line); background: #f8fafc; display: flex; justify-content: space-between; align-items: center; }
.cbt-q-number { font-weight: 800; color: #0f172a; font-size: 18px; }
.cbt-marks { font-size: 13px; color: #64748b; font-weight: 600; background: #e2e8f0; padding: 6px 12px; border-radius: 99px; }
.cbt-question-content { padding: 32px; flex: 1; overflow-y: auto; }
.cbt-question-text { font-size: 18px; line-height: 1.7; font-weight: 600; color: #1e293b; margin-bottom: 32px; }
.cbt-options { display: grid; gap: 14px; max-width: 800px; }
.cbt-option { display: flex; align-items: center; gap: 16px; border: 2px solid #e2e8f0; border-radius: var(--radius-md); padding: 16px 20px; background: #fff; cursor: pointer; transition: var(--transition); }
.cbt-option:hover { border-color: #cbd5e1; background: #f8fafc; transform: translateY(-1px); }
.cbt-option.selected { border-color: var(--cbt-blue); background: var(--cbt-blue-light); }
.cbt-radio { height: 22px; width: 22px; min-width: 22px; border: 2px solid #cbd5e1; border-radius: 50%; display: grid; place-items: center; transition: var(--transition); background: #fff; }
.cbt-option.selected .cbt-radio { border-color: var(--cbt-blue); }
.cbt-option.selected .cbt-radio:after { content: ""; height: 10px; width: 10px; border-radius: 50%; background: var(--cbt-blue); }
.cbt-option-letter { font-weight: 800; color: #64748b; font-size: 15px; width: 24px; }
.cbt-option.selected .cbt-option-letter { color: var(--cbt-blue); }
.cbt-footer { border-top: 1px solid var(--cbt-line); padding: 20px 32px; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.cbt-action { border-radius: var(--radius-sm); padding: 12px 24px; font-weight: 700; font-size: 14px; transition: var(--transition); }
.cbt-save { background: #fff; color: #475569; border: 1px solid #cbd5e1; }
.cbt-save:hover { background: #f1f5f9; color: #0f172a; }
.cbt-next { background: var(--cbt-blue); color: #fff; border: 1px solid var(--cbt-blue); box-shadow: 0 4px 12px rgba(79,70,229,0.2); }
.cbt-next:hover { background: #4338ca; }
.cbt-submit { background: var(--cbt-green); color: #fff; border: 1px solid var(--cbt-green); box-shadow: 0 4px 12px rgba(16,185,129,0.2); }
.cbt-right-panel { display: flex; flex-direction: column; max-height: calc(100vh - 170px); position: sticky; top: 140px; }
.cbt-profile { padding: 20px; border-bottom: 1px solid var(--cbt-line); display: flex; gap: 14px; align-items: center; background: #fff; }
.cbt-profile .photo { height: 56px; width: 56px; background: #f1f5f9; border: 2px solid #e2e8f0; border-radius: var(--radius-sm); display: grid; place-items: center; font-size: 20px; font-weight: 900; color: #475569; }
.cbt-profile b { display: block; color: #0f172a; font-size: 15px; }
.cbt-profile small { color: #64748b; font-weight: 500; }
.cbt-timerbox { padding: 24px; border-bottom: 1px solid var(--cbt-line); background: #f8fafc; text-align: center; }
.cbt-timerlabel { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #64748b; font-weight: 800; margin-bottom: 8px; }
.cbt-timer { font-size: 36px; font-weight: 800; font-variant-numeric: tabular-nums; color: #0f172a; line-height: 1; }
.cbt-timer.warning { color: var(--cbt-orange); }
.cbt-timer.critical { color: var(--cbt-red); animation: pulseGlow 2s infinite; border-radius: 8px; }
.cbt-navtitle { padding: 20px 20px 10px; font-weight: 800; font-size: 14px; color: #0f172a; }
.cbt-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px 20px; border-bottom: 1px solid var(--cbt-line); font-size: 12px; color: #475569; font-weight: 600; }
.legend-item { display: flex; align-items: center; gap: 8px; }
.legend-dot { height: 12px; width: 12px; border: 2px solid #cbd5e1; border-radius: 4px; background: #fff; }
.legend-dot.answered { background: var(--cbt-green); border-color: var(--cbt-green); }
.legend-dot.current { background: var(--cbt-blue); border-color: var(--cbt-blue); }
.legend-dot.review { background: var(--cbt-orange); border-color: var(--cbt-orange); }
.cbt-grid { padding: 20px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; overflow-y: auto; }
.cbt-qbtn { height: 42px; border: 2px solid #e2e8f0; background: #fff; border-radius: var(--radius-sm); font-weight: 700; font-size: 14px; color: #475569; transition: var(--transition); }
.cbt-qbtn.current { background: var(--cbt-blue); color: #fff; border-color: var(--cbt-blue); box-shadow: 0 4px 10px rgba(79,70,229,0.3); }
.cbt-qbtn.answered { background: var(--cbt-green); color: #fff; border-color: var(--cbt-green); }
.cbt-security { margin: auto 20px 20px; border: 1px solid #e2e8f0; background: #f8fafc; padding: 16px; border-radius: var(--radius-md); font-size: 12px; line-height: 1.6; color: #64748b; }
.cbt-security strong { color: #0f172a; font-size: 13px; display: block; margin-bottom: 4px; }
.security-ok { color: var(--cbt-green); font-weight: 800; }
.cbt-fullscreen { border: 1px solid #cbd5e1; background: #fff; padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; color: #334155; transition: var(--transition); cursor: pointer; }
.cbt-fullscreen:hover { background: #f1f5f9; }

/* Warnings & Locking */
.proctor-warning { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 500; background: #ef4444; color: #fff; padding: 16px 24px; border-radius: var(--radius-md); box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4); font-size: 14px; font-weight: 700; text-align: center; animation: slideUpFade 0.3s; }
.proctor-warning.admin-msg { background: #f59e0b; color: #fff; }
.proctor-warning .count { opacity: 0.9; font-weight: 600; background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 99px; margin-left: 10px; }
.proctor-modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); z-index: 600; display: grid; place-items: center; padding: 20px; }
.proctor-modal-box { background: #fff; width: min(500px, 100%); padding: 40px; border-radius: var(--radius-xl); text-align: center; box-shadow: var(--shadow-lg); }
.proctor-modal-box h2 { color: #ef4444; margin-top: 0; font-size: 24px; }
.proctor-modal-box p { color: #475569; line-height: 1.6; margin-bottom: 24px; }
.cbt-confirm { border: 1px solid #bfdbfe; background: #eff6ff; padding: 16px; border-radius: var(--radius-md); text-align: left; margin: 20px 0 0; font-size: 13px; line-height: 1.6; color: #1e3a8a; }

/* Result UI */
.result-hero { text-align: center; padding: 40px 20px; background: linear-gradient(to bottom, #fff, #f8fafc); border-bottom: 0; border-radius: var(--radius-xl) var(--radius-xl) 0 0; }
.result-hero h2 { font-size: 32px; margin: 10px 0; }
.result-score { font-size: 72px; font-weight: 900; background: var(--brand-grad); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1; margin: 10px 0; }
.result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 0 20px 20px; }
.section-result { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; background: #fff; transition: var(--transition); }
.section-result:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); }
.section-result h2 { font-size: 28px; margin: 10px 0; color: #0f172a; }

<body>

<script type="module">

import { getDatabase, ref, get, set, update, onValue, push } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBKqBYNRY_80b_UOLg1ls9pIKdX-Y8b3CM",
  authDomain: "placement-96094.firebaseapp.com",
  databaseURL: "https://placement-96094-default-rtdb.firebaseio.com",
  projectId: "placement-96094",
  storageBucket: "placement-96094.firebasestorage.app",
  messagingSenderId: "1061247846675",
  appId: "1:1061247846675:web:c6885811fcf1884582b2e6"
};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const ADMIN_PIN="ADMIN2026";
let state={role:null,studentId:null,student:null,exam:null,session:null,timer:null,transition:false, screenStream:null};

const $=id=>document.getElementById(id);
function toast(msg){$("toast").textContent=msg;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),2600)}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function show(html){$("app").innerHTML=html}
function genId(){return "EX"+Math.random().toString(36).slice(2,7).toUpperCase()+Date.now().toString().slice(-4)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function cleanupExamEnvironment(){
  if(state.screenStream)state.screenStream.getTracks().forEach(t=>t.stop());
  if(window.screenCaptureInterval) clearInterval(window.screenCaptureInterval);
  clearInterval(state.timer);
}
function landing(){cleanupExamEnvironment();
show(`<div class="app">
<div class="topbar"><div class="brand"><div class="logo">E</div>ExamFlow</div><div class="top-actions"><span class="pill">Online Examination</span></div></div>
<div class="page"><div class="hero"><h1>Online Examination Portal</h1><p>Secure, timed and structured computer-based examination system.</p></div>
<div class="auth-grid">
<div class="card"><h2>Student Login</h2><p class="muted">Enter the Student ID provided by your examination administrator.</p>
<div class="field"><label>Student ID</label><input id="sid" placeholder="Example: STU1001" autocomplete="off"></div>
<button class="btn btn-primary" style="width:100%" onclick="studentLogin()">Enter Examination</button></div>
<div class="card"><h2>Administrator</h2><p class="muted">Create exams, issue Student IDs, publish exams and monitor submissions.</p>
<div class="field"><label>Admin PIN</label><input id="apin" type="password" placeholder="Enter admin PIN"></div>
<button class="btn btn-light" style="width:100%" onclick="adminLogin()">Open Admin Panel</button></div>
</div></div></div>`);
}

window.adminLogin=()=>{if($("apin").value===ADMIN_PIN){state.role="admin";adminDashboard()}else toast("Invalid admin PIN")};

async function studentLogin(){
let id=$("sid").value.trim().toUpperCase();
if(!id)return toast("Enter your Student ID");
try{
let s=await get(ref(db,"students/"+id));
if(!s.exists())return toast("Student ID not found");
if(s.val().active === false)return toast("This Student ID has been disabled");
state.role="student"; state.studentId=id; state.student=s.val();
studentHome();
}catch(e){console.error(e);toast("Database permission error. Check Firebase Rules.");}
}

async function adminDashboard(){
let [studentsSnap,examsSnap,sessionsSnap,resultsSnap]=await Promise.all([ get(ref(db,"students")),get(ref(db,"exams")),get(ref(db,"examSessions")),get(ref(db,"examResults")) ]);
let students=studentsSnap.exists()?studentsSnap.val():{}, exams=examsSnap.exists()?examsSnap.val():{}, sessions=sessionsSnap.exists()?sessionsSnap.val():{}, results=resultsSnap.exists()?resultsSnap.val():{};
show(`<div class="app"><div class="topbar"><div class="brand"><div class="logo">E</div>ExamFlow <span class="pill">ADMIN</span></div><div class="top-actions"><button class="btn btn-light btn-sm" onclick="landing()">Logout</button></div></div>
<div class="page"><div class="dashboard-head"><div><h1>Admin Dashboard</h1><div class="muted">Manage examinations and student access</div></div><div><button class="btn btn-primary" onclick="openExamModal()">+ Create Exam</button> <button class="btn btn-success" onclick="openStudentModal()">+ Student ID</button></div></div>
<div class="stats"><div class="stat"><div class="muted">Students</div><div class="n">${Object.keys(students).length}</div></div><div class="stat"><div class="muted">Exams</div><div class="n">${Object.keys(exams).length}</div></div><div class="stat"><div class="muted">Live Sessions</div><div class="n">${countSessions(sessions)}</div></div><div class="stat"><div class="muted">Results</div><div class="n">${countResults(results)}</div></div></div>
<div class="tabs"><button class="tab active" onclick="adminExams()">Exams</button><button class="tab" onclick="adminStudents()">Student IDs</button><button class="tab" onclick="adminMonitor()">Live Screen Monitor</button><button class="tab" onclick="adminResults()">Results</button></div>
<div id="adminContent"></div></div></div>`);
window._cache={students,exams,sessions,results};adminExams();
}
function countSessions(x){return Object.values(x).reduce((n,v)=>n+Object.values(v||{}).filter(s=>s.status==="live").length,0)}
function countResults(x){return Object.values(x).reduce((n,v)=>n+Object.keys(v||{}).length,0)}

function adminExams(){
let exams=window._cache.exams||{};
let rows=Object.entries(exams).map(([id,e])=>`<tr><td><b>${esc(id)}</b></td><td>${esc(e.name)}</td><td>${e.questions?.length||0}</td><td>${e.totalMarks||0}</td><td><span class="badge ${e.status==="published"?"green":"amber"}">${esc(e.status||"draft")}</span></td><td><button class="btn btn-sm btn-light" onclick="toggleExam('${id}')">${e.status==="published"?"Unpublish":"Publish"}</button> <button class="btn btn-sm btn-danger" onclick="deleteExam('${id}')">Delete</button></td></tr>`).join("");
$("adminContent").innerHTML=`<div class="card"><h2>Examinations</h2><div class="table-wrap">${rows?`<table class="table"><thead><tr><th>Exam ID</th><th>Name</th><th>Questions</th><th>Marks</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty">No exams created yet.</div>`}</div></div>`;
}
function adminStudents(){
let st=window._cache.students||{};
let rows=Object.entries(st).map(([id,s])=>`<tr><td><b>${esc(id)}</b></td><td>${esc(s.name||"-")}</td><td>${esc(s.roll||"-")}</td><td>${esc(s.department||"-")}</td><td>${s.active!==false?'<span class="badge green">Active</span>':'<span class="badge red">Disabled</span>'}</td><td><button class="btn btn-sm btn-light" onclick="toggleStudent('${id}')">${s.active!==false?"Disable":"Enable"}</button></td></tr>`).join("");
$("adminContent").innerHTML=`<div class="card"><h2>Student IDs</h2><div class="table-wrap">${rows?`<table class="table"><thead><tr><th>Student ID</th><th>Name</th><th>Roll</th><th>Department</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty">No Student IDs created yet.</div>`}</div></div>`;
}

// ----------------------------------------------------
// NEW LIVE SCREEN MONITOR (2x2 Matrix)
// ----------------------------------------------------
let monitorState = { page: 0, activeLive: [], loopInterval: null, listeners: [] };
window.adminMonitor = () => {
    let sessions = window._cache.sessions || {};
    let exams = window._cache.exams || {};
    let students = window._cache.students || {};
    
    monitorState.activeLive = [];
    Object.entries(sessions).forEach(([eid, ss]) => {
        Object.entries(ss || {}).forEach(([sid, s]) => {
            if (s.status === "live") monitorState.activeLive.push({ eid, sid, s, exam: exams[eid], student: students[sid] });
        });
    });

    $("adminContent").innerHTML = `
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px">
                <div>
                    <h2 style="margin:0">Live Screen Monitor</h2>
                    <div class="muted small">Viewing complete screens + mouse movements of active candidates. Note: Feeds refresh every ~3 seconds to save bandwidth.</div>
                </div>
                <div style="display:flex; gap:8px; align-items:center;">
                    <button class="btn btn-sm btn-light" onclick="monitorPrev()">Prev</button>
                    <span id="monitorPageLabel" style="font-weight:700; font-size:14px; padding:0 8px">Page 1</span>
                    <button class="btn btn-sm btn-light" onclick="monitorNext()">Next</button>
                    <button class="btn btn-sm ${monitorState.loopInterval ? 'btn-success' : 'btn-light'}" style="margin-left:10px" onclick="toggleMonitorLoop()">
                        ${monitorState.loopInterval ? 'Stop Auto-Loop' : 'Start Auto-Loop'}
                    </button>
                </div>
            </div>
            <div class="monitor-grid" id="monitorGrid"></div>
        </div>
    `;
    renderMonitorPage();
};

window.renderMonitorPage = () => {
    monitorState.listeners.forEach(unsub => unsub()); // Detach old Firebase listeners
    monitorState.listeners = [];

    let totalActive = monitorState.activeLive.length;
    let start = monitorState.page * 4;
    let batch = monitorState.activeLive.slice(start, start + 4);

    if (batch.length === 0 && monitorState.page > 0) {
        monitorState.page = 0; // loop back to start
        batch = monitorState.activeLive.slice(0, 4);
    }
    
    let totalPages = Math.ceil(totalActive / 4) || 1;
    $('monitorPageLabel').innerText = `Page ${monitorState.page + 1} / ${totalPages}`;

    let html = '';
    if (batch.length === 0) {
        html = '<div class="empty" style="grid-column: 1/-1">No active examination sessions running right now.</div>';
    } else {
        batch.forEach(item => {
            html += `
            <div class="monitor-card">
                <div class="mon-head">
                    <div><b>${item.sid} - ${item.student?.name || 'Unknown'}</b> <span style="display:block; font-size:11px; color:#64748b">${item.exam?.name || item.eid}</span></div>
                    <span class="badge blue">Q: ${item.s.currentIndex + 1}</span>
                </div>
                <div class="mon-screen">
                    <img id="mon-img-${item.sid}" src="" alt="Waiting for screen feed..."/>
                </div>
                <div class="mon-foot">
                    <button class="btn btn-sm btn-warning" onclick="sendWarning('${item.eid}', '${item.sid}')">⚠ Send Warning</button>
                </div>
            </div>`;
        });
    }
    $('monitorGrid').innerHTML = html;

    // Attach listeners for images from Firebase
    batch.forEach(item => {
        let unsub = onValue(ref(db, "screens/" + item.sid), snap => {
            if (snap.exists() && $('mon-img-' + item.sid)) {$('mon-img-' + item.sid).src = snap.val().img;
            }
        });
        monitorState.listeners.push(unsub);
    });
};

window.monitorNext = () => { monitorState.page++; renderMonitorPage(); };
window.monitorPrev = () => { monitorState.page = Math.max(0, monitorState.page - 1); renderMonitorPage(); };
window.toggleMonitorLoop = () => {
    if(monitorState.loopInterval) { clearInterval(monitorState.loopInterval); monitorState.loopInterval = null; }
    else { monitorState.loopInterval = setInterval(() => { monitorState.page++; renderMonitorPage(); }, 10000); }
    adminMonitor(); // re-render to update button color
};
window.sendWarning = (eid, sid) => {
    let msg = prompt("Enter a warning message to send to candidate " + sid + ":");
    if(msg) {
        set(ref(db, `examSessions/${eid}/${sid}/warning`), { msg, t: Date.now() });
        toast("Warning sent securely.");
    }
};
// ----------------------------------------------------

function adminResults(){
let results=window._cache.results||{};
let exams=window._cache.exams||{},rows=[];
Object.entries(results).forEach(([eid,rs])=>Object.entries(rs||{}).forEach(([sid,r])=>rows.push(`<tr><td>${esc(sid)}</td><td>${esc(r.examName||exams[eid]?.name||eid)}</td><td>${r.obtained}/${r.totalMarks}</td><td>${Number(r.percentage||0).toFixed(1)}%</td><td><span class="badge ${r.overallPass?"green":"red"}">${r.overallPass?"PASS":"FAIL"}</span></td><td><button class="btn btn-sm btn-light" onclick="viewResult('${eid}','${sid}')">View</button></td></tr>`)));
$("adminContent").innerHTML=`<div class="card"><h2>Results</h2><div class="table-wrap">${rows.length?`<table class="table"><thead><tr><th>Student</th><th>Exam</th><th>Score</th><th>Percentage</th><th>Result</th><th></th></tr></thead><tbody>${rows.join("")}</tbody></table>`:`<div class="empty">No completed results.</div>`}</div></div>`;
}

window.adminStudents=adminStudents;window.adminExams=adminExams;window.adminResults=adminResults;
window.toggleExam=async id=>{let e=window._cache.exams[id];await update(ref(db,"exams/"+id),{status:e.status==="published"?"draft":"published"});await adminDashboard();toast("Exam status updated")};
window.deleteExam=async id=>{if(!confirm("Delete this examination?"))return;await set(ref(db,"exams/"+id),null);await adminDashboard();toast("Exam deleted")};
window.toggleStudent=async id=>{let s=window._cache.students[id];await update(ref(db,"students/"+id),{active:s.active===false});await adminDashboard();toast("Student status updated")};
window.openStudentModal=()=>{ $("app").insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h2>Create Student ID</h2><button class="close" onclick="$('modal').remove()">✕</button></div><div class="form-grid"><div class="field"><label>Student Name</label><input id="sn"></div><div class="field"><label>Roll Number</label><input id="sr"></div><div class="field"><label>Department</label><input id="sd" value="Electrical Engineering"></div><div class="field"><label>Student ID</label><input id="si" value="${genId()}"></div></div><button class="btn btn-success" onclick="createStudent()">Create Student ID</button></div></div>`) };
window.createStudent=async()=>{ let id=$("si").value.trim().toUpperCase(),name=$("sn").value.trim(); if(!id||!name)return toast("Student ID and name are required"); await set(ref(db,"students/"+id),{id,name,roll:$("sr").value.trim(),department:$("sd").value.trim(),active:true,createdAt:Date.now()}); $("modal").remove();toast("Student ID created: "+id);adminDashboard(); };
window.openExamModal=()=>{ $("app").insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h2>Create Examination</h2><button class="close" onclick="$('modal').remove()">✕</button></div><div class="form-grid"><div class="field full"><label>Exam Name</label><input id="en" placeholder="Example: Electrical Engineering Mock Test"></div><div class="field"><label>Exam ID</label><input id="ei" value="${genId()}"></div><div class="field"><label>Instructions</label><input id="ein" value="Read each question carefully. You cannot return to a previous question."></div><div class="field full"><label>Questions JSON</label><textarea id="qjson" placeholder='[ {"q":"Ohm law is?","a":["V=IR","P=VI","I=V/R","All"],"correct":0,"marks":2,"time":30,"section":"Electrical Basics"} ]'></textarea></div></div><div class="file-note"><b>Question format</b><br>q = question, a = 4 options, correct = 0 to 3, marks = marks, time = seconds, section = section name.</div><br><button class="btn btn-primary" onclick="createExam()">Create Exam</button></div></div>`) };
window.createExam=async()=>{ try{ let id=$("ei").value.trim().toUpperCase(),name=$("en").value.trim(),questions=JSON.parse($("qjson").value); if(!id||!name||!Array.isArray(questions)||!questions.length)throw Error("Invalid exam data"); let clean=questions.map((q,i)=>{if(!q.q||!Array.isArray(q.a)||q.a.length!==4||q.correct<0||q.correct>3)throw Error("Invalid question "+(i+1));return { id:i+1,text:q.q,options:q.a,correctIndex:Number(q.correct),marks:Number(q.marks||1),allocatedTime:Number(q.time||30),section:q.section||"General"}}); let total=clean.reduce((a,q)=>a+q.marks,0); await set(ref(db,"exams/"+id),{id,name,instructions:$("ein").value,questions:clean,totalMarks:total,status:"draft",createdAt:Date.now(),sectionComments:{}}); $("modal").remove();toast("Exam created");adminDashboard(); }catch(e){toast(e.message||"Could not create exam")} };

async function studentHome(){
let snap=await get(ref(db,"exams"));let exams=snap.exists()?snap.val():{};
let available=Object.entries(exams).filter(([id,e])=>e.status==="published");
let cards=available.map(([id,e])=>`<div class="card exam-choice-card"><div style="display:flex;justify-content:space-between;gap:15px;align-items:flex-start"><div><span class="badge blue">AVAILABLE</span><h2 style="margin:12px 0 6px">${esc(e.name)}</h2><p class="muted">${esc(e.instructions||"Read all instructions before starting.")}</p></div><span class="badge blue">${esc(id)}</span></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0"><div class="file-note"><b>${e.questions?.length||0}</b><br><span class="small muted">Questions</span></div><div class="file-note"><b>${e.totalMarks||0}</b><br><span class="small muted">Total Marks</span></div><div class="file-note"><b>${Object.values(e.questions||{}).reduce((a,q)=>a+Number(q.allocatedTime||0),0)}s</b><br><span class="small muted">Total Time</span></div></div><button class="btn btn-primary" style="width:100%" onclick="startExam('${id}')">View Instructions & Start →</button></div>`).join("");
show(`<div class="app"><div class="topbar"><div class="brand"><div class="logo">E</div><div>ExamFlow<div class="small muted">Student Portal</div></div></div><div class="top-actions"><span class="pill">${esc(state.student.name)} · ${esc(state.studentId)}</span><button class="btn btn-light btn-sm" onclick="landing()">Logout</button></div></div><div class="page"><div class="hero" style="text-align:left;padding-bottom:25px"><div class="badge blue">STUDENT DASHBOARD</div><h1 style="margin-top:14px">Ready for your examination?</h1><p style="margin-left:0">Choose an available examination below. Your Student ID is already verified.</p></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:22px"><div class="card"><div class="muted small">Student</div><h3 style="margin:7px 0">${esc(state.student.name)}</h3><div class="small muted">${esc(state.student.department||"")}</div></div><div class="card"><div class="muted small">Student ID</div><h3 style="margin:7px 0">${esc(state.studentId)}</h3><div class="small muted">Verified access</div></div><div class="card"><div class="muted small">Examinations</div><h3 style="margin:7px 0">${available.length}</h3><div class="small muted">Currently published</div></div></div><div style="display:grid;gap:18px">${cards||`<div class="card empty">No examination is currently published.</div>`}</div></div></div>`);
}

window.startExam=async examId=>{
let snap=await get(ref(db,"exams/"+examId));if(!snap.exists())return toast("Exam not found");
let exam=snap.val();
let existing=await get(ref(db,"examSessions/"+examId+"/"+state.studentId));
if(existing.exists() && existing.val().status==="completed")return toast("You have already completed this examination.");
let questions=exam.questions.map(q=>{let opts=q.options.map((text,i)=>({text,original:i}));opts=shuffle(opts);return {...q,displayed:opts}});
state.exam=exam;state.examId=examId; state.pendingQuestions=questions;
showExamInstructions();
};

let exam=state.exam;
show(`
<div class="tcs-wrapper">

            <div class="tcs-footer">
                <label class="tcs-checkbox-wrap">
                    <input type="checkbox" id="tcsCheck" onchange="toggleTcsStart()">
                    I have read and understood the instructions. I agree that in case of not adhering to the instructions, I will be disqualified.
                </label>
                <div class="tcs-actions">
                    <button class="btn btn-light" id="tcsShareBtn" disabled onclick="enableScreenShare()">1. Enable Screen Monitoring</button>
                    <button class="btn btn-primary" id="tcsStartBtn" disabled onclick="confirmStartExam()">2. I am ready to begin</button>
                </div>
            </div>
        </div>
    </div>
</div>`);
}

window.toggleTcsStart = () => {
    let checked = $("tcsCheck").checked;
    $("tcsShareBtn").disabled = !checked;
    if(!checked) $("tcsStartBtn").disabled = true;
};

// Replaces Camera with Screen Sharing
window.enableScreenShare = async () => {
    try {
        let stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: "monitor" } });
        state.screenStream = stream;
        
        // Ensure they shared the entire screen if possible to detect
        let track = stream.getVideoTracks()[0];
        let settings = track.getSettings();
        if(settings.displaySurface && settings.displaySurface !== 'monitor') {
            toast("WARNING: You did not share your 'Entire Screen'. Admin may flag your session.");
        }

        // Hidden video element to render stream for canvas capture
        state.hiddenVideo = document.createElement("video");
        state.hiddenVideo.autoplay = true;
        state.hiddenVideo.muted = true;
        state.hiddenVideo.srcObject = stream;
        
        $("tcsShareBtn").classList.replace("btn-light", "btn-success");
        $("tcsShareBtn").innerText = "✔ Screen Shared";
        $("tcsStartBtn").disabled = false;
    } catch(e) {
        toast("You must share your screen to start the exam.");
    }
};

window.confirmStartExam = async () => {
    if(!state.screenStream) return toast("Please complete screen sharing first.");
    await beginSecureExam();
};

window.beginSecureExam=async()=>{
  try{await document.documentElement.requestFullscreen();}catch(e){}
  
  let questions=state.pendingQuestions;
  state.session={studentId:state.studentId,studentName:state.student.name,status:"live",currentIndex:0,totalQuestions:questions.length,
  startedAt:Date.now(),timeLeft:questions[0].allocatedTime,responses:{},questions};
  await set(ref(db,"examSessions/"+state.examId+"/"+state.studentId),state.session);
  
  // Start Screen Capture loop to Firebase (Uploads compressed screenshot every 3 seconds)
  // Note: For a real production app, WebRTC is better, but this works perfectly for a Firebase prototype.
  let canvas = document.createElement("canvas");
  canvas.width = 640; // Reduced resolution to save bandwidth
  canvas.height = 360;
  let ctx = canvas.getContext("2d");
  
  window.screenCaptureInterval = setInterval(() => {
      if(state.hiddenVideo && state.hiddenVideo.readyState >= 2 && state.session.status === "live") {
          ctx.drawImage(state.hiddenVideo, 0, 0, canvas.width, canvas.height);
          let b64 = canvas.toDataURL("image/jpeg", 0.3); // High compression
          set(ref(db, "screens/" + state.studentId), { img: b64, t: Date.now() });
      }
  }, 3000);

  // Listen for admin warnings
  onValue(ref(db, `examSessions/${state.examId}/${state.studentId}/warning`), snap => {
      if(!snap.exists()) return;
      let w = snap.val();
      if(w.t > state.session.startedAt && w.t !== state.lastWarningT) {
          state.lastWarningT = w.t;
          showProctorWarning("ADMINISTRATOR MESSAGE: " + w.msg, true);
      }
  });

  renderExam();
};

// ----------------------------------------------------
// RENDER CBT EXAM (No major structural changes)
// ----------------------------------------------------
function renderExam(){
clearInterval(state.timer);
let s=state.session,q=s.questions[s.currentIndex],chosen=s.responses[s.currentIndex]?.selectedOriginal;
let answeredCount=Object.keys(s.responses||{}).length;
show(`<div class="cbt-body">
<header class="cbt-header">
  <div class="cbt-brand"><div class="cbt-emblem">SAM</div><div>${esc(state.exam.name)}</div></div>
  <div class="cbt-user">
    <div class="cbt-userbox"><b>${esc(state.student.name)}</b>${esc(state.studentId)}</div>
    <div class="cbt-avatar">${esc((state.student.name||"S").slice(0,1).toUpperCase())}</div>
  </div>
</header>
<div class="cbt-strip">
  <span><b>Examination Mode:</b> Computer Based Test</span>
  <span><button class="cbt-fullscreen" onclick="requestExamFullscreen()">⛶ Full Screen</button></span>
</div>
<div class="cbt-main">
<main class="cbt-question-panel">
  <div class="cbt-question-head">
    <div class="cbt-q-number">Question No. ${s.currentIndex+1}</div>
    <div class="cbt-marks">Section: <b>${esc(q.section)}</b> &nbsp; | &nbsp; Marks: <b>${q.marks}</b></div>
  </div>
  <div class="cbt-question-content">
    <div class="cbt-question-text">${esc(q.text)}</div>
    <div class="cbt-options">
      ${q.displayed.map((o,i)=>`
        <div class="cbt-option ${chosen===o.original?"selected":""}" id="cbtopt${i}" onclick="chooseOption(${o.original})">
          <div class="cbt-radio"></div>
          <div class="cbt-option-letter">${String.fromCharCode(65+i)}</div>
          <div>${esc(o.text)}</div>
        </div>`).join("")}
    </div>
    <div class="cbt-confirm">
      <b>Navigation rule:</b> Once you click <b>Save & Next</b>, this question will be closed and you cannot return to it.
    </div>
  </div>
  <div class="cbt-footer">
    <div class="small muted">Answered: ${answeredCount} / ${s.totalQuestions}</div>
    <div style="display:flex;gap:8px">
      <button class="cbt-action cbt-save" onclick="clearCurrentAnswer()">Clear Response</button>
      <button class="cbt-action ${s.currentIndex===s.totalQuestions-1?"cbt-submit":"cbt-next"}" onclick="nextQuestion()">${s.currentIndex===s.totalQuestions-1?"Submit Test":"Save & Next"}</button>
    </div>
  </div>
</main>
<aside class="cbt-right-panel">
  <div class="cbt-profile">
    <div class="photo">${esc((state.student.name||"S").slice(0,1).toUpperCase())}</div>
    <div><b>${esc(state.student.name)}</b><small>Candidate ID: ${esc(state.studentId)}</small></div>
  </div>
  <div class="cbt-timerbox"><div class="cbt-timerlabel">Time Remaining</div><div class="cbt-timer" id="timer">${fmt(s.timeLeft)}</div></div>
  <div class="cbt-navtitle">Question Palette</div>
  <div class="cbt-legend">
    <div class="legend-item"><span class="legend-dot answered"></span> Answered</div>
    <div class="legend-item"><span class="legend-dot current"></span> Current</div>
    <div class="legend-item"><span class="legend-dot"></span> Not Answered</div>
  </div>
  <div class="cbt-grid">${s.questions.map((x,i)=>{
    let cls=i===s.currentIndex?"current":(s.responses[i]?"answered":"");
    return `<button class="cbt-qbtn ${cls}" disabled>${i+1}</button>`;
  }).join("")}</div>
  <div class="cbt-security">
    <strong>Security Monitor</strong><br>
    <span class="security-ok">● Active</span> &nbsp; Screen and focus monitoring active.<br>
    Screen: ${state.screenStream?"Shared & Recording":"Not sharing"}<br>
    Local Warnings: <span id="violationCount">${state.proctor?.violations||0}</span>
  </div>
</aside>
</div></div>`);
startTimer();
}

window.clearCurrentAnswer=()=>{ delete state.session.responses[state.session.currentIndex]; document.querySelectorAll(".cbt-option").forEach(x=>x.classList.remove("selected")); toast("Response cleared"); };
window.requestExamFullscreen=async()=>{ try{await document.documentElement.requestFullscreen();}catch(e){toast("Full-screen permission was not granted");} };

function showProctorWarning(message, isAdmin = false){
  state.proctor=state.proctor||{violations:0};
  if(!isAdmin) state.proctor.violations++;
  
  let old=document.querySelector(".proctor-warning");if(old)old.remove();
  let d=document.createElement("div"); d.className="proctor-warning";
  if(isAdmin) d.classList.add("admin-msg");
  d.innerHTML=`⚠ ${esc(message)} ${!isAdmin ? `<span class="count">Warning ${state.proctor.violations}/3</span>` : ''}`;
  document.body.appendChild(d);
  if($('violationCount'))$('violationCount').innerText = state.proctor.violations;
  setTimeout(()=>d.remove(), 4500);
  
  if(!isAdmin && state.proctor.violations>=3) showSecurityLock();
}

function showSecurityLock(){
  let old=document.querySelector(".proctor-modal");if(old)return;
  let d=document.createElement("div");d.className="proctor-modal";
  d.innerHTML=`<div class="proctor-modal-box"><h2>Security Warning</h2><p>The examination window lost focus multiple times. Please return to the examination screen and confirm that you are ready to continue.</p><button class="btn btn-primary" onclick="resumeAfterSecurity()">I am ready to continue</button></div>`;
  document.body.appendChild(d);
}
window.resumeAfterSecurity=()=>{document.querySelector(".proctor-modal")?.remove();state.proctor.violations=0;requestExamFullscreen()};

function installProctoring(){
  state.proctor=state.proctor||{violations:0};
  if(state.proctor.listenersInstalled)return;
  state.proctor.listenersInstalled=true;

  document.addEventListener("visibilitychange",()=>{ if(document.hidden && state.role==="student" && state.session?.status==="live")showProctorWarning("You left the examination window."); });
  window.addEventListener("blur",()=>{ if(state.role==="student" && state.session?.status==="live")showProctorWarning("Examination window lost focus."); });
  document.addEventListener("contextmenu",e=>{if(state.role==="student"&&state.session?.status==="live")e.preventDefault()});
  ['copy','cut','paste'].forEach(ev => document.addEventListener(ev, e=>{if(state.role==="student"&&state.session?.status==="live")e.preventDefault()}));
  document.addEventListener("keydown",e=>{
    if(state.role!=="student"||state.session?.status!=="live")return;
    if((e.ctrlKey||e.metaKey)&&["c","x","v","u","s","p"].includes(e.key.toLowerCase())){e.preventDefault();showProctorWarning("This keyboard action is disabled.");}
    if(e.key==="F12"||e.key==="PrintScreen"){e.preventDefault();showProctorWarning("This action is disabled.");}
  });
  window.addEventListener("beforeunload",e=>{ if(state.role==="student"&&state.session?.status==="live"){e.preventDefault();e.returnValue="Your examination is in progress.";} });
}
installProctoring();

function fmt(sec){sec=Math.max(0,Math.ceil(sec));return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function startTimer(){
let end=Date.now()+state.session.timeLeft*1000;
state.timer=setInterval(()=>{state.session.timeLeft=Math.max(0,Math.ceil((end-Date.now())/1000));let t=$("timer");if(t)t.textContent=fmt(state.session.timeLeft);if(t&&state.session.timeLeft<=10)t.classList.add("critical");if(state.session.timeLeft<=0){clearInterval(state.timer);timeUp()}},250);
}
window.chooseOption=original=>{ let q=state.session.questions[state.session.currentIndex]; state.session.responses[state.session.currentIndex]={selectedOriginal:original,questionId:q.id,section:q.section,marks:q.marks,timeUsed:q.allocatedTime-state.session.timeLeft}; document.querySelectorAll(".option, .cbt-option").forEach(x=>x.classList.remove("selected")); let idx=q.displayed.findIndex(x=>x.original===original);if($("cbtopt"+idx))$("cbtopt"+idx).classList.add("selected"); };
async function saveSession(){await set(ref(db,"examSessions/"+state.examId+"/"+state.studentId),state.session)}
window.nextQuestion=async()=>{clearInterval(state.timer);await saveSession();if(state.session.currentIndex===state.session.totalQuestions-1){finishExam();return}state.session.currentIndex++;state.session.timeLeft=state.session.questions[state.session.currentIndex].allocatedTime;await saveSession();renderExam()};
async function timeUp(){await saveSession();showTransition("TIME UP",state.session.totalQuestions-state.session.currentIndex-1);setTimeout(async()=>{if(state.session.currentIndex===state.session.totalQuestions-1){finishExam();return}state.session.currentIndex++;state.session.timeLeft=state.session.questions[state.session.currentIndex].allocatedTime;await saveSession();renderExam()},2000)}
function showTransition(title,remaining){show(`<div class="transition"><div class="box"><h1>${title}</h1><p>Question locked.</p><p>${Math.max(0,remaining)} question${remaining===1?"":"s"} remaining</p></div></div>`)}

async function finishExam(){
clearInterval(window.screenCaptureInterval);
if(state.screenStream)state.screenStream.getTracks().forEach(t=>t.stop());
let s=state.session,obtained=0,correct=0,wrong=0,unanswered=0,sections={};
s.questions.forEach((q,i)=>{ let r=s.responses[i],ok=r&&Number(r.selectedOriginal)===Number(q.correctIndex); let marks=ok?q.marks:0;if(r){if(ok)correct++;else wrong++}else unanswered++; obtained+=marks;if(!sections[q.section])sections[q.section]={marks:0,total:0,correct:0,wrong:0,unanswered:0}; sections[q.section].marks+=marks;sections[q.section].total+=q.marks;if(r){ok?sections[q.section].correct++:sections[q.section].wrong++}else sections[q.section].unanswered++; });
let sectionResults={};let overallPass=true;
Object.entries(sections).forEach(([name,x])=>{let pct=x.total?x.marks/x.total*100:0;let pass=pct>=65;if(!pass)overallPass=false;sectionResults[name]={...x,percentage:pct,pass}});
let result={studentId:state.studentId,studentName:state.student.name,examId:state.examId,examName:state.exam.name,obtained,totalMarks:state.exam.totalMarks,percentage:state.exam.totalMarks?obtained/state.exam.totalMarks*100:0,overallPass,correct,wrong,unanswered,sectionResults,responses:s.responses,completedAt:Date.now()};
await set(ref(db,"examResults/"+state.examId+"/"+state.studentId),result);
await update(ref(db,"examSessions/"+state.examId+"/"+state.studentId),{status:"completed",completedAt:Date.now()});
state.result=result;showStudentResult();
}
function showStudentResult(){ let r=state.result; show(`<div class="app"><div class="topbar"><div class="brand"><div class="logo">E</div>ExamFlow</div></div><div class="page"><div class="card result-hero"><div class="muted">Examination Completed</div><div class="result-score">${r.obtained} / ${r.totalMarks}</div><h2>${r.overallPass?"PASS":"FAIL"}</h2><p class="muted">${Number(r.percentage).toFixed(2)}% · Correct ${r.correct} · Wrong ${r.wrong} · Unanswered ${r.unanswered}</p></div><div class="card"><h2>Section Performance</h2><p class="muted">A section requires at least 65% to pass. Correct answers are not displayed to students.</p><div class="result-grid">${Object.entries(r.sectionResults).map(([n,x])=>`<div class="section-result"><b>${esc(n)}</b><h2>${x.marks}/${x.total}</h2><div>${x.percentage.toFixed(1)}%</div><br><span class="badge ${x.pass?"green":"red"}">${x.pass?"PASS":"FAIL"}</span></div>`).join("")}</div></div><div style="text-align:center;margin-top:20px"><button class="btn btn-light" onclick="landing()">Exit</button></div></div></div>`); }
window.viewResult=async(eid,sid)=>{let s=await get(ref(db,"examResults/"+eid+"/"+sid));if(!s.exists())return;let r=s.val();let rows=Object.entries(r.sectionResults||{}).map(([n,x])=>`<tr><td>${esc(n)}</td><td>${x.marks}/${x.total}</td><td>${x.percentage.toFixed(1)}%</td><td>${x.correct}</td><td>${x.wrong}</td><td>${x.unanswered}</td><td>${x.pass?"PASS":"FAIL"}</td></tr>`).join("");$("app").insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h2>${esc(r.studentName)} · Result</h2><button class="close" onclick="$('modal').remove()">✕</button></div><p><b>Score:</b> ${r.obtained}/${r.totalMarks} · ${r.percentage.toFixed(2)}% · <b>${r.overallPass?"PASS":"FAIL"}</b></p><div class="table-wrap"><table class="table"><thead><tr><th>Section</th><th>Marks</th><th>%</th><th>Correct</th><th>Wrong</th><th>Unanswered</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div><br><button class="btn btn-primary" onclick="downloadPDF('${eid}','${sid}')">Download PDF</button></div></div>`)};
window.downloadPDF=async(eid,sid)=>{ let s=await get(ref(db,"examResults/"+eid+"/"+sid));if(!s.exists())return;let r=s.val(),{jsPDF}=window.jspdf,doc=new jsPDF();doc.setFontSize(18);doc.text("Examination Result",20,20);doc.setFontSize(11);doc.text("Student: "+r.studentName,20,32);doc.text("Student ID: "+r.studentId,20,40);doc.text("Exam: "+r.examName,20,48);doc.text("Score: "+r.obtained+" / "+r.totalMarks,20,58);doc.text("Percentage: "+r.percentage.toFixed(2)+"%",20,66);doc.text("Result: "+(r.overallPass?"PASS":"FAIL"),20,74);let y=88;Object.entries(r.sectionResults||{}).forEach(([n,x])=>{doc.text(n+" : "+x.marks+"/"+x.total+" | "+x.percentage.toFixed(1)+"% | "+(x.pass?"PASS":"FAIL"),20,y);y+=9;if(y>280){doc.addPage();y=20}});doc.save("result_"+r.studentId+".pdf") };

function watchAdmin(){ if(state.role!=="admin")return; onValue(ref(db,"students"),s=>{if(window._cache)window._cache.students=s.exists()?s.val():{}}); onValue(ref(db,"exams"),s=>{if(window._cache)window._cache.exams=s.exists()?s.val():{}}); onValue(ref(db,"examSessions"),s=>{if(window._cache)window._cache.sessions=s.exists()?s.val():{}}); onValue(ref(db,"examResults"),s=>{if(window._cache)window._cache.results=s.exists()?s.val():{}}); }

Object.assign(window, { $, studentLogin, adminLogin, adminDashboard, adminStudents, adminExams, adminMonitor, monitorNext, monitorPrev, toggleMonitorLoop, sendWarning, adminResults, openStudentModal, createStudent, openExamModal, createExam, toggleExam, deleteExam, toggleStudent, startExam, confirmStartExam, beginSecureExam, enableScreenShare, toggleTcsStart, clearCurrentAnswer, requestExamFullscreen, resumeAfterSecurity, chooseOption, nextQuestion, viewResult, downloadPDF });
landing();
</script>
