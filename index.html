<title>ExamFlow | Real-Time Examination System</title>
<style>

  --bg:#f5f7fb;--surface:#fff;--surface2:#f8fafc;--text:#172033;--muted:#697586;

html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}
.hidden{display:none!important}.app{min-height:100vh}

.brand{display:flex;align-items:center;gap:11px;font-weight:850;font-size:20px}.brandMark{width:39px;height:39px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(37,99,235,.22)}
.topUser{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.avatar{width:35px;height:35px;border-radius:50%;background:#e8efff;color:var(--primary);display:grid;place-items:center;font-weight:800}

.loginPage{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#f5f9ff,#f8f5ff)}.loginCard{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 25px 70px rgba(37,51,84,.12);padding:34px}.loginLogo{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:grid;place-items:center;font-size:25px;margin-bottom:18px}.loginCard h1{margin:0;font-size:27px}.loginCard p{color:var(--muted);line-height:1.55}
.hero{background:linear-gradient(135deg,#eff5ff,#f7f2ff);border:1px solid #dfe8ff}.sectionCard{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fff}.optionBtn{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid #dfe4ec;border-radius:13px;padding:14px;margin-top:10px;transition:.15s}.optionBtn:hover{border-color:#9ab8ff;background:#f8fbff}.optionBtn.selected{border-color:var(--primary);background:#eef4ff;box-shadow:0 0 0 2px #dce8ff}.optionLetter{width:30px;height:30px;min-width:30px;border-radius:9px;background:#f0f3f7;display:grid;place-items:center;font-weight:800;color:#596579}.optionBtn.selected .optionLetter{background:var(--primary);color:#fff}

.monitorGrid{display:grid;grid-template-columns:1.6fr .9fr;gap:18px}.studentRow{cursor:pointer}.studentRow:hover{background:#f8fbff}.liveQuestion{font-size:30px;font-weight:900}.responsePill{font-size:12px;padding:5px 8px;border-radius:8px;background:#f1f5f9}.resultBig{font-size:54px;font-weight:900}.pass{color:var(--success)}.fail{color:var(--danger)}

const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getDatabase(app);

function toast(msg,type=""){const e=document.createElement("div");e.className="toast "+type;e.textContent=msg;$("toastRoot").appendChild(e);setTimeout(()=>e.remove(),3000)}
function clearLive(){liveUnsubs.forEach(x=>x&&x());liveUnsubs=[]}
function nav(page,icon,label){return `<button class="navBtn ${currentPage===page?"active":""}" data-page="${page}">${icon}&nbsp; ${label}</button>`}
function shell(){
  $("root").innerHTML=`<div class="app"><header class="topbar"><div class="brand"><div class="brandMark">E</div>ExamFlow</div><div class="topUser"><span>${esc(currentUser.email)}</span><div class="avatar">${esc((currentUser.email||"U")[0].toUpperCase())}</div><button class="btn btnGhost btnSmall" id="logout">Logout</button></div></header><div class="layout"><aside class="sidebar" id="sidebar"></aside><main class="main" id="main"></main></div></div>`;

function renderNav(){

    ? `${nav("dashboard","▦","Dashboard")}${nav("exams","📝","Exams")}${nav("monitor","📡","Live Monitor")}${nav("students","👥","Students")}${nav("results","📊","Results")}`

async function userData(){const s=await get(ref(db,`users/${currentUser.uid}`));return s.exists()?s.val():{}}
async function ensureUser(){
  const r=ref(db,`users/${currentUser.uid}/profile`),s=await get(r);
  if(!s.exists()) await set(r,{email:currentUser.email,role:currentUser.email?.toLowerCase()===ADMIN_EMAIL_FALLBACK?"admin":"student",createdAt:Date.now()});
  const p=await get(r); isAdmin=p.val()?.role==="admin" || currentUser.email?.toLowerCase()===ADMIN_EMAIL_FALLBACK;
}
function loginView(error=""){
  $("root").innerHTML=`<div class="loginPage"><div class="loginCard"><div class="loginLogo">✓</div><h1>ExamFlow</h1><p>Real-time examination system with question-level timing, shuffled options and live monitoring.</p>${error?`<div class="badge badgeRed" style="margin-bottom:14px">${esc(error)}</div>`:""}<form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required placeholder="student@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" required placeholder="Password"></div><button class="btn btnPrimary" style="width:100%;padding:13px">Sign in</button></form></div></div>`;
  $("loginForm").onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$("email").value.trim().toLowerCase(),$("password").value)}catch(x){loginView("Login failed. Check your Firebase Authentication email and password.")}};
}
async function renderPage(){
  clearLive();renderNav();
  if(currentPage==="dashboard") return isAdmin?adminDashboard():studentDashboard();
  if(currentPage==="exams") return isAdmin?adminExams():studentExams();
  if(currentPage==="monitor") return adminMonitor();
  if(currentPage==="students") return adminStudents();
  if(currentPage==="results") return isAdmin?adminResults():studentResults();
}

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows=[];let row=[],cell="",quote=false;
  for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];
    if(c==='"'&&quote&&n==='"'){cell+='"';i++;continue}
    if(c==='"'){quote=!quote;continue}
    if(c===','&&!quote){row.push(cell);cell="";continue}
    if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x.trim()!==""))rows.push(row);row=[];cell="";continue}
    cell+=c;
  }
  if(cell!==""||row.length){row.push(cell);if(row.some(x=>x.trim()!==""))rows.push(row)}
  if(!rows.length)return [];
  const headers=rows[0].map(x=>x.trim());
  return rows.slice(1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]??"").trim()])));
}
function normalizeQuestion(q,i){
  const get=(...names)=>{for(const n of names)if(q[n]!==undefined)return q[n];return""};
  const no=Number(get("Qn No","Question No","Sl No"))||i+1;
  const answer=String(get("Correct Option","Correct Answer")).trim().toUpperCase();
  const opts=["A","B","C","D"];
  if(!opts.includes(answer)) throw new Error(`Row ${i+2}: Correct Option must be A, B, C or D.`);
  const marks=Number(get("Marks"));const time=Number(get("Allocated Time"));
  if(!Number.isFinite(marks)||marks<0)throw new Error(`Row ${i+2}: Marks must be a number.`);
  if(!Number.isFinite(time)||time<=0)throw new Error(`Row ${i+2}: Allocated Time must be greater than 0.`);
  const section=get("Qn Section","Section").trim();if(!section)throw new Error(`Row ${i+2}: Qn Section is required.`);
  const text=get("Qn","Question").trim();if(!text)throw new Error(`Row ${i+2}: Qn is required.`);
  const options=[get("Option A","A"),get("Option B","B"),get("Option C","C"),get("Option D","D")].map(x=>String(x).trim());
  if(options.some(x=>!x))throw new Error(`Row ${i+2}: all four options are required.`);
  return {qnNo:no,text,options,correctIndex:opts.indexOf(answer),marks,allocatedTime:time,section};
}
async function readCSV(file){return normalizeQuestions(parseCSV(await file.text()))}
function normalizeQuestions(rows){if(!rows.length)throw new Error("CSV contains no question rows.");const seen=new Set();const qs=rows.map(normalizeQuestion);qs.forEach(q=>{if(seen.has(q.qnNo))throw new Error(`Duplicate question number: ${q.qnNo}`);seen.add(q.qnNo)});qs.sort((a,b)=>a.qnNo-b.qnNo);return qs}
function sectionsOf(qs){const m={};qs.forEach(q=>{if(!m[q.section])m[q.section]={name:q.section,totalMarks:0,questions:0};m[q.section].totalMarks+=q.marks;m[q.section].questions++});return m}
function totalMarks(qs){return qs.reduce((a,q)=>a+q.marks,0)}

async function uploadExamModal(){
  showModal(`<h2>Create Examination</h2><div class="field"><label>Exam Name</label><input id="examName" placeholder="e.g. Electrical Engineering Mock Test"></div><div class="field"><label>CSV Question File</label><input id="csvFile" type="file" accept=".csv"></div><div id="csvPreview" class="small">Upload your CSV to validate questions, sections, marks and timing.</div><div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn btnGhost" onclick="closeModal()">Cancel</button><button class="btn btnPrimary" id="createExamBtn">Create Exam</button></div>`);
  $("csvFile").onchange=async()=>{try{const qs=await readCSV($("csvFile").files[0]);const sec=sectionsOf(qs);$("csvPreview").innerHTML=`<span class="badge badgeGreen">✓ Valid CSV</span><div style="margin-top:10px"><b>${qs.length}</b> questions · <b>${Object.keys(sec).length}</b> sections · <b>${totalMarks(qs)}</b> total marks · <b>${Math.round(qs.reduce((a,q)=>a+q.allocatedTime,0)/60*10)/10}</b> total minutes</div>`}catch(e){$("csvPreview").innerHTML=`<span class="badge badgeRed">${esc(e.message)}</span>`}};
  $("createExamBtn").onclick=async()=>{try{
    const name=$("examName").value.trim(),file=$("csvFile").files[0];if(!name||!file)return toast("Enter exam name and select a CSV.","error");
    const qs=await readCSV(file),sections=sectionsOf(qs),key=push(ref(db,"exams")).key;
    const comments={};Object.keys(sections).forEach(s=>comments[s]="");
    await set(ref(db,`exams/${key}`),{name,questions:qs,sections,sectionComments:comments,totalMarks:totalMarks(qs),createdAt:Date.now(),status:"draft"});
    closeModal();toast("Exam created.","success");currentPage="exams";renderPage();
  }catch(e){toast(e.message,"error")}};
}
function showModal(html){$("modalRoot").innerHTML=`<div class="modal"><div class="modalBox">${html}</div></div>`}
function closeModal(){$("modalRoot").innerHTML=""}
window.closeModal=closeModal;window.uploadExamModal=uploadExamModal;

async function exams(){const s=await get(ref(db,"exams"));return s.exists()?s.val():{}}
function examArr(x){return Object.entries(x).map(([id,v])=>({id,...v})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))}

/* ---------- ADMIN ---------- */
async function adminDashboard(){
  const [es,us]=await Promise.all([exams(),get(ref(db,"users"))]);const ea=examArr(es),u=us.exists()?us.val():{};
  const students=Object.values(u).filter(x=>x.profile?.role==="student"||x.profile?.email&&x.profile.email!==ADMIN_EMAIL_FALLBACK);
  const sessions=await get(ref(db,"examSessions"));const ss=sessions.exists()?sessions.val():{};
  const active=Object.values(ss).filter(x=>x.status==="active").length;
  $("main").innerHTML=`<div class="pageTitle"><div><h1>Exam Control Center</h1><p>Real-time examination administration and monitoring.</p></div><button class="btn btnPrimary" onclick="uploadExamModal()">+ Create Exam</button></div><div class="grid grid4">${stat("📝","Exams",ea.length)}${stat("👥","Students",students.length)}${stat("🟢","Live Students",active)}${stat("📊","Published",ea.filter(x=>x.status==="published").length)}</div><div class="card" style="margin-top:18px"><div class="between"><h3 style="margin:0">Recent Exams</h3><button class="btn btnSoft btnSmall" onclick="go('exams')">Manage</button></div><div class="tableWrap" style="margin-top:10px"><table class="table"><thead><tr><th>Exam</th><th>Questions</th><th>Sections</th><th>Marks</th><th>Status</th></tr></thead><tbody>${ea.slice(0,8).map(e=>`<tr><td><b>${esc(e.name)}</b></td><td>${e.questions?.length||0}</td><td>${Object.keys(e.sections||{}).length}</td><td>${e.totalMarks}</td><td>${statusBadge(e.status)}</td></tr>`).join("")||`<tr><td colspan="5">No exams yet.</td></tr>`}</tbody></table></div></div>`;
}
function stat(icon,label,value){return `<div class="card stat"><div class="statIcon">${icon}</div><div class="statLabel">${label}</div><div class="statValue">${esc(value)}</div></div>`}
function statusBadge(s){return `<span class="badge ${s==="published"?"badgeGreen":s==="active"?"badgeBlue":s==="completed"?"badgeGray":"badgeOrange"}">${esc((s||"draft").toUpperCase())}</span>`}
async function adminExams(){
  const ea=examArr(await exams());
  $("main").innerHTML=`<div class="pageTitle"><div><h1>Examinations</h1><p>Upload CSV question banks, configure sections and publish exams.</p></div><button class="btn btnPrimary" onclick="uploadExamModal()">+ Create Exam</button></div><div class="grid grid2">${ea.map(e=>adminExamCard(e)).join("")||`<div class="empty">Create your first exam.</div>`}</div>`;
}
function adminExamCard(e){
  const secs=Object.values(e.sections||{}).map(s=>`${esc(s.name)} · ${s.totalMarks} marks`).join(" &nbsp;•&nbsp; ");
  return `<div class="card"><div class="between"><div><span class="badge badgeBlue">${e.questions?.length||0} QUESTIONS</span><h3 style="margin:10px 0 4px">${esc(e.name)}</h3></div>${statusBadge(e.status)}</div><div class="small">${Object.keys(e.sections||{}).length} sections · ${e.totalMarks} marks</div><div class="small" style="margin-top:9px">${secs}</div><div class="row" style="margin-top:16px;flex-wrap:wrap"><button class="btn btnSoft btnSmall" onclick="editExam('${e.id}')">Settings</button><button class="btn btnSuccess btnSmall" onclick="publishExam('${e.id}')">Publish</button><button class="btn btnPrimary btnSmall" onclick="startAdminMonitor('${e.id}')">Live Monitor</button><button class="btn btnDanger btnSmall" onclick="deleteExam('${e.id}')">Delete</button></div></div>`;
}
async function editExam(id){
  const e=(await exams())[id];if(!e)return;
  const secs=Object.entries(e.sections||{}).map(([k,s])=>`<div class="sectionCard"><div class="between"><b>${esc(s.name)}</b><span>${s.totalMarks} marks · ${s.questions} questions</span></div><div class="field" style="margin-top:10px"><label>Section Comment</label><textarea class="sectionComment" data-section="${esc(k)}" rows="2" placeholder="Optional admin comment">${esc(e.sectionComments?.[k]||"")}</textarea></div></div>`).join("");
  showModal(`<h2>${esc(e.name)}</h2><p class="small">Questions are always in CSV order. Options are shuffled separately for each student.</p>${secs}<div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn btnGhost" onclick="closeModal()">Close</button><button class="btn btnPrimary" onclick="saveExamComments('${id}')">Save Comments</button></div>`);
}
async function saveExamComments(id){const comments={};document.querySelectorAll(".sectionComment").forEach(x=>comments[x.dataset.section]=x.value.trim());await update(ref(db,`exams/${id}`),{sectionComments:comments});closeModal();toast("Section comments saved.","success")}
async function publishExam(id){await update(ref(db,`exams/${id}`),{status:"published",publishedAt:Date.now()});toast("Exam published.","success");adminExams()}
async function deleteExam(id){if(!confirm("Delete this exam and its question bank?"))return;await remove(ref(db,`exams/${id}`));toast("Exam deleted.","success");adminExams()}
window.editExam=editExam;window.publishExam=publishExam;window.deleteExam=deleteExam;window.saveExamComments=saveExamComments;

async function adminMonitor(examId=null){
  const ea=examArr(await exams());if(!examId){$("main").innerHTML=`<div class="pageTitle"><div><h1>Live Monitor</h1><p>Select an exam to watch every student's question, response, timer and status in real time.</p></div></div><div class="grid grid2">${ea.map(e=>`<div class="card"><div class="between"><h3>${esc(e.name)}</h3>${statusBadge(e.status)}</div><div class="small">${e.questions?.length||0} questions · ${e.totalMarks} marks</div><button class="btn btnPrimary btnSmall" style="margin-top:14px" onclick="startAdminMonitor('${e.id}')">Open Monitor</button></div>`).join("")||`<div class="empty">No exams.</div>`}</div>`;return}
  const e=(await exams())[examId];if(!e)return;
  $("main").innerHTML=`<div class="pageTitle"><div><button class="btn btnGhost btnSmall" onclick="go('monitor')">← Exams</button><h1 style="margin-top:12px">${esc(e.name)}</h1><p>Live student response monitoring. No refresh required.</p></div><button class="btn btnSoft" onclick="downloadExamPDF('${examId}')">Download Summary PDF</button></div><div id="liveMonitor"></div>`;
  const r=ref(db,`examSessions/${examId}`);const unsub=onValue(r,s=>renderLiveMonitor(examId,e,s.exists()?s.val():{}));liveUnsubs.push(unsub);
}
window.startAdminMonitor=id=>{currentPage="monitor";adminMonitor(id)};

function renderLiveMonitor(examId,e,data){
  const sessions=Object.entries(data||{}).map(([id,x])=>({id,...x})).filter(x=>x.studentUid);
  const active=sessions.filter(x=>x.status==="active").length,submitted=sessions.filter(x=>x.status==="submitted").length,offline=sessions.filter(x=>x.status==="offline").length;
  $("liveMonitor").innerHTML=`<div class="grid grid4">${stat("🟢","Active",active)}${stat("🔵","Submitted",submitted)}${stat("🔴","Offline",offline)}${stat("👥","Participants",sessions.length)}</div><div class="monitorGrid" style="margin-top:18px"><div class="card"><div class="between"><h3 style="margin:0">Students</h3><span class="small">Live sync</span></div><div class="tableWrap" style="margin-top:10px"><table class="table"><thead><tr><th>Student</th><th>Question</th><th>Section</th><th>Time</th><th>Response</th><th>Status</th></tr></thead><tbody>${sessions.map(s=>`<tr class="studentRow" onclick="viewStudentSession('${examId}','${s.id}')"><td><b>${esc(s.studentName||s.studentEmail||s.studentUid)}</b></td><td>${Number(s.currentIndex||0)+1}/${e.questions.length}</td><td>${esc(s.currentSection||"—")}</td><td>${fmtSec(s.timeLeft)}</td><td>${s.currentResponse?`<span class="responsePill">${esc(s.currentResponse)}</span>`:"—"}</td><td>${liveBadge(s.status)}</td></tr>`).join("")||`<tr><td colspan="6">No students have started this exam.</td></tr>`}</tbody></table></div></div><div id="monitorDetail" class="card"><div class="empty">Click a student to inspect every question response and timing.</div></div></div>`;
}
function liveBadge(s){const map={active:["badgeGreen","● ACTIVE"],transition:["badgeOrange","● TRANSITION"],submitted:["badgeBlue","● SUBMITTED"],offline:["badgeRed","● OFFLINE"]};const [c,t]=map[s]||["badgeGray","● "+String(s||"UNKNOWN").toUpperCase()];return `<span class="badge ${c}">${t}</span>`}

async function viewStudentSession(examId,sessionId){
  const e=(await exams())[examId],s=(await get(ref(db,`examSessions/${examId}/${sessionId}`))).val();if(!s)return;
  const responses=s.responses||{};
  $("monitorDetail").innerHTML=`<div class="between"><div><span class="badge badgeBlue">STUDENT</span><h3 style="margin:8px 0">${esc(s.studentName||s.studentEmail)}</h3></div>${liveBadge(s.status)}</div><div class="grid grid2" style="margin-top:12px"><div><div class="small">Current Question</div><b>${Number(s.currentIndex||0)+1} / ${e.questions.length}</b></div><div><div class="small">Current Time</div><b>${fmtSec(s.timeLeft)}</b></div><div><div class="small">Current Section</div><b>${esc(s.currentSection||"—")}</b></div><div><div class="small">Current Response</div><b>${esc(s.currentResponse||"Unanswered")}</b></div></div><div style="margin-top:18px"><h4>Question-by-question response</h4>${e.questions.map((q,i)=>{const r=responses[i]||{};return `<div class="sectionCard" style="margin-top:8px"><div class="between"><b>Q${q.qnNo}. ${esc(q.text)}</b><span class="badge ${r.correct?"badgeGreen":r.answer?"badgeRed":"badgeGray"}">${r.answer?(r.correct?"CORRECT":"WRONG"):"UNANSWERED"}</span></div><div class="small" style="margin-top:7px">Displayed options: ${r.displayedOptions? r.displayedOptions.map((o,j)=>`${String.fromCharCode(65+j)}. ${esc(o)}`).join(" | "):"—"}</div><div class="small" style="margin-top:5px">Student response: <b>${esc(r.answer||"—")}</b> · Time used: <b>${fmtSec(r.timeUsed)}</b> · Marks: <b>${r.marksAwarded??0}</b></div></div>`}).join("")}</div>`;
}
window.viewStudentSession=viewStudentSession;

/* ---------- STUDENT ---------- */
async function studentDashboard(){
  const es=examArr(await exams()),published=es.filter(e=>e.status==="published");
  $("main").innerHTML=`<div class="pageTitle"><div><h1>Welcome to ExamFlow</h1><p>Your available examinations and results.</p></div></div><div class="card hero"><h2>Examination Rules</h2><p>Questions stay in the same order for every student. Options are shuffled individually. Once you leave a question, you cannot return to it. When its time expires, a 2-second transition shows the number of questions remaining before the next question starts.</p></div><div class="grid grid3" style="margin-top:18px">${published.slice(0,6).map(studentExamCard).join("")||`<div class="empty">No published examinations are available.</div>`}</div>`;
}
function studentExams(){return studentDashboard()}
function studentExamCard(e){return `<div class="card"><div class="between"><span class="badge badgeGreen">AVAILABLE</span><b>${e.questions.length} Q</b></div><h3>${esc(e.name)}</h3><div class="small">${Object.keys(e.sections||{}).length} sections · ${e.totalMarks} marks</div><button class="btn btnPrimary" style="margin-top:16px" onclick="startExam('${e.id}')">Start Exam</button></div>`}
window.startExam=startExam;

function shuffleOptions(q){
  const arr=q.options.map((text,i)=>({text,originalIndex:i}));for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr;
}
async function startExam(examId){
  const e=(await exams())[examId];if(!e||e.status!=="published")return toast("This exam is not available.","error");
  const existing=await get(ref(db,`examSessions/${examId}/${currentUser.uid}`));
  if(existing.exists()&&["active","submitted"].includes(existing.val().status))return toast(existing.val().status==="submitted"?"You have already submitted this exam.":"Your exam is already active.","error");
  const questions=e.questions.map(q=>{const d=shuffleOptions(q);return {...q,displayedOptions:d.map(x=>x.text),displayedOriginalIndices:d.map(x=>x.originalIndex)}});
  examState={examId,e,questions,index:0,startedAt:Date.now(),timeLeft:questions[0].allocatedTime,response:null,locked:false,responses:{},timer:null};
  await set(ref(db,`examSessions/${examId}/${currentUser.uid}`),{
    studentUid:currentUser.uid,studentEmail:currentUser.email,studentName:(await userData()).profile?.name||currentUser.email,
    status:"active",currentIndex:0,currentSection:questions[0].section,timeLeft:questions[0].allocatedTime,currentResponse:"",
    startedAt:examState.startedAt,responses:{}
  });
  renderExamQuestion();startQuestionTimer();
}
function renderExamQuestion(){
  const x=examState.questions[examState.index],selected=examState.response;
  $("root").innerHTML=`<div class="app"><header class="topbar"><div class="brand"><div class="brandMark">E</div>ExamFlow</div><div class="topUser"><span>${esc(currentUser.email)}</span><span class="badge badgeBlue">${esc(examState.e.name)}</span></div></header><div class="examTop"><div class="examLayout examMeta"><div><div class="questionNo">QUESTION ${examState.index+1} / ${examState.questions.length}</div><b>${esc(x.section)}</b></div><div style="text-align:right"><div class="small">Time left</div><div id="examTimer" class="timer">${fmtSec(examState.timeLeft)}</div></div></div></div><main class="main"><div class="examLayout"><div class="card"><div class="between"><span class="badge badgeBlue">${esc(x.section)}</span><span class="small">${x.marks} mark${x.marks===1?"":"s"}</span></div><div class="questionText">${esc(x.text)}</div><div id="options">${x.displayedOptions.map((o,i)=>`<button class="optionBtn ${selected===i?"selected":""}" data-i="${i}"><span class="optionLetter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join("")}</div><div class="examFooter"><div class="small">Questions remaining after this: ${examState.questions.length-examState.index-1}</div><button id="nextBtn" class="btn btnPrimary" disabled>Next →</button></div></div></div></main></div>`;
  document.querySelectorAll(".optionBtn").forEach(b=>b.onclick=()=>selectOption(Number(b.dataset.i)));
  $("nextBtn").onclick=()=>advanceQuestion("manual");
  updateNextButton();
}
function selectOption(i){if(examState.locked)return;examState.response=i;document.querySelectorAll(".optionBtn").forEach((b,j)=>b.classList.toggle("selected",i===j));updateNextButton();saveLiveResponse(i)}
function updateNextButton(){const b=$("nextBtn");if(b){b.disabled=examState.response===null;b.textContent=examState.index===examState.questions.length-1?"Submit Exam →":"Next →"}}
async function saveLiveResponse(i){
  if(!examState)return;const q=examState.questions[examState.index],letter=String.fromCharCode(65+i);
  await update(ref(db,`examSessions/${examState.examId}/${currentUser.uid}`),{currentResponse:letter,lastActivity:Date.now()});
}
function startQuestionTimer(){
  clearInterval(examState.timer);let last=Date.now();
  examState.timer=setInterval(async()=>{if(!examState||examState.locked)return;const now=Date.now(),delta=Math.max(0,Math.min(2,Math.round((now-last)/1000)));last=now;if(!delta)return;examState.timeLeft=Math.max(0,examState.timeLeft-delta);const t=$("examTimer");if(t){t.textContent=fmtSec(examState.timeLeft);t.classList.toggle("danger",examState.timeLeft<=5)}await update(ref(db,`examSessions/${examState.examId}/${currentUser.uid}`),{timeLeft:examState.timeLeft,lastActivity:Date.now()});if(examState.timeLeft<=0)advanceQuestion("timeout")},1000);
}
async function advanceQuestion(reason){
  if(!examState||examState.locked)return;examState.locked=true;clearInterval(examState.timer);
  const q=examState.questions[examState.index],response=examState.response;
  const correct=response!==null && q.displayedOriginalIndices[response]===q.correctIndex;
  const marks=correct?q.marks:0;
  examState.responses[examState.index]={answer:response===null?"":String.fromCharCode(65+response),correct,marksAwarded:marks,timeUsed:q.allocatedTime-examState.timeLeft,displayedOptions:q.displayedOptions,displayedOriginalIndices:q.displayedOriginalIndices,questionNo:q.qnNo,section:q.section};
  await update(ref(db,`examSessions/${examState.examId}/${currentUser.uid}/responses`),{[examState.index]:examState.responses[examState.index]});
  const remaining=examState.questions.length-examState.index-1;
  if(remaining<=0){await finishExam();return}
  showTransition(reason,remaining,2);
}
function showTransition(reason,remaining,seconds){
  let n=seconds;$("transitionRoot").innerHTML=`<div class="transition"><div class="transitionBox"><div class="transitionTitle">${reason==="timeout"?"⏰ TIME UP":"✓ QUESTION SAVED"}</div><div class="transitionSmall">Moving to the next question</div><div class="transitionSmall" style="margin-top:15px">Questions remaining</div><div class="transitionCount" id="transitionCount">${n}</div></div></div>`;
  const timer=setInterval(()=>{n--;if(n<=0){clearInterval(timer);$("transitionRoot").innerHTML="";loadNextQuestion()}else $("transitionCount").textContent=n},1000);
}
async function loadNextQuestion(){
  examState.index++;examState.response=null;examState.locked=false;examState.timeLeft=examState.questions[examState.index].allocatedTime;
  const q=examState.questions[examState.index];
  await update(ref(db,`examSessions/${examState.examId}/${currentUser.uid}`),{currentIndex:examState.index,currentSection:q.section,timeLeft:q.allocatedTime,currentResponse:"",status:"active",lastActivity:Date.now()});
  renderExamQuestion();startQuestionTimer();
}
async function finishExam(){
  const q=examState.questions[examState.index],response=examState.response,correct=response!==null&&q.displayedOriginalIndices[response]===q.correctIndex,marks=correct?q.marks:0;
  examState.responses[examState.index]={answer:response===null?"":String.fromCharCode(65+response),correct,marksAwarded:marks,timeUsed:q.allocatedTime-examState.timeLeft,displayedOptions:q.displayedOptions,displayedOriginalIndices:q.displayedOriginalIndices,questionNo:q.qnNo,section:q.section};
  const responses=examState.responses;
  const section={};Object.values(responses).forEach(r=>{if(!section[r.section])section[r.section]={obtained:0,total:0};section[r.section].obtained+=Number(r.marksAwarded||0)});
  examState.questions.forEach(q=>{if(!section[q.section])section[q.section]={obtained:0,total:0};section[q.section].total+=q.marks});
  Object.keys(section).forEach(k=>{section[k].percentage=section[k].total?section[k].obtained/section[k].total*100:100;section[k].pass=section[k].percentage>=65});
  const obtained=Object.values(responses).reduce((a,r)=>a+Number(r.marksAwarded||0),0),pct=examState.e.totalMarks?obtained/examState.e.totalMarks*100:0;
  const passed=Object.values(section).every(s=>s.pass);
  const result={studentUid:currentUser.uid,studentEmail:currentUser.email,examId:examState.examId,examName:examState.e.name,obtained,totalMarks:examState.e.totalMarks,percentage:pct,overallPass:passed,correct:Object.values(responses).filter(r=>r.correct).length,wrong:Object.values(responses).filter(r=>r.answer&&!r.correct).length,unanswered:examState.questions.length-Object.values(responses).filter(r=>r.answer).length,sectionResults:section,responses,completedAt:Date.now()};
  await set(ref(db,`examResults/${examState.examId}/${currentUser.uid}`),result);
  await update(ref(db,`examSessions/${examState.examId}/${currentUser.uid}`),{status:"submitted",completedAt:Date.now(),timeLeft:0,responses});
  clearInterval(examState.timer);examState=null;renderStudentResult(result);
}
function renderStudentResult(r){
  $("root").innerHTML=`<div class="app"><header class="topbar"><div class="brand"><div class="brandMark">E</div>ExamFlow</div><div class="topUser"><span>${esc(currentUser.email)}</span></div></header><main class="main"><div class="examLayout"><div class="pageTitle"><div><h1>Exam Completed</h1><p>${esc(r.examName)}</p></div><span class="badge ${r.overallPass?"badgeGreen":"badgeRed"}">${r.overallPass?"PASS":"FAIL"}</span></div><div class="card hero" style="text-align:center"><div class="resultBig">${r.obtained} / ${r.totalMarks}</div><div style="font-size:20px;font-weight:800;margin-top:4px">${r.percentage.toFixed(1)}%</div><p>You can see your marks and section results. Correct answers are not shown.</p></div><div class="grid grid4" style="margin-top:18px">${stat("✓","Correct",r.correct)}${stat("✕","Wrong",r.wrong)}${stat("—","Unanswered",r.unanswered)}${stat("📌","Sections",Object.keys(r.sectionResults).length)}</div><div class="card" style="margin-top:18px"><h3>Section-wise Result</h3>${Object.entries(r.sectionResults).map(([k,s])=>`<div class="sectionCard" style="margin-top:10px"><div class="between"><b>${esc(k)}</b><span class="badge ${s.pass?"badgeGreen":"badgeRed"}">${s.pass?"PASS":"FAIL"}</span></div><div style="margin-top:7px">${s.obtained} / ${s.total} marks · ${s.percentage.toFixed(1)}%</div><div class="progress" style="margin-top:9px"><div class="progressFill" style="width:${Math.min(100,s.percentage)}%"></div></div></div>`).join("")}</div><button class="btn btnPrimary" onclick="go('results')" style="margin-top:18px">Back to Results</button></div></main></div>`;
}
async function studentResults(){
  const s=await get(ref(db,`examResults`));const all=s.exists()?s.val():{},rows=[];Object.entries(all).forEach(([eid,v])=>{if(v[currentUser.uid])rows.push(v[currentUser.uid])});
  $("main").innerHTML=`<div class="pageTitle"><div><h1>My Results</h1><p>Marks and section-wise results from completed exams.</p></div></div><div class="card"><div class="tableWrap"><table class="table"><thead><tr><th>Exam</th><th>Marks</th><th>Percentage</th><th>Status</th><th>Date</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><b>${esc(r.examName)}</b></td><td>${r.obtained}/${r.totalMarks}</td><td>${Number(r.percentage).toFixed(1)}%</td><td><span class="badge ${r.overallPass?"badgeGreen":"badgeRed"}">${r.overallPass?"PASS":"FAIL"}</span></td><td>${fmtDate(r.completedAt)}</td></tr>`).join("")||`<tr><td colspan="5">No completed exams.</td></tr>`}</tbody></table></div></div>`;
}

/* ---------- ADMIN RESULTS / STUDENTS ---------- */
async function adminStudents(){
  const s=await get(ref(db,"users")),u=s.exists()?s.val():{},arr=Object.entries(u).filter(([id,x])=>x.profile?.role==="student"||x.profile?.email&&x.profile.email!==ADMIN_EMAIL_FALLBACK);
  $("main").innerHTML=`<div class="pageTitle"><div><h1>Students</h1><p>Firebase Authentication accounts with student role.</p></div></div><div class="card"><div class="tableWrap"><table class="table"><thead><tr><th>Student</th><th>User ID</th><th>Created</th></tr></thead><tbody>${arr.map(([id,x])=>`<tr><td><b>${esc(x.profile.email)}</b></td><td>${esc(id)}</td><td>${fmtDate(x.profile.createdAt)}</td></tr>`).join("")||`<tr><td colspan="3">No students.</td></tr>`}</tbody></table></div></div>`;
}
async function adminResults(){
  const [es,rs]=await Promise.all([exams(),get(ref(db,"examResults"))]);const ea=examArr(es),all=rs.exists()?rs.val():{};
  $("main").innerHTML=`<div class="pageTitle"><div><h1>Results & Reports</h1><p>View completed results and download summary PDFs.</p></div></div><div class="grid grid2">${ea.map(e=>{const rows=Object.values(all[e.id]||{});return `<div class="card"><div class="between"><h3>${esc(e.name)}</h3><span class="badge badgeBlue">${rows.length} results</span></div><div class="small" style="margin-top:7px">${e.questions.length} questions · ${e.totalMarks} marks</div><div class="row" style="margin-top:15px"><button class="btn btnSoft btnSmall" onclick="viewExamResults('${e.id}')">View Results</button><button class="btn btnPrimary btnSmall" onclick="downloadExamPDF('${e.id}')">Download PDF</button></div></div>`}).join("")||`<div class="empty">No results yet.</div>`}</div>`;
}
async function viewExamResults(examId){
  const [e,rs]=[(await exams())[examId],(await get(ref(db,`examResults/${examId}`))).val()||{}];const rows=Object.values(rs);
  $("main").innerHTML=`<div class="pageTitle"><div><button class="btn btnGhost btnSmall" onclick="go('results')">← Results</button><h1 style="margin-top:12px">${esc(e.name)}</h1><p>Student-wise final results.</p></div><button class="btn btnPrimary" onclick="downloadExamPDF('${examId}')">Download Summary PDF</button></div><div class="card"><div class="tableWrap"><table class="table"><thead><tr><th>Student</th><th>Marks</th><th>%</th><th>Status</th><th>Completed</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.studentName||r.studentEmail)}</b></td><td>${r.obtained}/${r.totalMarks}</td><td>${Number(r.percentage).toFixed(1)}%</td><td><span class="badge ${r.overallPass?"badgeGreen":"badgeRed"}">${r.overallPass?"PASS":"FAIL"}</span></td><td>${fmtDate(r.completedAt)}</td></tr>`).join("")||`<tr><td colspan="5">No submitted students.</td></tr>`}</tbody></table></div></div>`;
}
window.viewExamResults=viewExamResults;

/* ---------- PDF ---------- */
async function downloadExamPDF(examId){
  if(!window.jspdf){const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";document.head.appendChild(s);await new Promise((res,rej)=>{s.onload=res;s.onerror=rej})}
  const e=(await exams())[examId],snap=await get(ref(db,`examResults/${examId}`)),rows=Object.values(snap.exists()?snap.val():{});
  const {jsPDF}=window.jspdf,doc=new jsPDF();let y=18;
  const line=(text,size=10,bold=false)=>{doc.setFontSize(size);doc.setFont("helvetica",bold?"bold":"normal");const parts=doc.splitTextToSize(String(text),175);if(y+parts.length*6>280){doc.addPage();y=18}doc.text(parts,18,y);y+=parts.length*6+2};
  line("EXAMFLOW - EXAMINATION SUMMARY",18,true);line(e.name,14,true);line(`Generated: ${new Date().toLocaleString()}`);line(`Students completed: ${rows.length}`);line(`Total marks: ${e.totalMarks}`);y+=4;
  const pass=rows.filter(r=>r.overallPass).length,fail=rows.length-pass;line(`Pass: ${pass}   Fail: ${fail}`,11,true);y+=4;line("STUDENT RESULTS",13,true);
  rows.forEach((r,i)=>{line(`${i+1}. ${r.studentName||r.studentEmail} | ${r.obtained}/${r.totalMarks} | ${Number(r.percentage).toFixed(1)}% | ${r.overallPass?"PASS":"FAIL"}`,10);Object.entries(r.sectionResults||{}).forEach(([k,s])=>line(`   ${k}: ${s.obtained}/${s.total} (${s.percentage.toFixed(1)}%) - ${s.pass?"PASS":"FAIL"}`,9))});
  y+=5;line("SECTION SUMMARY",13,true);
  const summary={};rows.forEach(r=>Object.entries(r.sectionResults||{}).forEach(([k,s])=>{if(!summary[k])summary[k]={sum:0,n:0,pass:0,fail:0};summary[k].sum+=s.percentage;summary[k].n++;s.pass?summary[k].pass++:summary[k].fail++}));
  Object.entries(summary).forEach(([k,s])=>line(`${k}: average ${ (s.sum/s.n).toFixed(1)}% | PASS ${s.pass} | FAIL ${s.fail}`,10));
  doc.save((e.name||"exam").replace(/[^a-z0-9]+/gi,"_")+"_summary.pdf");
}
window.downloadExamPDF=downloadExamPDF;
