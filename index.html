<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyFlow | Smart Learning Portal</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --primary:#4f46e5;
    --primary2:#6366f1;
    --blue:#2563eb;
    --green:#16a34a;
    --orange:#f59e0b;
    --red:#ef4444;
    --text:#172033;
    --muted:#6b7280;
    --bg:#f6f8fc;
    --card:#ffffff;
    --border:#e7eaf1;
    --shadow:0 10px 30px rgba(30,41,59,.08);
}

body{
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* LOGIN */

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
    background:
        radial-gradient(circle at 10% 10%,#e0e7ff 0,transparent 28%),
        radial-gradient(circle at 90% 90%,#dbeafe 0,transparent 28%),
        #f8fafc;
}

.login-box{
    width:430px;
    max-width:100%;
    background:white;
    border-radius:28px;
    padding:38px;
    box-shadow:0 25px 70px rgba(30,41,59,.12);
    animation:fadeUp .6s ease;
}

.logo{
    width:65px;
    height:65px;
    border-radius:18px;
    background:linear-gradient(135deg,var(--primary),#818cf8);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    margin-bottom:18px;
    box-shadow:0 10px 25px rgba(79,70,229,.25);
}

.login-box h1{
    font-size:30px;
    margin-bottom:7px;
}

.login-box p{
    color:var(--muted);
    margin-bottom:28px;
}

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:7px;
}

input,textarea,select{
    width:100%;
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    outline:none;
    background:white;
    color:var(--text);
    transition:.2s;
}

textarea{
    resize:vertical;
    min-height:110px;
}

input:focus,textarea:focus,select:focus{
    border-color:var(--primary2);
    box-shadow:0 0 0 4px rgba(99,102,241,.10);
}

.btn{
    border:0;
    border-radius:12px;
    padding:12px 18px;
    font-weight:700;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-secondary{
    background:#eef2ff;
    color:#4338ca;
}

.btn-success{
    background:#dcfce7;
    color:#15803d;
}

.btn-danger{
    background:#fee2e2;
    color:#b91c1c;
}

.full{
    width:100%;
}

.demo{
    background:#f8fafc;
    border-radius:14px;
    padding:14px;
    margin-top:18px;
    font-size:13px;
    color:#64748b;
}

/* APP */

.app{
    min-height:100vh;
    display:flex;
}

.sidebar{
    width:250px;
    background:white;
    border-right:1px solid var(--border);
    padding:22px 16px;
    position:fixed;
    top:0;
    bottom:0;
    left:0;
    z-index:20;
}

.side-logo{
    display:flex;
    align-items:center;
    gap:11px;
    padding:8px 10px 25px;
}

.side-logo-icon{
    width:42px;
    height:42px;
    border-radius:13px;
    background:linear-gradient(135deg,var(--primary),#818cf8);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.side-logo strong{
    font-size:19px;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.nav button{
    width:100%;
    text-align:left;
    border:0;
    background:transparent;
    padding:12px 13px;
    border-radius:11px;
    color:#64748b;
    font-weight:600;
}

.nav button:hover,
.nav button.active{
    background:#eef2ff;
    color:#4338ca;
}

.logout{
    position:absolute;
    bottom:20px;
    left:16px;
    right:16px;
}

.main{
    margin-left:250px;
    width:calc(100% - 250px);
}

.topbar{
    height:75px;
    background:white;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    position:sticky;
    top:0;
    z-index:10;
}

.user{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#e0e7ff;
    color:#4338ca;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.content{
    padding:30px;
    max-width:1500px;
    margin:auto;
}

.page-title{
    margin-bottom:25px;
}

.page-title h2{
    font-size:28px;
    margin-bottom:5px;
}

.page-title p{
    color:var(--muted);
}

/* CARDS */

.grid{
    display:grid;
    gap:20px;
}

.grid-4{
    grid-template-columns:repeat(4,1fr);
}

.grid-3{
    grid-template-columns:repeat(3,1fr);
}

.grid-2{
    grid-template-columns:repeat(2,1fr);
}

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:20px;
    padding:22px;
    box-shadow:var(--shadow);
    animation:fadeUp .4s ease;
}

.stat{
    position:relative;
    overflow:hidden;
}

.stat:after{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    background:#eef2ff;
    right:-35px;
    top:-35px;
}

.stat-icon{
    width:45px;
    height:45px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#eef2ff;
    color:#4338ca;
    font-size:20px;
    margin-bottom:14px;
}

.stat h3{
    font-size:27px;
    margin-bottom:4px;
}

.stat p{
    color:var(--muted);
    font-size:14px;
}

.subject-card{
    position:relative;
    overflow:hidden;
    cursor:pointer;
    transition:.25s;
}

.subject-card:hover{
    transform:translateY(-5px);
    box-shadow:0 18px 40px rgba(30,41,59,.12);
}

.subject-icon{
    width:55px;
    height:55px;
    border-radius:16px;
    background:#eef2ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    margin-bottom:17px;
}

.subject-card h3{
    margin-bottom:6px;
}

.subject-card p{
    color:var(--muted);
    font-size:14px;
}

.progress{
    width:100%;
    height:8px;
    background:#edf0f5;
    border-radius:20px;
    overflow:hidden;
    margin:14px 0 7px;
}

.progress-bar{
    height:100%;
    background:linear-gradient(90deg,var(--primary),#818cf8);
    border-radius:20px;
    transition:width 1s ease;
}

.progress-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--muted);
}

/* TABLE */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    text-align:left;
    padding:14px;
    border-bottom:1px solid var(--border);
    font-size:14px;
}

th{
    color:#64748b;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.05em;
}

/* MODULE */

.module{
    margin-bottom:16px;
    border:1px solid var(--border);
    border-radius:17px;
    overflow:hidden;
    background:white;
}

.module-header{
    padding:17px 19px;
    background:#fafbff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
}

.module-header h3{
    font-size:16px;
}

.chapter-list{
    padding:5px 12px 12px;
}

.chapter{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:14px;
    border-bottom:1px solid #f0f1f5;
}

.chapter:last-child{
    border-bottom:0;
}

.chapter-info{
    display:flex;
    align-items:center;
    gap:12px;
}

.chapter-number{
    width:34px;
    height:34px;
    border-radius:10px;
    background:#f1f5f9;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:700;
}

.done{
    background:#dcfce7;
    color:#15803d;
}

.badge{
    display:inline-flex;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
}

.badge-green{
    background:#dcfce7;
    color:#15803d;
}

.badge-orange{
    background:#fef3c7;
    color:#a16207;
}

.badge-blue{
    background:#dbeafe;
    color:#1d4ed8;
}

/* LEARNING */

.learning{
    max-width:1000px;
    margin:auto;
}

.video-box{
    background:#111827;
    border-radius:20px;
    overflow:hidden;
    position:relative;
    aspect-ratio:16/9;
}

.video-box iframe{
    width:100%;
    height:100%;
    border:0;
}

.video-placeholder{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    flex-direction:column;
    gap:12px;
}

.video-placeholder span{
    font-size:45px;
}

.stepper{
    display:flex;
    gap:8px;
    margin-bottom:20px;
}

.step{
    flex:1;
    height:7px;
    border-radius:10px;
    background:#e5e7eb;
}

.step.active{
    background:var(--primary);
}

.step.complete{
    background:var(--green);
}

.timer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#eef2ff;
    border-radius:15px;
    padding:15px 18px;
    margin-top:15px;
    color:#4338ca;
}

.timer strong{
    font-size:21px;
}

.question{
    padding:20px;
    border:1px solid var(--border);
    border-radius:16px;
    margin-bottom:15px;
}

.option{
    display:block;
    padding:12px;
    margin-top:8px;
    border:1px solid var(--border);
    border-radius:10px;
    cursor:pointer;
}

.option:hover{
    background:#f8fafc;
}

/* MODAL */

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.45);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal{
    width:650px;
    max-width:100%;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:22px;
    padding:27px;
    animation:fadeUp .3s ease;
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.close{
    border:0;
    background:#f1f5f9;
    border-radius:50%;
    width:35px;
    height:35px;
}

/* TOAST */

.toast{
    position:fixed;
    right:25px;
    bottom:25px;
    background:#172033;
    color:white;
    padding:13px 18px;
    border-radius:12px;
    box-shadow:0 15px 35px rgba(0,0,0,.15);
    z-index:500;
    animation:toast .3s ease;
}

/* ANIMATION */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes toast{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* MOBILE */

.mobile-menu{
    display:none;
}

@media(max-width:1000px){
    .grid-4{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:750px){

    .sidebar{
        transform:translateX(-100%);
        transition:.3s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
        width:100%;
    }

    .mobile-menu{
        display:block;
        border:0;
        background:#eef2ff;
        color:#4338ca;
        border-radius:9px;
        padding:8px 11px;
    }

    .content{
        padding:20px;
    }

    .topbar{
        padding:0 18px;
    }

    .grid-4,
    .grid-3,
    .grid-2{
        grid-template-columns:1fr;
    }

    .chapter{
        align-items:flex-start;
        flex-direction:column;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="login-page">

    <div class="login-box">

        <div class="logo">📚</div>

        <h1>StudyFlow</h1>
        <p>Smart learning and assessment portal</p>

        <div class="form-group">
            <label>Username</label>
            <input id="loginUser" placeholder="Enter username">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input id="loginPassword" type="password" placeholder="Enter password">
        </div>

        <button class="btn btn-primary full" onclick="login()">
            Login
        </button>

        <div class="demo">
            <strong>Demo Accounts</strong><br><br>
            Teacher: teacher / 1234<br>
            Students: student1 to student5 / 1234
        </div>

    </div>
</div>


<!-- APPLICATION -->

<div id="app" class="app hidden">

    <aside id="sidebar" class="sidebar">

        <div class="side-logo">
            <div class="side-logo-icon">📚</div>
            <strong>StudyFlow</strong>
        </div>

        <div class="nav" id="navigation"></div>

        <button class="btn btn-danger full logout" onclick="logout()">
            Logout
        </button>

    </aside>


    <main class="main">

        <header class="topbar">

            <button class="mobile-menu" onclick="toggleSidebar()">
                ☰
            </button>

            <div id="pageTopTitle">
                Dashboard
            </div>

            <div class="user">
                <div>
                    <strong id="currentUserName">User</strong>
                </div>
                <div class="avatar" id="avatar">U</div>
            </div>

        </header>

        <div id="content" class="content"></div>

    </main>

</div>


<!-- MODAL -->

<div id="modalBg" class="modal-bg hidden">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modalTitle">Modal</h2>
            <button class="close" onclick="closeModal()">×</button>
        </div>
        <div id="modalContent"></div>
    </div>
</div>


<script>

/* =========================================================
   DATA
========================================================= */

const STORAGE_KEY = "studyflow_data_v1";

let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    students:[
        {id:"student1",name:"Student 1",password:"1234"},
        {id:"student2",name:"Student 2",password:"1234"},
        {id:"student3",name:"Student 3",password:"1234"},
        {id:"student4",name:"Student 4",password:"1234"},
        {id:"student5",name:"Student 5",password:"1234"}
    ],

    subjects:[
        {
            id:"sub1",
            name:"Mathematics",
            icon:"📐",
            modules:[
                {
                    id:"mod1",
                    name:"Algebra",
                    chapters:[
                        {
                            id:"ch1",
                            name:"Introduction to Algebra",
                            marks:10,
                            video:"",
                            questions:[
                                {
                                    q:"What is an algebraic variable?",
                                    options:["A fixed number","A symbol representing a value","A colour","A shape"],
                                    answer:1
                                },
                                {
                                    q:"Which is a linear expression?",
                                    options:["2x + 3","x² + 2","x³","xy"],
                                    answer:0
                                }
                            ]
                        }
                    ]
                }
            ]
        }
    ],

    results:{},
    studyTime:{}
};

let currentUser = null;
let currentView = "dashboard";
let currentSubject = null;
let currentChapter = null;

let studyTimer = null;
let studySeconds = 0;
let timerStarted = false;


/* =========================================================
   SAVE
========================================================= */

function saveData(){
    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}


/* =========================================================
   LOGIN
========================================================= */

function login(){

    const username=document.getElementById("loginUser").value.trim();
    const password=document.getElementById("loginPassword").value;

    if(username==="teacher" && password==="1234"){

        currentUser={
            role:"teacher",
            id:"teacher",
            name:"Teacher"
        };

    }else{

        const student=data.students.find(
            s=>s.id===username && s.password===password
        );

        if(!student){
            toast("Invalid username or password");
            return;
        }

        currentUser={
            role:"student",
            id:student.id,
            name:student.name
        };
    }

    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    document.getElementById("currentUserName").textContent=currentUser.name;
    document.getElementById("avatar").textContent=currentUser.name.charAt(0).toUpperCase();

    setupNavigation();
    showView("dashboard");
}


function logout(){

    stopStudyTimer();

    currentUser=null;

    document.getElementById("app").classList.add("hidden");
    document.getElementById("loginPage").classList.remove("hidden");

    document.getElementById("loginUser").value="";
    document.getElementById("loginPassword").value="";
}


/* =========================================================
   NAVIGATION
========================================================= */

function setupNavigation(){

    const nav=document.getElementById("navigation");

    if(currentUser.role==="teacher"){

        nav.innerHTML=`
            <button onclick="showView('dashboard')">🏠 Dashboard</button>
            <button onclick="showView('subjects')">📚 Subjects</button>
            <button onclick="showView('students')">👨‍🎓 Students</button>
            <button onclick="showView('results')">📊 Results</button>
            <button onclick="showView('analytics')">⏱ Study Analytics</button>
        `;

    }else{

        nav.innerHTML=`
            <button onclick="showView('dashboard')">🏠 Dashboard</button>
            <button onclick="showView('subjects')">📚 My Subjects</button>
            <button onclick="showView('progress')">📈 My Progress</button>
            <button onclick="showView('studytime')">⏱ Study Time</button>
        `;
    }
}


function showView(view){

    stopStudyTimer();

    currentView=view;

    document.querySelectorAll(".nav button")
        .forEach(b=>b.classList.remove("active"));

    document.getElementById("sidebar").classList.remove("open");

    const content=document.getElementById("content");

    if(view==="dashboard"){

        currentUser.role==="teacher"
            ? renderTeacherDashboard()
            : renderStudentDashboard();

    }else if(view==="subjects"){

        currentUser.role==="teacher"
            ? renderTeacherSubjects()
            : renderStudentSubjects();

    }else if(view==="students"){

        renderStudents();

    }else if(view==="results"){

        renderResults();

    }else if(view==="analytics"){

        renderAnalytics();

    }else if(view==="progress"){

        renderStudentProgress();

    }else if(view==="studytime"){

        renderStudyTime();
    }
}


function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("open");
}


/* =========================================================
   TEACHER DASHBOARD
========================================================= */

function renderTeacherDashboard(){

    document.getElementById("pageTopTitle").textContent="Teacher Dashboard";

    let chapters=0;

    data.subjects.forEach(s=>{
        s.modules.forEach(m=>{
            chapters+=m.chapters.length;
        });
    });

    const completed=Object.values(data.results)
        .filter(r=>r.completed).length;

    const totalStudy=Object.values(data.studyTime)
        .reduce((a,b)=>a+b,0);

    document.getElementById("content").innerHTML=`

        <div class="page-title">
            <h2>Good day, Teacher 👋</h2>
            <p>Manage your learning content and monitor student performance.</p>
        </div>

        <div class="grid grid-4">

            ${statCard("👨‍🎓",data.students.length+"/5","Students")}

            ${statCard("📚",data.subjects.length+"/50","Subjects")}

            ${statCard("📖",chapters,"Total Chapters")}

            ${statCard("⏱",formatTime(totalStudy),"Total Study Time")}

        </div>

        <br>

        <div class="card">

            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px;flex-wrap:wrap">

                <div>
                    <h3>Subject Overview</h3>
                    <p style="color:var(--muted);font-size:14px;margin-top:4px">
                        Manage up to 50 subjects
                    </p>
                </div>

                <button class="btn btn-primary" onclick="addSubject()">
                    + Add Subject
                </button>

            </div>

            <div class="grid grid-3">

                ${data.subjects.slice(0,6).map(subjectCardTeacher).join("")}

            </div>

        </div>
    `;
}


function statCard(icon,value,label){

    return `
        <div class="card stat">
            <div class="stat-icon">${icon}</div>
            <h3>${value}</h3>
            <p>${label}</p>
        </div>
    `;
}


/* =========================================================
   SUBJECTS
========================================================= */

function subjectCardTeacher(s){

    const total=s.modules.reduce((a,m)=>a+m.chapters.length,0);

    return `
        <div class="card subject-card"
             onclick="openSubject('${s.id}')">

            <div class="subject-icon">${s.icon}</div>

            <h3>${escapeHTML(s.name)}</h3>

            <p>
                ${s.modules.length} Modules · ${total} Chapters
            </p>

            <div style="margin-top:15px">
                <button class="btn btn-secondary"
                        onclick="event.stopPropagation();openSubject('${s.id}')">
                    Manage
                </button>
            </div>

        </div>
    `;
}


function renderTeacherSubjects(){

    document.getElementById("pageTopTitle").textContent="Subjects";

    document.getElementById("content").innerHTML=`

        <div class="page-title">

            <h2>Subjects</h2>

            <p>

function saveChapter(subjectId,moduleId,chapterId){

    const name=document.getElementById("chapterName").value.trim();
    const video=document.getElementById("chapterVideo").value.trim();
    const marks=Number(document.getElementById("chapterMarks").value)||10;

    if(!name){
        toast("Enter chapter name");
        return;
    }

    const questions=[];

    for(let i=1;i<=2;i++){

        const q=document.getElementById("q"+i).value.trim();
        const opts=document.getElementById("o"+i).value
            .split("|")
            .map(x=>x.trim())
            .filter(Boolean);

        const answer=Number(document.getElementById("a"+i).value)-1;

        if(q && opts.length>=2){

            questions.push({
                q,
                options:opts,
                answer:Math.max(0,Math.min(answer,opts.length-1))
            });
        }
    }

    const subject=data.subjects.find(s=>s.id===subjectId);
    const module=subject.modules.find(m=>m.id===moduleId);

    if(chapterId==="null"){

        module.chapters.push({
            id:"ch_"+Date.now(),
            name,
            video,
            marks,
            questions
        });

    }else{

        const chapter=module.chapters.find(c=>c.id===chapterId);

        chapter.name=name;
        chapter.video=video;
        chapter.marks=marks;
        chapter.questions=questions;
    }

    saveData();
    closeModal();
    toast("Chapter saved");
    openSubject(subjectId);
}


/* =========================================================
   OPEN CHAPTER
========================================================= */

function openChapter(chapterId){

    let found=null;

    for(const s of data.subjects){

        for(const m of s.modules){

            const c=m.chapters.find(x=>x.id===chapterId);

            if(c){
                found={
                    subject:s,
                    module:m,
                    chapter:c
                };
            }
        }
    }

    if(!found)return;

    currentSubject=found.subject;
    currentChapter=found.chapter;

    if(currentUser.role==="teacher"){

        openChapterEditor(
            found.subject.id,
            found.module.id,
            found.chapter
        );

        return;
    }

    startLearning(found);
}


/* =========================================================

========================================================= */

function startLearning(found){

    studySeconds=0;
    timerStarted=false;

    let step=1;

    function renderStep(){

        const c=found.chapter;

        const videoId=getYouTubeId(c.video);

        let body="";

        if(step===1){

                             </div>`
                        }

                        <strong id="studyTimer">00:00:00</strong>
                    </div>

                    <br>

                            onclick="nextStep()">

                    </button>

                </div>
            `;

        }else if(step===2){

            body=`

                <div class="card">

                    <h3>Video Remarks</h3>

                    <p style="color:var(--muted);margin:7px 0 20px">
                        Share your feedback about this video.
                    </p>

                    <div class="form-group">

                        <select id="videoRating">
                            <option>Very Easy</option>
                            <option>Easy</option>
                            <option>Moderate</option>
                            <option>Difficult</option>
                            <option>Very Difficult</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Your Remarks</label>
                        <textarea id="videoRemarks"
                            placeholder="Write your remarks..."></textarea>
                    </div>

                    <button class="btn btn-primary"
                            onclick="nextStep()">
                        Continue
                    </button>

                </div>
            `;

        }else if(step===3){

            body=`

                <div class="card">

                    <h3>What Did You Learn?</h3>

                    <p style="color:var(--muted);margin:7px 0 20px">
                        Write the important things you understood.
                    </p>

                    <textarea id="learnedText"
                        placeholder="What did you learn from this chapter?"></textarea>

                    <br><br>

                    <button class="btn btn-primary"
                            onclick="nextStep()">
                        Continue to Assessment
                    </button>

                </div>
            `;

        }else if(step===4){

            const questions=c.questions||[];

            body=`

                <div class="card">

                    <h3>Assessment</h3>

                    <p style="color:var(--muted);margin:7px 0 20px">
                        ${questions.length} Questions · ${c.marks} Marks
                    </p>

                    ${
                        questions.length
                        ?
                        questions.map((q,i)=>`

                            <div class="question">

                                <strong>
                                    ${i+1}. ${escapeHTML(q.q)}
                                </strong>

                                ${q.options.map((o,j)=>`

                                    <label class="option">

                                        <input
                                            type="radio"
                                            name="question${i}"
                                            value="${j}">

                                        ${escapeHTML(o)}

                                    </label>

                                `).join("")}

                            </div>

                        `).join("")
                        :
                        `<p style="color:var(--muted)">
                            No assessment questions have been added.
                        </p>`
                    }

                    <button class="btn btn-primary"
                            onclick="submitAssessment()">
                        Submit Assessment
                    </button>

                </div>
            `;

        }

        document.getElementById("pageTopTitle").textContent=c.name;

        document.getElementById("content").innerHTML=`

            <div class="learning">

                <div class="page-title">
                    <h2>${escapeHTML(c.name)}</h2>
                    <p>
                        ${escapeHTML(found.subject.name)}
                        ·
                        ${escapeHTML(found.module.name)}
                    </p>
                </div>

                <div class="stepper">

                    ${[1,2,3,4].map(x=>`
                        <div class="step
                            ${x<step?"complete":""}
                            ${x===step?"active":""}">
                        </div>
                    `).join("")}

                </div>

                ${body}

            </div>
        `;

        if(step===1){

            startStudyTimer();

        }
    }


    window.nextStep=function(){

        if(step<4){

            step++;
            renderStep();

        }
    };


    window.submitAssessment=function(){

        const questions=found.chapter.questions||[];

        let correct=0;

        questions.forEach((q,i)=>{

            const selected=document.querySelector(
                `input[name="question${i}"]:checked`
            );

            if(selected && Number(selected.value)===q.answer){
                correct++;
            }
        });

        const score=questions.length
            ? Math.round(
                correct/questions.length*found.chapter.marks
              )
            : found.chapter.marks;

        stopStudyTimer();

        const key=`${currentUser.id}_${found.chapter.id}`;

        data.results[key]={
            studentId:currentUser.id,
            subjectId:found.subject.id,
            moduleId:found.module.id,
            chapterId:found.chapter.id,
            score,
            maxMarks:found.chapter.marks,
            completed:true,
            studySeconds
        };

        data.studyTime[currentUser.id]=
            (data.studyTime[currentUser.id]||0)+studySeconds;

        saveData();

        document.getElementById("content").innerHTML=`

            <div class="learning">

                <div class="card"
                     style="text-align:center;padding:50px 25px">

                    <div style="font-size:65px;margin-bottom:15px">
                        🎉
                    </div>

                    <h2>Chapter Completed!</h2>

                    <p style="color:var(--muted);margin:8px 0 25px">
                        ${escapeHTML(found.chapter.name)}
                    </p>

                    <div class="grid grid-3">

                        ${statCard("⭐",
                            score+"/"+found.chapter.marks,
                            "Assessment Score")}

                        ${statCard("⏱",
                            formatTime(studySeconds),
                            "Study Time")}

                        ${statCard("✓",
                            "100%",
                            "Completion")}

                    </div>

                    <br>

                    <button class="btn btn-primary"
                            onclick="openSubject('${found.subject.id}')">
                        Back to Subject
                    </button>

                </div>

            </div>
        `;
    };


    renderStep();
}


/* =========================================================
   TIMER
========================================================= */

function startStudyTimer(){

    stopStudyTimer();

    timerStarted=true;

    studyTimer=setInterval(()=>{

        if(timerStarted){

            studySeconds++;

            const el=document.getElementById("studyTimer");

            if(el){
                el.textContent=formatTime(studySeconds);
            }
        }

    },1000);
}


function stopStudyTimer(){

    if(studyTimer){
        clearInterval(studyTimer);
        studyTimer=null;
    }

    timerStarted=false;
}


function formatTime(seconds){

    seconds=Math.floor(seconds||0);

    const h=Math.floor(seconds/3600);
    const m=Math.floor((seconds%3600)/60);
    const s=seconds%60;

    return String(h).padStart(2,"0")+":"+
           String(m).padStart(2,"0")+":"+
           String(s).padStart(2,"0");
}

function getSubjectProgress(subject){

    let total=0;
    let completed=0;

    subject.modules.forEach(m=>{

        m.chapters.forEach(c=>{

            total++;

            const key=`${currentUser.id}_${c.id}`;

            if(data.results[key]?.completed){
                completed++;
            }

        });

    });

    return total
        ? Math.round(completed/total*100)
        : 0;
}

                                </tr>
                            `;

                        }).join("")}

                    </tbody>

                </table>

            </div>

        </div>
    `;
}


function addStudent(){

    if(data.students.length>=5){
        toast("Maximum 5 students allowed");
        return;
    }

    openModal(
        "Add Student",
        `
        <div class="form-group">
            <label>Student Username</label>
            <input id="studentId"
                   placeholder="student6">
        </div>

        <div class="form-group">
            <label>Student Name</label>
            <input id="studentName"
                   placeholder="Student Name">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input id="studentPassword"
                   value="1234">
        </div>

        <button class="btn btn-primary"
                onclick="saveStudent()">
            Create Student
        </button>
        `
    );
}


function saveStudent(){

    const id=document.getElementById("studentId").value.trim();
    const name=document.getElementById("studentName").value.trim();
    const password=document.getElementById("studentPassword").value;

    if(!id||!name||!password){
        toast("Fill all fields");
        return;
    }

    if(data.students.some(s=>s.id===id)){
        toast("Username already exists");
        return;
    }

    data.students.push({
        id,
        name,
        password
    });

    saveData();
    closeModal();
    renderStudents();
    toast("Student account created");
}


function deleteStudent(id){

    if(!confirm("Remove this student?"))return;

    data.students=data.students.filter(s=>s.id!==id);

    Object.keys(data.results).forEach(key=>{
        if(data.results[key].studentId===id){
            delete data.results[key];
        }
    });

    delete data.studyTime[id];

    saveData();
    renderStudents();
}


/* =========================================================
   RESULTS
========================================================= */

function renderResults(){

    document.getElementById("pageTopTitle").textContent="Results";

    const rows=[];

    data.students.forEach(student=>{

        Object.values(data.results)
            .filter(r=>r.studentId===student.id)
            .forEach(r=>{

                let subject=data.subjects.find(
                    s=>s.id===r.subjectId
                );

                rows.push(`
                    <tr>
                        <td>${escapeHTML(student.name)}</td>
                        <td>${escapeHTML(subject?.name||"Unknown")}</td>
                        <td>${r.score}/${r.maxMarks}</td>
                        <td>
                            <span class="badge badge-green">
                                Completed
                            </span>
                        </td>
                        <td>${formatTime(r.studySeconds||0)}</td>
                    </tr>
                `);
            });
    });

    document.getElementById("content").innerHTML=`

        <div class="page-title">
            <h2>Assessment Results</h2>
            <p>Student chapter performance.</p>
        </div>

        <div class="card">

            <div class="table-wrap">

                <table>

                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Subject</th>
                            <th>Marks</th>
                            <th>Status</th>
                            <th>Study Time</th>
                        </tr>
                    </thead>

                    <tbody>

                        ${
                            rows.length
                            ? rows.join("")
                            :
                            `<tr>
                                <td colspan="5">
                                    No assessments submitted yet.
                                </td>
                             </tr>`
                        }

                    </tbody>

                </table>

            </div>

        </div>
    `;
}


/* =========================================================
   ANALYTICS
========================================================= */

function renderAnalytics(){

    document.getElementById("pageTopTitle").textContent="Study Analytics";

    document.getElementById("content").innerHTML=`

        <div class="page-title">
            <h2>Study Analytics</h2>
            <p>Track learning activity across all students.</p>
        </div>

        <div class="grid grid-2">

            ${data.students.map(s=>{

                const time=data.studyTime[s.id]||0;

                const completed=Object.values(data.results)

                                </p>

                            <div style="font-size:28px">

                            </div>

                        </div>

                        <br>

                        <div class="grid grid-2">

                            ${statCard("⏱",
                                formatTime(time),

                                "Completed")}

}


/* =========================================================
   DELETE SUBJECT
========================================================= */

function deleteSubject(id){

    if(!confirm("Delete this subject and all its modules?"))return;

    data.subjects=data.subjects.filter(s=>s.id!==id);

    saveData();
    showView("subjects");
}


/* =========================================================
   MODAL
========================================================= */

function openModal(title,html){

    document.getElementById("modalTitle").textContent=title;
    document.getElementById("modalContent").innerHTML=html;
    document.getElementById("modalBg").classList.remove("hidden");
}


function closeModal(){

    document.getElementById("modalBg").classList.add("hidden");
}


/* =========================================================
   UTILITIES
========================================================= */

function toast(message){

    const old=document.querySelector(".toast");

    if(old)old.remove();

    const el=document.createElement("div");

    el.className="toast";
    el.textContent=message;

    document.body.appendChild(el);

    setTimeout(()=>{
        el.remove();
    },2500);
}


function escapeHTML(str){

    return String(str||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function escapeAttr(str){

    return escapeHTML(str);
}


function getYouTubeId(url){

    if(!url)return null;

    const patterns=[
        /youtu\.be\/([^?&]+)/,
        /youtube\.com\/watch\?v=([^?&]+)/,
        /youtube\.com\/embed\/([^?&]+)/,
        /youtube\.com\/shorts\/([^?&]+)/
    ];

    for(const pattern of patterns){

        const match=url.match(pattern);

        if(match)return match[1];
    }

    return null;
}

document.addEventListener("keydown",e=>{

    if(e.key==="Escape"){
        closeModal();
