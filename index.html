<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyFlow LMS</title>
<style>
:root{
  --bg:#f6f8fc;--surface:#fff;--surface2:#f8fafc;--text:#172033;--muted:#687386;
  --line:#e6eaf0;--primary:#2563eb;--primary2:#4f46e5;--success:#16a34a;
  --warning:#d97706;--danger:#dc2626;--shadow:0 12px 35px rgba(31,41,55,.08);
  --radius:18px;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}
.hidden{display:none!important}
.app{min-height:100vh}.topbar{height:70px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:11px;font-weight:850;font-size:20px}.brandMark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(37,99,235,.22)}
.topUser{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;background:#e8efff;color:var(--primary);display:grid;place-items:center;font-weight:800}
.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 70px)}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:7px}.navBtn{width:100%;padding:12px 14px;text-align:left;background:transparent;color:#596579;border-radius:11px;font-weight:650;transition:.2s}.navBtn:hover,.navBtn.active{background:#eef4ff;color:var(--primary);transform:translateX(2px)}
.main{padding:28px;max-width:1500px;width:100%;margin:auto}.pageTitle{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px}.pageTitle h1{margin:0;font-size:29px}.pageTitle p{margin:6px 0 0;color:var(--muted)}
.grid{display:grid;gap:18px}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stat{padding:19px}.statLabel{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}.statValue{font-size:30px;font-weight:850;margin-top:6px}.statIcon{float:right;width:40px;height:40px;border-radius:12px;background:#eff5ff;color:var(--primary);display:grid;place-items:center}
.btn{padding:10px 14px;border-radius:11px;font-weight:750;transition:.2s}.btn:hover{transform:translateY(-1px)}.btnPrimary{background:var(--primary);color:#fff}.btnSoft{background:#eef4ff;color:var(--primary)}.btnSuccess{background:#eaf8ef;color:var(--success)}.btnDanger{background:#fff0f0;color:var(--danger)}.btnGhost{background:#f3f5f8;color:#4b5563}
.btnSmall{padding:7px 10px;border-radius:9px;font-size:12px}.row{display:flex;gap:10px;align-items:center}.between{display:flex;justify-content:space-between;gap:12px;align-items:center}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid #dbe1ea;border-radius:11px;background:#fff;color:var(--text);outline:none}input:focus,textarea:focus,select:focus{border-color:#8db0ff;box-shadow:0 0 0 3px #e9f0ff}label{font-size:12px;font-weight:750;color:#596579;display:block;margin:0 0 6px}.field{margin-bottom:14px}
.progress{height:9px;background:#edf0f5;border-radius:99px;overflow:hidden}.progressFill{height:100%;background:linear-gradient(90deg,var(--primary),#7c3aed);border-radius:99px;transition:width .5s}
.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.badgeBlue{background:#eaf1ff;color:#2455bd}.badgeGreen{background:#eaf8ef;color:#15803d}.badgeOrange{background:#fff5e6;color:#b45309}.badgeRed{background:#fff0f0;color:#b91c1c}
.subjectCard{transition:.25s;cursor:pointer}.subjectCard:hover{transform:translateY(-4px);box-shadow:0 18px 42px rgba(31,41,55,.12)}.subjectIcon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#edf4ff,#f0ecff);display:grid;place-items:center;color:var(--primary);font-size:21px}
.listItem{border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:10px;background:#fff}.moduleHeader{display:flex;justify-content:space-between;align-items:center;gap:10px}.chapterRow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #f0f2f5}.chapterNo{width:30px;height:30px;border-radius:9px;background:#f0f4fa;display:grid;place-items:center;font-size:12px;font-weight:800;color:#64748b}
.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed #d6dce6;border-radius:15px}.search{max-width:320px}
.loginPage{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#f6f9ff,#f7f6ff)}.loginCard{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 25px 70px rgba(37,51,84,.12);padding:34px}.loginLogo{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:grid;place-items:center;font-size:25px;margin-bottom:18px}.loginCard h1{margin:0;font-size:27px}.loginCard p{color:var(--muted);line-height:1.55}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.35);display:grid;place-items:center;padding:20px;z-index:50}.modalBox{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 25px 70px rgba(17,24,39,.2);padding:24px}
.videoWrap{aspect-ratio:16/9;background:#101828;border-radius:15px;overflow:hidden}.videoWrap iframe{width:100%;height:100%;border:0}.chapterLayout{display:grid;grid-template-columns:1.55fr .85fr;gap:20px}.stickyCard{position:sticky;top:90px;align-self:start}
.checkRow{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:9px}.checkRow input{width:auto;margin-top:4px}.scoreCircle{width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--primary) var(--p),#edf0f5 0);display:grid;place-items:center;margin:auto}.scoreCircle:before{content:"";position:absolute}.scoreInner{width:102px;height:102px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:25px;font-weight:850}
.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 14px 35px rgba(0,0,0,.18);z-index:100;animation:toast .25s ease}.toast.success{background:#166534}.toast.error{background:#b91c1c}@keyframes toast{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.small{font-size:12px;color:var(--muted)}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:11px;color:var(--muted);text-transform:uppercase}.table td{font-size:13px}
.adminSection{margin-top:22px}.hero{background:linear-gradient(135deg,#eff5ff,#f7f2ff);border:1px solid #dfe8ff}.hero h2{margin:0 0 7px;font-size:23px}.hero p{color:#5f6b7e}
.chapterDone{background:#ecfdf3;color:#15803d}.locked{opacity:.65}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.sidebar{position:sticky;top:70px;z-index:15;flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:9px}.navBtn{min-width:max-content;width:auto}.grid4{grid-template-columns:repeat(2,1fr)}.chapterLayout{grid-template-columns:1fr}.stickyCard{position:static}}
@media(max-width:650px){.topbar{padding:0 14px}.main{padding:16px}.grid3,.grid2,.grid4{grid-template-columns:1fr}.pageTitle{display:block}.pageTitle .row{margin-top:15px}.topUser span{display:none}.modalBox{padding:18px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getDatabase, ref, get, set, update, remove, push, onValue
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* Firebase configuration taken from the supplied project. */
const firebaseConfig = {
  apiKey: "AIzaSyD16NhAUgo3sgag01nZPZGHXjMvAZZ0rDE",
  authDomain: "focus-dashboard-5965a.firebaseapp.com",
  databaseURL: "https://focus-dashboard-5965a-default-rtdb.firebaseio.com",
  projectId: "focus-dashboard-5965a",
  storageBucket: "focus-dashboard-5965a.appspot.com",
  messagingSenderId: "337204334808",
  appId: "1:337204334808:web:9d0d36bed2fbae9b8147ad"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const ADMIN_EMAIL = "admin@admin.com";
const MAX_STUDENTS = 5;
const MAX_SUBJECTS = 50;

let currentUser = null;
let isAdmin = false;
let unsubscribeUser = null;
let unsubscribeCourses = null;
let currentPage = "dashboard";
let currentSubjectId = null;
let currentChapterId = null;
let studyTick = null;
let studyLast = 0;
let studyActive = false;
let pendingChapter = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const uid = () => Math.random().toString(36).slice(2)+Date.now().toString(36);
const fmtTime = ms => {
  ms = Math.max(0, Number(ms)||0);
  const h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000), s=Math.floor(ms%60000/1000);
  return [h,m,s].map((x,i)=>String(x).padStart(i===0?2:2,"0")).join(":");
};
const fmtDate = ts => ts ? new Date(ts).toLocaleString() : "—";
const youtubeId = url => {
  const s=String(url||"").trim();
  const m=s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : (s.match(/^[A-Za-z0-9_-]{6,}$/)||[])[0] || "";
};
const slug = s => String(s).trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

function toast(msg,type=""){
  const el=document.createElement("div"); el.className="toast "+type; el.textContent=msg;
  $("toastRoot").appendChild(el); setTimeout(()=>el.remove(),3000);
}
function loading(){return `<div class="empty">Loading…</div>`}

function loginView(error=""){
  $("root").innerHTML=`
  <div class="loginPage">
    <div class="loginCard">
      <div class="loginLogo">📚</div>
      <h1>StudyFlow LMS</h1>
      <p>Teacher and student learning management with Firebase real-time sync.</p>
      ${error?`<div class="badge badgeRed" style="margin-bottom:14px">${esc(error)}</div>`:""}
      <form id="loginForm">
        <div class="field"><label>Email / Student ID</label><input id="loginEmail" type="email" placeholder="student@example.com" required></div>
        <div class="field"><label>Password</label><input id="loginPassword" type="password" placeholder="Password" required></div>
        <button class="btn btnPrimary" style="width:100%;padding:13px">Sign in</button>
      </form>
      <div class="small" style="margin-top:15px">Teacher account: <b>${ADMIN_EMAIL}</b>. Any other valid Firebase Auth email is treated as a student.</div>
    </div>
  </div>`;
  $("loginForm").onsubmit=async e=>{
    e.preventDefault();
    try{
      await signInWithEmailAndPassword(auth,$("loginEmail").value.trim().toLowerCase(),$("loginPassword").value);
    }catch(err){ loginView("Login failed. Check the email/ID and password."); }
  };
}

function shell(){
  $("root").innerHTML=`
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="brandMark">S</div>StudyFlow</div>
      <div class="topUser"><span id="userEmail"></span><div class="avatar" id="avatar">U</div><button class="btn btnGhost btnSmall" id="logoutBtn">Logout</button></div>
    </header>
    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main" id="main">${loading()}</main>
    </div>
  </div>`;
  $("logoutBtn").onclick=()=>signOut(auth);
  $("userEmail").textContent=currentUser.email;
  $("avatar").textContent=(currentUser.email||"U")[0].toUpperCase();
  renderNav();
}

function renderNav(){
  $("sidebar").innerHTML = isAdmin ? `
    ${nav("dashboard","▦","Dashboard")}
    ${nav("subjects","📚","Subjects")}
    ${nav("students","👥","Students")}
  ` : `
    ${nav("dashboard","⌂","My Dashboard")}
    ${nav("subjects","📚","Subjects")}
    ${nav("progress","◔","My Progress")}
  `;
  document.querySelectorAll(".navBtn").forEach(b=>b.onclick=()=>{currentPage=b.dataset.page;renderPage();});
}
function nav(page,icon,label){return `<button class="navBtn ${currentPage===page?"active":""}" data-page="${page}">${icon}&nbsp; ${label}</button>`}

async function getUserData(){
  const snap=await get(ref(db,`users/${currentUser.uid}`));
  return snap.exists()?snap.val():{};
}
async function ensureUser(){
  if(isAdmin)return;
  const r=ref(db,`users/${currentUser.uid}/profile`);
  const s=await get(r);
  if(!s.exists()) await set(r,{email:currentUser.email,role:"student",createdAt:Date.now()});
}
async function getCourses(){
  const s=await get(ref(db,"courses"));
  return s.exists()?s.val():{};
}
async function getProgress(){
  const s=await get(ref(db,`progress/${currentUser.uid}`));
  return s.exists()?s.val():{};
}
function courseArray(courses){return Object.entries(courses).map(([id,v])=>({id,...v})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))}
function allChapters(c){
  const out=[];
  Object.entries(c.modules||{}).forEach(([mid,m])=>Object.entries(m.chapters||{}).forEach(([cid,ch])=>out.push({cid,mid,module:m,...ch})));
  return out;
}

async function renderPage(){
  if(!currentUser)return;
  renderNav();
  if(currentPage==="dashboard") return isAdmin?adminDashboard():studentDashboard();
  if(currentPage==="subjects") return isAdmin?adminSubjects():studentSubjects();
  if(currentPage==="students") return adminStudents();
  if(currentPage==="progress") return studentProgress();
}

async function studentDashboard(){
  $("main").innerHTML=loading();
  const [courses,prog,user]=await Promise.all([getCourses(),getProgress(),getUserData()]);
  const arr=courseArray(courses);
  const chapters=arr.flatMap(c=>allChapters(c));
  const done=chapters.filter(ch=>prog[ch.cid]?.completed).length;
  const pct=chapters.length?Math.round(done/chapters.length*100):0;
  $("main").innerHTML=`
    <div class="pageTitle"><div><h1>Welcome back 👋</h1><p>Continue your learning from where you stopped.</p></div></div>
    <div class="card hero" style="margin-bottom:18px"><h2>${esc(currentUser.email)}</h2><p>Your study time is recorded only while you are actively using the learning page. Remarks and “What I learned” responses are not stored permanently.</p></div>
    <div class="grid grid4">
      ${stat("📚","Subjects",arr.length)}
      ${stat("📖","Chapters",chapters.length)}
      ${stat("✓","Completed",done)}
      ${stat("⏱","Study Time",fmtTime(user.stats?.studyMs||0))}
    </div>
    <div class="card" style="margin-top:18px"><div class="between"><h3 style="margin:0">Overall Progress</h3><b>${pct}%</b></div><div class="progress" style="margin-top:12px"><div class="progressFill" style="width:${pct}%"></div></div></div>
    <div style="margin-top:22px"><div class="between"><h2 style="margin:0">Your Subjects</h2><button class="btn btnSoft btnSmall" onclick="go('subjects')">View all</button></div><div class="grid grid3" style="margin-top:14px">${arr.slice(0,6).map(subjectCard).join("")||`<div class="empty">No subjects have been published yet.</div>`}</div></div>`;
}
function stat(icon,label,value){return `<div class="card stat"><div class="statIcon">${icon}</div><div class="statLabel">${label}</div><div class="statValue">${esc(value)}</div></div>`}
function subjectCard(c){
  const n=allChapters(c).length;
  return `<div class="card subjectCard" onclick="openSubject('${c.id}')"><div class="between"><div class="subjectIcon">📘</div><span class="badge badgeBlue">${n} chapters</span></div><h3 style="margin:16px 0 5px">${esc(c.name)}</h3><div class="small">${Object.keys(c.modules||{}).length} modules</div></div>`;
}

async function studentSubjects(){
  const [courses,prog]=await Promise.all([getCourses(),getProgress()]);
  const arr=courseArray(courses);
  $("main").innerHTML=`<div class="pageTitle"><div><h1>Subjects</h1><p>Choose a subject and study module by module.</p></div><input class="search" id="subjectSearch" placeholder="Search subjects"></div><div id="subjectGrid" class="grid grid3">${arr.map(c=>subjectCardWithProgress(c,prog)).join("")||`<div class="empty">No subjects available.</div>`}</div>`;
  $("subjectSearch").oninput=e=>{
    const q=e.target.value.toLowerCase();
    $("subjectGrid").innerHTML=arr.filter(c=>c.name.toLowerCase().includes(q)).map(c=>subjectCardWithProgress(c,prog)).join("")||`<div class="empty">No matching subjects.</div>`;
  };
}
function subjectCardWithProgress(c,prog){
  const chapters=allChapters(c),done=chapters.filter(x=>prog[x.cid]?.completed).length,p=chapters.length?Math.round(done/chapters.length*100):0;
  return `<div class="card subjectCard" onclick="openSubject('${c.id}')"><div class="between"><div class="subjectIcon">📘</div><span class="badge ${p===100?"badgeGreen":"badgeBlue"}">${p}%</span></div><h3 style="margin:16px 0 5px">${esc(c.name)}</h3><div class="small">${Object.keys(c.modules||{}).length} modules · ${chapters.length} chapters</div><div class="progress" style="margin-top:13px"><div class="progressFill" style="width:${p}%"></div></div></div>`;
}

async function openSubject(id){
  currentSubjectId=id; currentPage="subjects";
  const [courses,prog]=await Promise.all([getCourses(),getProgress()]);
  const c=courses[id]; if(!c)return;
  $("main").innerHTML=`<div class="pageTitle"><div><button class="btn btnGhost btnSmall" onclick="go('subjects')">← Back</button><h1 style="margin-top:12px">${esc(c.name)}</h1><p>Study each module and complete every chapter.</p></div></div>
  <div>${Object.entries(c.modules||{}).map(([mid,m],i)=>moduleBlock(c,mid,m,i,prog)).join("")||`<div class="empty">No modules yet.</div>`}</div>`;
}
function moduleBlock(c,mid,m,i,prog){
  const ch=Object.entries(m.chapters||{});
  return `<div class="card" style="margin-bottom:16px"><div class="moduleHeader"><div><span class="badge badgeBlue">MODULE ${i+1}</span><h3 style="margin:8px 0 0">${esc(m.name)}</h3></div><span class="small">${ch.length} chapters</span></div>
  ${ch.map(([cid,x],n)=>{
    const done=!!prog[cid]?.completed;
    return `<div class="chapterRow"><div class="chapterNo">${n+1}</div><div style="flex:1"><b>${esc(x.name)}</b><div class="small">${x.questions?.length||0} assessment questions · ${x.task?"Task assigned":"No task"}</div></div>${done?`<span class="badge badgeGreen">Completed</span>`:""}<button class="btn ${done?"btnSuccess":"btnPrimary"} btnSmall" onclick="openChapter('${c.id}','${mid}','${cid}')">${done?"Review":"Start"}</button></div>`;
  }).join("")}</div>`;
}

async function openChapter(subjectId,moduleId,chapterId){
  currentSubjectId=subjectId;currentChapterId=chapterId;
  const [courses,prog]=await Promise.all([getCourses(),getProgress()]);
  const c=courses[subjectId],ch=c?.modules?.[moduleId]?.chapters?.[chapterId];
  if(!ch)return;
  stopStudyTimer();
  pendingChapter={subjectId,moduleId,chapterId,ch};
  const done=prog[chapterId]?.completed;
  const yt=youtubeId(ch.videoUrl||"");
  $("main").innerHTML=`<div class="pageTitle"><div><button class="btn btnGhost btnSmall" onclick="openSubject('${subjectId}')">← Back to ${esc(c.name)}</button><h1 style="margin-top:12px">${esc(ch.name)}</h1><p>${esc(c.modules[moduleId].name)}</p></div></div>
  <div class="chapterLayout">
    <section>
      <div class="card">
        <div class="between"><h3 style="margin:0">1. Watch the video</h3><span id="studyState" class="badge badgeOrange">Study timer active</span></div>
        <div class="videoWrap" style="margin-top:14px">${yt?`<iframe src="https://www.youtube.com/embed/${encodeURIComponent(yt)}?rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`:`<div style="height:100%;display:grid;place-items:center;color:#fff">No valid YouTube URL added.</div>`}</div>
      </div>
      <div class="card">
        <h3>2. Video remarks</h3><p class="small">Tell the teacher what you thought about the video. This response is intentionally not stored permanently.</p>
        <textarea id="remarks" rows="4" placeholder="Your remarks about the video..."></textarea>
      </div>
      <div class="card">
        <h3>3. What I learned</h3><p class="small">Write a short learning reflection. It is used only for this submission and is not stored permanently.</p>
        <textarea id="learned" rows="4" placeholder="What did you learn?"></textarea>
      </div>
      <div class="card"><h3>4. Assessment</h3>${renderQuestions(ch.questions||[])}</div>
      <div class="card"><h3>5. Task</h3><p>${esc(ch.task||"No task has been assigned for this chapter.")}</p><textarea id="taskAnswer" rows="5" placeholder="Write your task answer / submission..."></textarea></div>
      <div class="card"><button class="btn btnPrimary" style="width:100%;padding:13px" onclick="submitChapter()">Submit Chapter</button></div>
    </section>
    <aside class="stickyCard"><div class="card"><div class="statLabel">Chapter Progress</div><div style="font-size:34px;font-weight:850;margin-top:6px" id="chapterProgressText">${done?100:0}%</div><div class="progress" style="margin:12px 0 18px"><div id="chapterProgressBar" class="progressFill" style="width:${done?100:0}%"></div></div><div class="small">Study time this session</div><div id="sessionClock" style="font-size:25px;font-weight:850;margin-top:5px">00:00:00</div><div class="small" style="margin-top:12px">Only active visible study time is counted.</div></div></aside>
  </div>`;
  startStudyTimer();
}
function renderQuestions(qs){
  if(!qs.length)return `<div class="empty">No assessment has been added.</div>`;
  return qs.map((q,i)=>`<div style="margin-top:15px"><b>${i+1}. ${esc(q.text)}</b>${(q.options||[]).map((o,j)=>`<label class="checkRow"><input type="radio" name="q${i}" value="${j}"><span>${esc(o)}</span></label>`).join("")}</div>`).join("");
}

function startStudyTimer(){
  studyActive=true;studyLast=Date.now();let session=0;
  clearInterval(studyTick);
  studyTick=setInterval(async()=>{
    const active=studyActive && document.visibilityState==="visible" && document.hasFocus();
    const now=Date.now();const delta=Math.min(2000,Math.max(0,now-studyLast));studyLast=now;
    if(active){session+=delta; $("sessionClock").textContent=fmtTime(session);}
    if(active && delta>0 && currentUser){
      const r=ref(db,`users/${currentUser.uid}/stats/studyMs`);
      const s=await get(r);await set(r,(Number(s.val())||0)+delta);
    }
  },1000);
  document.addEventListener("visibilitychange",studyVisibility,{passive:true});
}
function studyVisibility(){studyLast=Date.now();}
function stopStudyTimer(){studyActive=false;clearInterval(studyTick);studyTick=null;document.removeEventListener("visibilitychange",studyVisibility)}
async function submitChapter(){
  if(!pendingChapter)return;
  const {chapterId,ch}=pendingChapter;
  const qs=ch.questions||[];let correct=0,answered=0;
  qs.forEach((q,i)=>{const x=document.querySelector(`input[name="q${i}"]:checked`);if(x){answered++;if(Number(x.value)===Number(q.answer))correct++;}});
  const score=qs.length?Math.round(correct/qs.length*100):100;
  if(qs.length && answered<qs.length){toast("Please answer every assessment question.","error");return}
  const taskAnswer=$("taskAnswer")?.value.trim()||"";
  if(ch.task && !taskAnswer){toast("Please submit the task answer.","error");return}
  const result={completed:true,score,correct,total:qs.length,taskSubmitted:!!taskAnswer,completedAt:Date.now()};
  await set(ref(db,`progress/${currentUser.uid}/${chapterId}`),result);
  stopStudyTimer();
  toast(`Chapter completed: ${score}%`,"success");
  setTimeout(()=>openChapter(pendingChapter.subjectId,pendingChapter.moduleId,pendingChapter.chapterId),500);
}

async function studentProgress(){
  const [courses,prog,user]=await Promise.all([getCourses(),getProgress(),getUserData()]);
  const arr=courseArray(courses);
  $("main").innerHTML=`<div class="pageTitle"><div><h1>My Progress</h1><p>Your completed chapters, scores and total active study time.</p></div></div>
  <div class="grid grid3">${arr.map(c=>{
    const ch=allChapters(c),done=ch.filter(x=>prog[x.cid]?.completed),p=ch.length?Math.round(done.length/ch.length*100):0;
    const avg=done.length?Math.round(done.reduce((a,x)=>a+(prog[x.cid]?.score||0),0)/done.length):0;
    return `<div class="card"><div class="between"><h3 style="margin:0">${esc(c.name)}</h3><span class="badge badgeBlue">${p}%</span></div><div class="progress" style="margin:14px 0"><div class="progressFill" style="width:${p}%"></div></div><div class="small">${done.length}/${ch.length} chapters completed · Avg. score ${avg}%</div></div>`
  }).join("")||`<div class="empty">No subjects yet.</div>`}</div>
  <div class="card" style="margin-top:18px"><div class="statLabel">TOTAL ACTIVE STUDY TIME</div><div style="font-size:38px;font-weight:850;margin-top:5px">${fmtTime(user.stats?.studyMs||0)}</div></div>`;
}

/* ---------- ADMIN ---------- */
async function adminDashboard(){
  const [courses,users]=await Promise.all([getCourses(),get(ref(db,"users"))]);
  const us=users.exists()?users.val():{};
  const students=Object.values(us).filter(u=>u.profile?.email && u.profile.email!==ADMIN_EMAIL);
  const arr=courseArray(courses);
  const chapters=arr.flatMap(allChapters);
  let completed=0,totalScore=0,scoreCount=0,totalMs=0;
  students.forEach(u=>{totalMs+=Number(u.stats?.studyMs||0)});
  const rows=[];
  for(const u of students){
    const p=u.progress||{};
    Object.values(p).forEach(x=>{if(x.completed){completed++;totalScore+=Number(x.score||0);scoreCount++}});
  }
  $("main").innerHTML=`<div class="pageTitle"><div><h1>Teacher Dashboard</h1><p>Manage learning content and monitor student performance.</p></div><button class="btn btnPrimary" onclick="openSubjectEditor()">+ New Subject</button></div>
  <div class="grid grid4">
    ${stat("👥","Students",students.length+"/"+MAX_STUDENTS)}
    ${stat("📚","Subjects",arr.length+"/"+MAX_SUBJECTS)}
    ${stat("📖","Chapters",chapters.length)}
    ${stat("⏱","Study Time",fmtTime(totalMs))}
  </div>
  <div class="grid grid2 adminSection">
    <div class="card"><div class="between"><h3 style="margin:0">Learning Completion</h3><b>${chapters.length?Math.round(completed/(chapters.length*Math.max(students.length,1))*100):0}%</b></div><div class="progress" style="margin-top:13px"><div class="progressFill" style="width:${chapters.length?Math.min(100,completed/(chapters.length*Math.max(students.length,1))*100):0}%"></div></div><p class="small">Average assessment score: ${scoreCount?Math.round(totalScore/scoreCount):0}%</p></div>
    <div class="card"><h3 style="margin-top:0">Quick Actions</h3><div class="row" style="flex-wrap:wrap"><button class="btn btnSoft" onclick="go('subjects')">Manage Subjects</button><button class="btn btnSoft" onclick="go('students')">View Students</button></div></div>
  </div>
  <div class="card adminSection"><div class="between"><h3 style="margin:0">Subjects</h3><button class="btn btnSoft btnSmall" onclick="go('subjects')">Manage</button></div><div class="grid grid3" style="margin-top:14px">${arr.slice(0,6).map(subjectCardAdmin).join("")||`<div class="empty">Create your first subject.</div>`}</div></div>`;
}
function subjectCardAdmin(c){return `<div class="listItem"><div class="between"><b>${esc(c.name)}</b><span class="badge badgeBlue">${allChapters(c).length} chapters</span></div><div class="small" style="margin:7px 0 12px">${Object.keys(c.modules||{}).length} modules</div><button class="btn btnSoft btnSmall" onclick="editSubject('${c.id}')">Open & Edit</button></div>`}

async function adminSubjects(){
  const courses=await getCourses(),arr=courseArray(courses);
  $("main").innerHTML=`<div class="pageTitle"><div><h1>Subject Management</h1><p>Create subjects, unlimited modules and separate chapters.</p></div><button class="btn btnPrimary" onclick="openSubjectEditor()">+ Add Subject</button></div>
  <div class="grid grid2">${arr.map(c=>adminSubjectEditorCard(c)).join("")||`<div class="empty">No subjects created.</div>`}</div>`;
}
function adminSubjectEditorCard(c){
  return `<div class="card"><div class="between"><div><span class="badge badgeBlue">SUBJECT</span><h3 style="margin:8px 0">${esc(c.name)}</h3></div><button class="btn btnDanger btnSmall" onclick="deleteSubject('${c.id}')">Delete</button></div>
  <div class="small">${Object.keys(c.modules||{}).length} modules · ${allChapters(c).length} chapters</div>
  <div class="row" style="margin-top:14px"><button class="btn btnPrimary btnSmall" onclick="editSubject('${c.id}')">Manage Modules</button></div></div>`;
}

async function editSubject(id){
  const courses=await getCourses(),c=courses[id];if(!c)return;
  $("main").innerHTML=`<div class="pageTitle"><div><button class="btn btnGhost btnSmall" onclick="go('subjects')">← Subjects</button><h1 style="margin-top:12px">${esc(c.name)}</h1><p>Every module can contain any number of separate chapters.</p></div><button class="btn btnPrimary" onclick="openModuleEditor('${id}')">+ Add Module</button></div>
  <div id="moduleList">${Object.entries(c.modules||{}).map(([mid,m],i)=>adminModuleBlock(id,mid,m,i)).join("")||`<div class="empty">No modules. Add the first module above.</div>`}</div>`;
}
function adminModuleBlock(sid,mid,m,i){
  const ch=Object.entries(m.chapters||{});
  return `<div class="card" style="margin-bottom:16px"><div class="between"><div><span class="badge badgeBlue">MODULE ${i+1}</span><h3 style="margin:8px 0">${esc(m.name)}</h3></div><div class="row"><button class="btn btnSoft btnSmall" onclick="openModuleEditor('${sid}','${mid}')">Edit</button><button class="btn btnDanger btnSmall" onclick="deleteModule('${sid}','${mid}')">Delete</button></div></div>
  ${ch.map(([cid,x],n)=>`<div class="chapterRow"><div class="chapterNo">${n+1}</div><div style="flex:1"><b>${esc(x.name)}</b><div class="small">${x.videoUrl?"YouTube video":"No video"} · ${x.questions?.length||0} questions</div></div><button class="btn btnSoft btnSmall" onclick="openChapterEditor('${sid}','${mid}','${cid}')">Edit</button><button class="btn btnDanger btnSmall" onclick="deleteChapter('${sid}','${mid}','${cid}')">Delete</button></div>`).join("")}
  <button class="btn btnPrimary btnSmall" style="margin-top:12px" onclick="openChapterEditor('${sid}','${mid}')">+ Add Chapter</button></div>`;
}

function openSubjectEditor(id=""){
  showModal(`<h2>${id?"Edit":"Create"} Subject</h2><div class="field"><label>Subject Name</label><input id="mSubjectName" value="${id?esc(""):""}" placeholder="e.g. Mathematics"></div><div class="row" style="justify-content:flex-end"><button class="btn btnGhost" onclick="closeModal()">Cancel</button><button class="btn btnPrimary" onclick="saveSubject('${id}')">Save</button></div>`);
}
async function saveSubject(id){
  const name=$("mSubjectName").value.trim();if(!name)return toast("Enter subject name.","error");
  const courses=await getCourses();
  if(!id && Object.keys(courses).length>=MAX_SUBJECTS)return toast("Maximum 50 subjects reached.","error");
  const subject={name,createdAt:id?(courses[id]?.createdAt||Date.now()):Date.now(),modules:id?(courses[id]?.modules||{}):{}};
  const key=id?id:push(ref(db,"courses")).key;
  await set(ref(db,`courses/${key}`),subject);closeModal();toast("Subject saved.","success");go("subjects");
}
function openModuleEditor(sid,mid=""){
  getCourses().then(courses=>{
    const m=mid?courses[sid]?.modules?.[mid]:null;
    showModal(`<h2>${mid?"Edit":"Add"} Module</h2><div class="field"><label>Module Name</label><input id="mModuleName" value="${esc(m?.name||"")}" placeholder="e.g. Module 1 - Algebra"></div><div class="row" style="justify-content:flex-end"><button class="btn btnGhost" onclick="closeModal()">Cancel</button><button class="btn btnPrimary" onclick="saveModule('${sid}','${mid}')">Save</button></div>`);
  });
}
async function saveModule(sid,mid){
  const name=$("mModuleName").value.trim();if(!name)return toast("Enter module name.","error");
  const courses=await getCourses(),c=courses[sid];if(!c)return;
  const key=mid||push(ref(db,`courses/${sid}/modules`)).key;
  await set(ref(db,`courses/${sid}/modules/${key}`),{name,chapters:mid?(c.modules?.[mid]?.chapters||{}):{},createdAt:mid?(c.modules?.[mid]?.createdAt||Date.now()):Date.now()});
  closeModal();toast("Module saved.","success");editSubject(sid);
}
async function openChapterEditor(sid,mid,cid=""){
  const courses=await getCourses(),ch=cid?courses[sid]?.modules?.[mid]?.chapters?.[cid]:null;
  const questions=ch?.questions||[];
  showModal(`<h2>${cid?"Edit":"Add"} Chapter</h2>
  <div class="field"><label>Chapter Name</label><input id="chName" value="${esc(ch?.name||"")}" placeholder="Chapter 1"></div>
  <div class="field"><label>YouTube URL</label><input id="chVideo" value="${esc(ch?.videoUrl||"")}" placeholder="https://www.youtube.com/watch?v=..."></div>
  <div class="field"><label>Task</label><textarea id="chTask" rows="3" placeholder="Task to complete">${esc(ch?.task||"")}</textarea></div>
  <div class="field"><label>Assessment Questions</label><div id="questionEditor">${questions.map((q,i)=>questionEditor(q,i)).join("")}</div><button class="btn btnSoft btnSmall" onclick="addQuestionEditor()">+ Add Question</button></div>
  <div class="row" style="justify-content:flex-end"><button class="btn btnGhost" onclick="closeModal()">Cancel</button><button class="btn btnPrimary" onclick="saveChapter('${sid}','${mid}','${cid}')">Save Chapter</button></div>`);
}
function questionEditor(q={},i){
  return `<div class="listItem questionEditor" style="margin-top:8px"><div class="between"><b>Question ${i+1}</b><button class="btn btnDanger btnSmall" onclick="this.closest('.questionEditor').remove()">Remove</button></div><div class="field" style="margin-top:10px"><label>Question</label><input class="qText" value="${esc(q.text||"")}"></div><div class="grid grid2">${[0,1,2,3].map(j=>`<div class="field"><label>Option ${String.fromCharCode(65+j)}</label><input class="qOpt" value="${esc(q.options?.[j]||"")}"></div>`).join("")}</div><div class="field"><label>Correct Option</label><select class="qAnswer"><option value="0" ${q.answer==0?"selected":""}>A</option><option value="1" ${q.answer==1?"selected":""}>B</option><option value="2" ${q.answer==2?"selected":""}>C</option><option value="3" ${q.answer==3?"selected":""}>D</option></select></div></div>`;
}
window.addQuestionEditor=()=>{const box=$("questionEditor");box.insertAdjacentHTML("beforeend",questionEditor({},box.children.length))}
async function saveChapter(sid,mid,cid){
  const name=$("chName").value.trim(),videoUrl=$("chVideo").value.trim(),task=$("chTask").value.trim();
  if(!name)return toast("Enter chapter name.","error");
  const questions=[...document.querySelectorAll(".questionEditor")].map(el=>{
    const opts=[...el.querySelectorAll(".qOpt")].map(x=>x.value.trim());
    return {text:el.querySelector(".qText").value.trim(),options:opts,answer:Number(el.querySelector(".qAnswer").value)};
  }).filter(q=>q.text && q.options.every(Boolean));
  const courses=await getCourses();
  const key=cid||push(ref(db,`courses/${sid}/modules/${mid}/chapters`)).key;
  await set(ref(db,`courses/${sid}/modules/${mid}/chapters/${key}`),{name,videoUrl,task,questions,createdAt:cid?(courses[sid].modules[mid].chapters[cid].createdAt||Date.now()):Date.now()});
  closeModal();toast("Chapter saved.","success");editSubject(sid);
}
async function deleteSubject(id){if(!confirm("Delete this subject and all its modules/chapters?"))return;await remove(ref(db,`courses/${id}`));toast("Subject deleted.","success");go("subjects")}
async function deleteModule(sid,mid){if(!confirm("Delete this module and its chapters?"))return;await remove(ref(db,`courses/${sid}/modules/${mid}`));toast("Module deleted.","success");editSubject(sid)}
async function deleteChapter(sid,mid,cid){if(!confirm("Delete this chapter?"))return;await remove(ref(db,`courses/${sid}/modules/${mid}/chapters/${cid}`));toast("Chapter deleted.","success");editSubject(sid)}

async function adminStudents(){
  const snap=await get(ref(db,"users")),users=snap.exists()?snap.val():{};
  const arr=Object.entries(users).filter(([id,u])=>u.profile?.email && u.profile.email!==ADMIN_EMAIL);
  $("main").innerHTML=`<div class="pageTitle"><div><h1>Students</h1><p>Any Firebase Auth account except ${ADMIN_EMAIL} is treated as a student.</p></div><span class="badge ${arr.length>=MAX_STUDENTS?"badgeRed":"badgeBlue"}">${arr.length}/${MAX_STUDENTS} students</span></div>
  <div class="card"><div class="tableWrap"><table class="table"><thead><tr><th>Student</th><th>Study Time</th><th>Completed</th><th>Average Score</th></tr></thead><tbody>${arr.map(([id,u])=>{
    const p=u.progress||{},vals=Object.values(p).filter(x=>x.completed),avg=vals.length?Math.round(vals.reduce((a,x)=>a+Number(x.score||0),0)/vals.length):0;
    return `<tr><td><b>${esc(u.profile.email)}</b><div class="small">${id}</div></td><td>${fmtTime(u.stats?.studyMs||0)}</td><td>${vals.length}</td><td>${avg}%</td></tr>`
  }).join("")||`<tr><td colspan="4">No students have signed in yet.</td></tr>`}</tbody></table></div></div>
  <div class="card" style="margin-top:18px"><p class="small">Student creation is handled by Firebase Authentication. This website deliberately does not maintain a separate whitelist, so a successful non-teacher login is automatically a student.</p></div>`;
}

window.openModuleEditor=openModuleEditor;
window.saveModule=saveModule;
window.openChapterEditor=openChapterEditor;
window.saveChapter=saveChapter;
window.deleteSubject=deleteSubject;
window.deleteModule=deleteModule;
window.deleteChapter=deleteChapter;

onAuthStateChanged(auth,async user=>{
  stopStudyTimer();
  currentUser=user;
  if(!user){isAdmin=false;loginView();return}
  isAdmin=(user.email||"").toLowerCase()===ADMIN_EMAIL;
  await ensureUser();
  shell();
  await renderPage();
});
